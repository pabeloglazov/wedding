<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Своя игра · Белоглазов</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d0b22">
<link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/brand.css">
<script src="../assets/brand.js"></script>
<script src="../assets/acct.js?v=1"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-database-compat.js"></script>
<style>
:root{--acc:#6d4dff;--bg:#131312;--card:#1c1c1b;--card2:#242423;--line:rgba(255,255,255,.1);--ink:#fff;--text:#e8e8e6;--muted:#a3a3a3;--gold:#f2efe9;--ok:#3fbf7f;--bad:#e5645a;
  --hf:Unbounded,Manrope,system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;color:inherit}
input,textarea,select{font:inherit;color:inherit}
a{color:var(--gold)}
svg{display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 20px;font-weight:700;font-size:15px;text-decoration:none;transition:transform .12s,background .2s,opacity .2s;white-space:nowrap;background:var(--card2);color:var(--ink)}
.btn:active{transform:scale(.97)}
.btn.gold{background:var(--gold);color:#131312}
.btn.acc{background:var(--acc);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid rgba(255,255,255,.24)}
.btn.ghost:hover{background:rgba(255,255,255,.08)}
.btn.sm{padding:8px 14px;font-size:13px}
.hbtns{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0 18px}.hbtns .btn{border-radius:12px;padding:11px 18px;font-size:14px}
.btn.ok{background:var(--ok);color:#fff}.btn.bad{background:var(--bad);color:#fff}
.btn[disabled]{opacity:.35;pointer-events:none}
.muted{color:var(--muted)}
.k{letter-spacing:.2em;text-transform:uppercase;font-weight:800;font-size:11px;color:var(--muted)}
.top{position:sticky;top:0;z-index:20;background:rgba(19,19,18,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .in{max-width:1240px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px;min-height:60px}
.top .brand{text-decoration:none;color:var(--ink)}
.top .sp{flex:1}
.acc{display:flex;align-items:center;gap:10px}
.tag{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;border:1px solid rgba(242,239,233,.3);border-radius:99px;padding:5px 10px;color:var(--gold)}
.wrap{max-width:980px;margin:0 auto;padding:28px 20px 140px}
.hero h1{font-family:var(--hf);font-weight:700;font-size:clamp(30px,5vw,48px);line-height:1.05;margin:6px 0 10px;text-transform:uppercase;letter-spacing:-.01em}
.hero p{margin:0 0 22px;color:var(--muted);max-width:640px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:16px}
.card h3{margin:0 0 14px;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:800;display:flex;align-items:center;gap:10px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld label,.lbl{font-size:13px;font-weight:700;color:var(--muted)}
.inp{width:100%;background:#141413;border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:12px 14px;font-size:15px;outline:none;color:var(--ink)}
.inp:focus{border-color:var(--acc)}
textarea.inp{resize:vertical;min-height:84px;line-height:1.4}
.row{display:grid;gap:12px}
.r2{grid-template-columns:1fr 1fr}.r3{grid-template-columns:2fr 1fr 1fr}
@media (max-width:640px){.r2,.r3{grid-template-columns:1fr}}
.seg{display:inline-flex;background:#141413;border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:10px;padding:9px 14px;font-weight:700;font-size:14px;color:var(--muted);display:inline-flex;align-items:center;gap:7px}
.seg button.on{background:var(--card2);color:var(--ink);box-shadow:0 0 0 1px rgba(255,255,255,.12) inset}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border:1px solid var(--line);background:#141413;border-radius:12px;padding:9px 14px;font-weight:800;font-size:14px;color:var(--muted)}
.tabs button.on{border-color:var(--acc);color:var(--ink);background:color-mix(in srgb,var(--acc) 22%,#141413)}
.tabs .add{color:var(--ink);border-style:dashed}
/* редактор табло */
.ed-board{display:flex;flex-direction:column;gap:8px}
.ed-vals,.ed-cat{display:grid;grid-template-columns:minmax(150px,1.6fr) repeat(5,minmax(0,1fr)) 36px;gap:8px;align-items:stretch}
.ed-vals .inp{text-align:center;padding:8px 6px;font-weight:800}
.ed-vals .lbl{align-self:center}
.ed-cat .inp.cn{font-weight:800;background:color-mix(in srgb,var(--acc) 16%,#141413);border-color:color-mix(in srgb,var(--acc) 40%,transparent)}
.cell{border:1px solid rgba(255,255,255,.14);background:#141413;border-radius:12px;font-weight:800;font-size:16px;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;position:relative;padding:4px}
.cell small{font-size:10px;font-weight:700;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
.cell.emp{border-style:dashed;color:var(--muted)}
.cell.sel{border-color:var(--acc);box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 55%,transparent)}
.cell .md{position:absolute;top:4px;right:5px;opacity:.7}
.icb{border:0;background:none;color:var(--muted);border-radius:10px;display:grid;place-items:center}
.icb:hover{background:rgba(255,255,255,.07);color:var(--ink)}
.qed{margin-top:14px;border:1px solid color-mix(in srgb,var(--acc) 45%,transparent);background:color-mix(in srgb,var(--acc) 7%,#171716);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.qed .hd{display:flex;align-items:center;gap:10px;font-weight:800}
.qed .hd .sp{flex:1}
.hint{font-size:12.5px;color:var(--muted)}
.opt{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.opt:first-of-type{border-top:0;padding-top:0}
.opt .tx{flex:1;min-width:0}.opt .tx b{display:block;font-size:15px}.opt .tx span{font-size:13px;color:var(--muted)}
.sw{position:relative;width:46px;height:28px;border-radius:99px;background:#3a3a39;border:0;flex:none;transition:background .2s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:var(--acc)}.sw.on:after{transform:translateX(18px)}
.swatches{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.swatches button{width:36px;height:36px;border-radius:50%;border:2px solid transparent;box-shadow:0 0 0 1px rgba(255,255,255,.18) inset}
.swatches button.on{border-color:#fff}
.swatches input[type=color]{width:36px;height:36px;border:0;padding:0;background:none;border-radius:50%;overflow:hidden;cursor:pointer}
.lock{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#e5b45c;border:1px solid rgba(229,180,92,.4);border-radius:99px;padding:4px 9px}
.locked .swatches{opacity:.45;pointer-events:none}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(19,19,18,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.bar .in{max-width:980px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:16px}
.bar .in .t{flex:1;min-width:0}.bar .in .t b{display:block}.bar .in .t span{font-size:13px;color:var(--muted)}
.bar .btn{padding:15px 28px;font-size:16px}
.notice{display:flex;gap:12px;align-items:center;border:1px solid rgba(229,180,92,.35);background:rgba(229,180,92,.08);border-radius:16px;padding:14px 16px;margin-bottom:16px;font-size:14px}
.notice .sp{flex:1}
.modal{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:20px}
.modal.on{display:flex}
.modal .box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;max-width:440px;width:100%}
.modal h3{margin:0 0 10px}
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);background:#2a2a29;color:#fff;border-radius:99px;padding:10px 18px;font-weight:700;font-size:14px;opacity:0;transition:.25s;z-index:99;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ===== пульт ведущего ===== */
.live{max-width:1320px;margin:0 auto;padding:18px 20px 40px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px;align-items:start}
@media (max-width:980px){.live{grid-template-columns:1fr}}
.pane{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}
.pane h4{margin:0 0 12px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:800;display:flex;align-items:center;gap:10px}
.pane h4 .sp{flex:1}
.nextb{width:100%;padding:18px;font-size:18px;border-radius:18px;margin-bottom:12px}
.mb{display:grid;gap:5px}
.mb .r{display:grid;gap:5px}
.mb .cn{font-size:12px;font-weight:800;padding:6px 8px;border-radius:9px;background:color-mix(in srgb,var(--acc) 22%,#141413);display:flex;align-items:center;line-height:1.15;overflow:hidden}
.mb button{border:1px solid rgba(255,255,255,.12);background:#141413;border-radius:9px;font-weight:800;font-size:14px;padding:8px 0;color:var(--ink)}
.mb button:hover{border-color:var(--acc)}
.mb button.pl{opacity:.28}
.mb button.cur{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 30%,#141413)}
.qc .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:4px 11px;font-size:12px;font-weight:800;background:#141413;border:1px solid var(--line)}
.chip.a{background:color-mix(in srgb,var(--acc) 30%,#141413);border-color:transparent}
.qc .qt{font-size:19px;font-weight:700;line-height:1.3;margin:0 0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qc .an span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.qc.idle .qt,.qc.idle .an{opacity:.45}
.qc .buzz{min-height:56px;box-sizing:border-box}
.qc .an{border-radius:12px;background:rgba(63,191,127,.12);border:1px solid rgba(63,191,127,.3);padding:10px 12px;font-weight:800;color:#8fe0b5;margin-bottom:12px}
.qc .an small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#6fbf95}
.buzz{border-radius:14px;border:1px solid var(--line);padding:12px;margin-bottom:12px}
.buzz.on{border-color:color-mix(in srgb,var(--acc) 70%,transparent);background:color-mix(in srgb,var(--acc) 12%,transparent)}
.buzz .who{display:flex;align-items:center;gap:10px}
.buzz .who b{font-size:20px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.buzz .ql{font-size:13px;color:var(--muted);margin-top:8px}
.tl{display:flex;flex-direction:column;gap:6px}
.tm{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:#171716}
.tm .n{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm .s{font-weight:800;min-width:56px;text-align:right;font-variant-numeric:tabular-nums}
.tm .dot{width:8px;height:8px;border-radius:50%;background:#555;flex:none}.tm .dot.on{background:var(--ok)}
.tm .pm{border:1px solid var(--line);background:#141413;border-radius:9px;padding:5px 9px;font-weight:800;font-size:13px}
.tm .pm.p{color:#8fe0b5}.tm .pm.m{color:#f0a79f}
.tm .ed{border:0;background:none;color:var(--muted);padding:4px}
.ctlr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.ctlr button{border:1px solid var(--line);background:#171716;border-radius:14px;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:700;font-size:12px;padding:6px}
.ctlr button.on{background:var(--gold);color:#131312;border-color:transparent}
.ctlr button[disabled]{opacity:.35}
.codebox{display:flex;align-items:center;gap:12px;margin-top:12px}
.codebox b{font-family:var(--hf);font-size:17px;letter-spacing:.04em;font-weight:600}
.stw{border-radius:16px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.4)}

/* ===== экран (проектор) ===== */
.stage{position:relative;width:100%;aspect-ratio:16/9;container-type:inline-size;overflow:hidden;color:#fff;
  --bgk:color-mix(in srgb,var(--acc) 14%,#06050f);
  background:radial-gradient(120% 95% at 0% 100%,color-mix(in srgb,var(--acc) 62%,transparent) 0%,transparent 58%),radial-gradient(90% 80% at 100% 0%,color-mix(in srgb,var(--acc) 34%,transparent) 0%,transparent 60%),radial-gradient(60% 60% at 75% 90%,color-mix(in srgb,var(--acc) 22%,#ff3d8b 10%) 0%,transparent 70%),var(--bgk)}
.stage .in{position:absolute;inset:0;font-size:1.5625cqw;display:flex;flex-direction:column;padding:2.2em 2.6em 2.2em}
.stage .brandm{position:absolute;right:4.06cqw;top:3.83cqw;transition:opacity .3s;font-size:1.5625cqw;display:flex;align-items:center;gap:.6em;opacity:.9;pointer-events:none}
.stage .brandm img{height:1.05em;width:auto;display:block}
.stage .brandm svg{width:1.9em;height:1.9em}
/* табло */
.board{flex:1;display:grid;gap:.6em;min-height:0}
.board .r{display:grid;gap:.6em;min-height:0}
.board .c,.board .v{border-radius:.9em;display:flex;align-items:center;justify-content:center;min-height:0;border:1px solid rgba(255,255,255,.14);box-shadow:0 .4em 1.2em rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.14)}
.board .c{background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 62%,#fff 6%),color-mix(in srgb,var(--acc) 40%,#0b0a1f));font-weight:800;font-size:1.15em;line-height:1.15;text-align:center;padding:.3em .7em;overflow:hidden}
.board .v{background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.05));backdrop-filter:blur(6px);font-family:var(--hf);font-weight:600;font-size:2.4em;letter-spacing:-.01em;transition:opacity .5s,transform .4s}
.board .v.pl{opacity:.16}
.board .v.cur{animation:cpulse 1s ease-in-out infinite;background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 70%,#fff 10%),color-mix(in srgb,var(--acc) 40%,transparent))}
@keyframes cpulse{50%{transform:scale(1.05)}}
.rnd{display:flex;align-items:center;gap:.8em;margin-bottom:1em}
.rnd b{font-family:var(--hf);font-size:1.5em;font-weight:600;letter-spacing:.02em;text-transform:uppercase}
.rnd .sp{flex:1}
.rnd .cd{font-weight:800;font-size:1.05em;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:99px;padding:.35em .9em}
/* заставка клетки */
.splash{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.2em}
.splash .cat{font-size:3.2em;font-weight:800;line-height:1.1;max-width:90%;animation:spIn .6s cubic-bezier(.2,.9,.2,1) both}
.splash .val{font-family:var(--hf);font-weight:700;font-size:9.5em;line-height:1;text-shadow:0 0 .35em color-mix(in srgb,var(--acc) 90%,transparent);animation:spIn .8s .15s cubic-bezier(.2,.9,.2,1) both}
@keyframes spIn{from{opacity:0;transform:scale(.6);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
/* вопрос */
.qtop{display:flex;align-items:center;gap:.7em;margin-bottom:1em}
.qtop .chip2{font-weight:800;font-size:1.05em;border-radius:99px;padding:.35em 1em;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qtop .vv{font-family:var(--hf);font-weight:700;font-size:1.25em;border-radius:99px;padding:.25em .9em;background:color-mix(in srgb,var(--acc) 80%,#fff 5%)}
.qtop .sp{flex:1}
.qmain{flex:1;min-height:0;display:flex;gap:2em;align-items:stretch}
.qmain .qtx{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;text-align:center}
.qmain .qtx p{margin:0;font-weight:800;font-size:3em;line-height:1.15;letter-spacing:-.005em}
.qmain.hasm .qtx{justify-content:flex-start;text-align:left}
.qmain .qm{flex:1.1;min-width:0;border-radius:1.2em;overflow:hidden;position:relative;background:rgba(0,0,0,.35);box-shadow:0 1em 2.6em rgba(0,0,0,.4)}
.qmain .qm img{width:100%;height:100%;object-fit:contain;display:block;position:relative}
.qmain .qm .bgb{position:absolute;inset:-20px;background-size:cover;background-position:center;filter:blur(24px) brightness(.55)}
.qm iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.qm.aud iframe{opacity:0;pointer-events:none}
.qm .cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1em;font-weight:800;letter-spacing:.3em;text-transform:uppercase;font-size:1.1em}
.eq{display:flex;align-items:flex-end;gap:.45em;height:5em}
.eq i{width:1.1em;border-radius:.4em;background:#fff;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.4s}.eq i:nth-child(3){animation-delay:-.2s}.eq i:nth-child(4){animation-delay:-.7s}.eq i:nth-child(5){animation-delay:-.1s}
@keyframes eq{0%,100%{height:25%}50%{height:100%}}
.qfoot{height:5.4em;margin-top:1.2em;display:flex;align-items:center;justify-content:center;gap:1em}
.bzp{display:inline-flex;align-items:center;gap:.7em;border-radius:99px;padding:.6em 1.6em .6em .7em;background:#fff;color:#14112b;font-weight:800;font-size:1.7em;animation:bzIn .45s cubic-bezier(.2,1.4,.3,1) both;box-shadow:0 0 0 .3em color-mix(in srgb,var(--acc) 50%,transparent),0 .8em 2em rgba(0,0,0,.35)}
.bzp i{width:1.5em;height:1.5em;border-radius:50%;background:var(--acc);display:grid;place-items:center;color:#fff;font-style:normal}
.bzp i svg{width:.9em;height:.9em}
@keyframes bzIn{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}
.bzq{font-weight:700;font-size:1.15em;opacity:.8}
.hintb{font-weight:700;font-size:1.25em;opacity:.75;display:flex;align-items:center;gap:.6em}
.hintb svg{width:1.3em;height:1.3em}
/* ответ */
.ansv{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.6em;min-height:0}
.ansv .lb{font-weight:800;letter-spacing:.3em;text-transform:uppercase;font-size:1.05em;opacity:.75}
.ansv .a{font-family:var(--hf);font-weight:600;font-size:4.6em;line-height:1.05;max-width:92%;animation:spIn .7s cubic-bezier(.2,.9,.2,1) both}
.ansv .q{font-size:1.3em;font-weight:600;opacity:.7;max-width:80%}
.ansv .img{height:11em;border-radius:1em;overflow:hidden;box-shadow:0 .8em 2em rgba(0,0,0,.4)}
.ansv .img img{height:100%;display:block}
.gain{display:inline-flex;align-items:center;gap:.6em;border-radius:99px;padding:.45em 1.3em;font-weight:800;font-size:1.6em;background:#2fbf74;animation:bzIn .5s .3s both}
.gain.no{background:rgba(255,255,255,.14)}
/* лобби */
.lob{flex:1;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3em;align-items:center;min-width:0}.lob>div:first-child{min-width:0}
.lob .kk{font-weight:800;letter-spacing:.3em;text-transform:uppercase;opacity:.75;font-size:1.05em}
.lob h1{font-family:var(--hf);font-weight:700;font-size:3.8em;line-height:1;margin:.25em 0 .4em;text-transform:uppercase}
.lob .teams{display:flex;flex-wrap:wrap;gap:.5em}
.lob .teams span{border-radius:99px;padding:.4em 1em;background:rgba(255,255,255,.14);font-weight:800;font-size:1.15em;animation:bzIn .4s both}
.lob .teams .ph{opacity:.6;background:none;border:1px dashed rgba(255,255,255,.35)}
.joinc{background:#fff;color:#14112b;border-radius:1.4em;padding:1.6em;display:flex;flex-direction:column;align-items:center;gap:.8em;box-shadow:0 1.2em 3em rgba(0,0,0,.35)}
.joinc .qr{width:14em;height:14em}.joinc .qr img,.joinc .qr canvas{width:100%!important;height:100%!important}
.joinc .u{font-weight:800;font-size:1.3em}
.joinc .cd{font-family:var(--hf);font-weight:700;font-size:2.6em;letter-spacing:.06em;line-height:1}
.joinc small{font-weight:700;opacity:.6;font-size:.95em}
/* таблица очков */
.scv{flex:1;display:flex;flex-direction:column;min-height:0}
.scv h2{font-family:var(--hf);font-weight:600;font-size:2.4em;margin:0 0 .6em;text-transform:uppercase}
.scl{display:flex;flex-direction:column;gap:.55em;flex:1;min-height:0;justify-content:flex-start}
.scr{display:grid;grid-template-columns:2.6em 1fr auto;align-items:center;gap:1em;border-radius:1em;padding:.55em 1.2em;background:linear-gradient(90deg,rgba(255,255,255,.14),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.14);animation:rowIn .5s both}
.scr .p{font-family:var(--hf);font-weight:700;font-size:1.6em;opacity:.8}
.scr .n{font-weight:800;font-size:1.7em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scr .s{font-family:var(--hf);font-weight:700;font-size:2em}
.scr.top1{background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 85%,#fff 8%),color-mix(in srgb,var(--acc) 35%,transparent))}
@keyframes rowIn{from{opacity:0;transform:translateX(-2em)}to{opacity:1;transform:none}}
/* финал */
.fin{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-height:0}
.fin h1{font-family:var(--hf);font-weight:700;font-size:3.4em;margin:0 0 .3em;text-transform:uppercase;text-align:center}
.pod{display:flex;align-items:flex-end;gap:1.2em;width:80%;flex:1;max-height:70%}
.pod>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.pod .nm{font-weight:800;font-size:1.7em;text-align:center;margin-bottom:.15em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .sc{font-weight:700;font-size:1.2em;opacity:.8;margin-bottom:.5em}
.pod .bl{width:100%;border-radius:1em 1em 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:.4em;font-family:var(--hf);font-weight:700;font-size:3em;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.06));animation:grow 1s cubic-bezier(.2,.9,.2,1) both}
.pod .w .bl{background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 90%,#fff 15%),color-mix(in srgb,var(--acc) 40%,transparent))}
@keyframes grow{from{transform:scaleY(0);transform-origin:bottom}to{transform:none;transform-origin:bottom}}
/* полноэкранный экран */
body.scrv{background:#06050f;overflow:hidden;cursor:none}
body.scrv .sw2{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
body.scrv .stage{width:min(100vw,177.78vh);aspect-ratio:16/9}
body.scrv .bgfill{position:fixed;inset:0}
.sndov{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(6,5,15,.7);cursor:pointer}
.sndov div{background:#fff;color:#14112b;border-radius:20px;padding:22px 28px;font-weight:800;font-size:20px;text-align:center}
.sndov small{display:block;font-size:14px;opacity:.6;margin-top:4px}

/* ===== телефон ===== */
body.ph{background:var(--pbg,#0d0b22);min-height:100vh}
.pv{min-height:100vh;min-height:100dvh;padding:20px 18px 22px;display:flex;flex-direction:column;color:#fff;
  background:radial-gradient(120% 70% at 0% 100%,color-mix(in srgb,var(--acc) 55%,transparent),transparent 60%),radial-gradient(90% 60% at 100% 0%,color-mix(in srgb,var(--acc) 30%,transparent),transparent 60%),color-mix(in srgb,var(--acc) 14%,#06050f)}
.pv .hd{display:flex;align-items:center;gap:10px;font-weight:800;font-size:14px}
.pv .hd .sp{flex:1}
.pv .hd .sc{background:rgba(255,255,255,.14);border-radius:99px;padding:5px 12px;font-variant-numeric:tabular-nums}
.pv .mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
.pv h2{font-family:var(--hf);font-weight:700;font-size:24px;line-height:1.15;margin:0}
.pv p{margin:0;opacity:.8;font-weight:600}
.pv .pin{width:100%;background:rgba(0,0,0,.25);border:1.5px solid rgba(255,255,255,.22);border-radius:16px;padding:16px;font-size:18px;color:#fff;outline:none;text-align:center}
.pv .pin:focus{border-color:#fff}
.pv .pbtn{width:100%;border:0;border-radius:18px;padding:18px;font-weight:800;font-size:18px;background:#fff;color:#14112b}
.pv .pbtn[disabled]{opacity:.5}
.pv .cv{display:flex;flex-direction:column;align-items:center;gap:4px}
.pv .cv .c{font-weight:800;font-size:15px;opacity:.85}
.pv .cv .v{font-family:var(--hf);font-weight:700;font-size:44px;line-height:1}
.bzb{width:min(72vw,300px);aspect-ratio:1;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#ff8a7a,#e8322a 55%,#a3150f);color:#fff;font-family:var(--hf);font-weight:700;font-size:30px;box-shadow:0 14px 0 #7d0f0a,0 22px 40px rgba(0,0,0,.45),inset 0 -6px 14px rgba(0,0,0,.25);transition:transform .08s,box-shadow .08s;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.bzb:active{transform:translateY(10px);box-shadow:0 4px 0 #7d0f0a,0 10px 20px rgba(0,0,0,.4),inset 0 -6px 14px rgba(0,0,0,.25)}
.bzb[disabled]{filter:grayscale(.9) brightness(.7)}
.pst{border-radius:22px;padding:22px 20px;width:100%;display:flex;flex-direction:column;align-items:center;gap:6px}
.pst b{font-family:var(--hf);font-weight:700;font-size:28px;line-height:1.1}
.pst.go{background:#2fbf74;animation:bzIn .4s both}
.pst.wt{background:rgba(255,255,255,.14)}
.pst.no{background:rgba(229,100,90,.85)}
.pv .note{font-size:13px;opacity:.65;text-align:center;margin-top:10px}
.spin{width:36px;height:36px;border-radius:50%;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

/* ===== редактор v2: крупные карточки ===== */
.wrap.wide{max-width:1180px}
.tabs{align-items:center}
.rtab{display:inline-flex;align-items:stretch;border:1px solid var(--line);background:#141413;border-radius:12px;overflow:hidden;transition:border-color .2s,background .2s}
.rtab.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 22%,#141413)}
.rtab .rn{border:0;background:none;padding:9px 12px 9px 14px;font-weight:800;font-size:14px;color:var(--muted)}
.rtab.on .rn{color:var(--ink)}
.rtab .rx{border:0;background:none;color:var(--muted);padding:0 10px 0 4px;display:grid;place-items:center;font-weight:800;font-size:12px}
.rtab .rx:hover{color:var(--ink)}
.rtab.sure{border-color:var(--bad);background:var(--bad)}.rtab.sure .rn{display:none}.rtab.sure .rx{background:var(--bad);color:#fff;padding:9px 16px;font-size:14px}
.tadd{border:1px dashed rgba(255,255,255,.28);background:none;border-radius:12px;padding:9px 14px;font-weight:800;font-size:14px;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.tadd:hover{background:rgba(255,255,255,.06)}
.evals{display:grid;gap:10px;margin:0 0 10px;padding:0 13px}
.evl{font-size:13px;font-weight:700;color:var(--muted);margin:0 0 6px}
.vh{position:relative}
.vh .inp{text-align:center;padding:9px 6px;font-weight:800;font-size:15px}
.vh .vx{position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:#262625;color:var(--muted);display:grid;place-items:center;opacity:0;transition:opacity .15s;padding:0;font-size:10px;font-weight:800}
.vh:hover .vx,.vh .vx:focus,.vh .vx.sure{opacity:1}
.vh .vx.sure{width:auto;padding:0 8px;border-radius:99px;background:var(--bad);color:#fff;border-color:transparent}
.ecats{display:flex;flex-direction:column;gap:14px}
.ecat{background:#171716;border:1px solid var(--line);border-radius:18px;padding:12px}
.ech{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.grip{flex:none;width:30px;height:40px;display:grid;place-items:center;color:var(--muted);cursor:grab;touch-action:none;border-radius:9px;-webkit-user-select:none;user-select:none}
.grip:hover{color:var(--ink);background:rgba(255,255,255,.07)}
.cbox{flex:1;max-width:460px;display:flex;flex-direction:column;border:1px solid rgba(255,255,255,.14);background:#141413;border-radius:12px;padding:7px 12px;cursor:text}
.cbox:focus-within{border-color:var(--acc)}
.cbox small{font-size:11px;font-weight:700;color:var(--muted)}
.cbox input{border:0;background:none;outline:none;font-weight:800;font-size:16px;padding:0;color:var(--ink)}
.ech .del{margin-left:auto;width:40px;height:40px}
.icb.sure,.btn.sure{background:var(--bad)!important;color:#fff!important;width:auto!important;padding:0 14px;border-radius:12px;font-weight:800;font-size:13px;border-color:transparent!important}
.btn.sure{padding:8px 14px!important;border-radius:999px!important;height:auto!important;line-height:1.4}.btn.nextb.sure,.bar .btn.sure{padding:15px 28px!important}
.eqs{display:grid;gap:10px;align-items:stretch}
.qc2{position:relative;text-align:left;border:1px solid rgba(255,255,255,.12);background:#1f1f1e;border-radius:14px;padding:12px 12px 10px;min-height:118px;display:flex;flex-direction:column;gap:6px;color:var(--ink);transition:border-color .15s,background .15s,box-shadow .15s;touch-action:pan-y;-webkit-user-select:none;user-select:none;min-width:0}
.qc2:hover{border-color:rgba(255,255,255,.3)}
.qc2 .qv{font-family:var(--hf);font-weight:600;font-size:17px;line-height:1}
.qc2 .qx{font-size:14px;font-weight:600;line-height:1.3;color:var(--text);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.qc2 .qi{margin-top:auto;display:flex;gap:6px;color:var(--muted)}
.qc2.emp{border-style:dashed;background:none}.qc2.emp .qx{color:var(--muted);font-weight:600}
.qc2.sel{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 16%,#1f1f1e);box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 45%,transparent)}
.qadd{border:1px dashed rgba(255,255,255,.28);background:none;border-radius:14px;color:var(--muted);display:grid;place-items:center;min-height:118px}
.qadd:hover{color:var(--ink);border-color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,transparent)}
.sort-ph{border:2px dashed color-mix(in srgb,var(--acc) 60%,transparent);border-radius:14px;background:color-mix(in srgb,var(--acc) 8%,transparent)}
.ecats>.sort-ph{border-radius:18px}
.dragging{box-shadow:0 22px 50px rgba(0,0,0,.55);opacity:.97;cursor:grabbing!important}
body.sorting,body.sorting *{cursor:grabbing!important;-webkit-user-select:none;user-select:none}
.cpick{width:36px;height:36px;border-radius:50%;position:relative;cursor:pointer;box-shadow:0 0 0 1px rgba(255,255,255,.18) inset;display:block}
.cpick input{position:absolute;inset:0;opacity:0;cursor:pointer}
/* карточка вопроса */
.qed{margin-top:12px;border:1px solid color-mix(in srgb,var(--acc) 45%,transparent);background:color-mix(in srgb,var(--acc) 6%,#151514);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.qcols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.qcols{grid-template-columns:1fr}}
.qside{display:flex;flex-direction:column;gap:10px;min-width:0}
.tbox{display:flex;flex-direction:column;border:1px solid rgba(255,255,255,.14);background:#141413;border-radius:12px;padding:8px 12px;cursor:text}
.tbox:focus-within{border-color:var(--acc)}
.tbox small{font-size:11px;font-weight:700;color:var(--muted)}
.tbox textarea{border:0;background:none;outline:none;resize:vertical;font-size:15px;font-weight:600;line-height:1.4;padding:2px 0;color:var(--ink);min-height:48px}
.madd{border:1px dashed rgba(255,255,255,.24);background:none;border-radius:12px;padding:12px;font-weight:700;font-size:14px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.madd:hover{color:var(--ink);border-color:var(--acc)}
.mbox{border:1px solid rgba(255,255,255,.12);background:#1a1a19;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.mk{display:flex;align-items:center;gap:10px}
.mk .sp{flex:1}.mk .icb{width:34px;height:34px}
.rad{display:inline-flex;background:#141413;border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
.rad label{cursor:pointer}.rad input{position:absolute;opacity:0;pointer-events:none}
.rad span{display:block;border-radius:8px;padding:6px 11px;font-weight:700;font-size:13px;color:var(--muted)}
.rad input:checked+span{background:var(--card2);color:var(--ink);box-shadow:0 0 0 1px rgba(255,255,255,.12) inset}
.rad input:focus-visible+span{outline:2px solid var(--acc)}
.msrc{padding:10px 12px;font-size:14px}
.drop{border:1.5px dashed rgba(255,255,255,.2);border-radius:12px;padding:12px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13.5px;font-weight:700;color:var(--muted);cursor:pointer;text-align:center;transition:border-color .15s,background .15s}
.drop:hover,.drop.on{border-color:var(--acc);color:var(--ink);background:color-mix(in srgb,var(--acc) 10%,transparent)}
.drop.busy{opacity:.6;pointer-events:none}
.mimg{border-radius:12px;overflow:hidden;background:#111;display:grid;place-items:center;max-height:220px}
.mimg img{max-width:100%;max-height:220px;display:block}
.wave{position:relative;height:96px;border-radius:10px;background:#141413;overflow:hidden;cursor:pointer}
.wave canvas{width:100%;height:100%;display:block}
.wave .ph{position:absolute;top:0;bottom:18px;width:2px;background:#fff;display:none;pointer-events:none}
.wave .wmsg{position:absolute;inset:0;display:grid;place-items:center;font-size:12.5px;font-weight:600;color:var(--muted);text-align:center;padding:0 12px;pointer-events:none}
.ytp{border-radius:10px;background:#141413;padding:10px 12px;font-size:12.5px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;gap:8px}
.ytp>span{display:flex;align-items:center;gap:6px}
.ytprev{width:100%;aspect-ratio:16/9;border:0;border-radius:8px}
.mctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rb{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#141413;display:grid;place-items:center;color:var(--ink);padding:0}
.rb:hover{border-color:var(--acc)}.rb[disabled]{opacity:.35}
.tl2{font-size:13px;font-weight:700;color:var(--muted);margin-left:4px}
.tin{display:inline-flex;align-items:center;border:1px solid var(--line);background:#141413;border-radius:10px;height:34px;padding-left:8px}
.tin input{width:52px;border:0;background:none;outline:none;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;color:var(--ink)}
.tin input::placeholder{color:var(--muted);font-weight:600}
.ud{display:flex;flex-direction:column;border-left:1px solid var(--line);height:100%}
.ud button{flex:1;border:0;background:none;color:var(--muted);padding:0 6px;display:grid;place-items:center}
.ud button:hover{color:var(--ink);background:rgba(255,255,255,.06)}
.chk{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;margin-left:4px}
.chk input{width:16px;height:16px;accent-color:var(--acc)}
.qft{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.qft .sp{flex:1}
@media (max-width:760px){.evals,.eqs{grid-template-columns:repeat(3,minmax(0,1fr))!important}.evals>span{display:none}}
/* экран: медиа в вопросе и ответе */
.qmain.noq .qtx{display:none}
.qm video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.qm audio{display:none}
.ansv.wm{gap:.4em}.ansv.wm .a{font-size:3.4em}
.ansv .amv{position:relative;flex:none;width:min(40em,70%);height:14em;border-radius:1.2em;overflow:hidden;background:rgba(0,0,0,.35);box-shadow:0 1em 2.6em rgba(0,0,0,.4)}
.qm img{width:100%;height:100%;object-fit:contain;display:block;position:relative}
.qm .bgb{position:absolute;inset:-20px;background-size:cover;background-position:center;filter:blur(24px) brightness(.55)}

/* ===== раунды разных типов ===== */
.rtab .rn{display:inline-flex;align-items:center;gap:7px}
.rhd{display:flex;align-items:flex-end;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.rtype{display:inline-flex;align-items:center;gap:7px;border-radius:99px;padding:8px 14px;font-weight:800;font-size:13px;background:color-mix(in srgb,var(--acc) 22%,#141413);border:1px solid color-mix(in srgb,var(--acc) 45%,transparent);margin-bottom:4px}
.rpick{display:flex;flex-direction:column;gap:10px}
.rpick button{display:flex;align-items:center;gap:14px;text-align:left;border:1px solid var(--line);background:#171716;border-radius:16px;padding:14px 16px;color:var(--ink)}
.rpick button:hover{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,#171716)}
.rpick i{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--acc) 30%,#141413);flex:none}
.rpick b{display:block;font-size:16px}.rpick small{display:block;font-size:13px;color:var(--muted);line-height:1.35;margin-top:2px}
.qset{border:1px solid var(--line);border-radius:16px;padding:4px 14px;margin-bottom:14px;background:#171716}
.qset .opt{padding:12px 0}
.segin{display:inline-flex;align-items:center;gap:4px;border-radius:10px;padding:0 10px;color:var(--muted);font-weight:700;font-size:14px}
.segin.on{background:var(--card2);color:var(--ink);box-shadow:0 0 0 1px rgba(255,255,255,.12) inset}
.segin input{width:44px;border:0;background:none;outline:none;font-weight:800;font-size:14px;text-align:right;color:var(--ink);padding:8px 0}
.segin input::placeholder{color:var(--muted);font-weight:700}
.qlist{display:flex;flex-direction:column;gap:10px}
.qq{border:1px solid var(--line);background:#171716;border-radius:16px;transition:border-color .15s}
.qq.open{border-color:color-mix(in srgb,var(--acc) 55%,transparent);background:color-mix(in srgb,var(--acc) 5%,#171716)}
.qq.bad:not(.open){border-style:dashed}
.qqh{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 6px;cursor:pointer;min-height:56px}
.qqh .qn{font-family:var(--hf);font-weight:600;font-size:15px;min-width:22px;text-align:center;color:var(--muted)}
.qqh .qtt{flex:1;min-width:0;font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qqh .pts{font-family:var(--hf);font-weight:600;font-size:15px;min-width:44px;text-align:right}
.qqh .qic{color:var(--muted)}
.qqh .del{width:38px;height:38px}
.chip.warn{color:#e5b45c;border-color:rgba(229,180,92,.4);background:none}
.qqb{padding:4px 14px 14px;display:flex;flex-direction:column;gap:12px}
.qqtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.qqtop .sp{flex:1}
.mini{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.14);background:#141413;border-radius:12px;height:42px;padding:0 12px;font-size:13px;font-weight:700;color:var(--muted)}
.mini input{width:56px;border:0;background:none;outline:none;font-weight:800;font-size:15px;color:var(--ink);text-align:right}
.mini input::placeholder{color:var(--muted)}.mini em{font-style:normal}
.mini:focus-within{border-color:var(--acc)}
.lbl2{font-size:13px;font-weight:700;color:var(--muted);margin-top:2px}
