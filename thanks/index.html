<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Спасибо за покупку · Белоглазов</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#131312">
<link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/brand.css">
<script src="../assets/brand.js"></script>
<style>
:root{--bg:#131312;--card:#1c1c1b;--line:rgba(255,255,255,.1);--ink:#ffffff;--text:#e8e8e6;--muted:#a3a3a3;--gold:#f2efe9;--gold2:#d9d6d0}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Manrope,system-ui,sans-serif;line-height:1.55}
body{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.brand i{width:30px;height:30px;border-radius:9px;background:#f2efe9;display:grid;place-items:center;font-style:normal;color:#131312;font-weight:800;font-size:14px}
.brand b{font-family:var(--hf);font-stretch:125%;letter-spacing:-.01em;font-size:22px;font-weight:600;color:var(--ink)}
.lang{border:1px solid var(--line);background:none;color:var(--ink);font:inherit;font-weight:800;font-size:12px;width:40px;height:40px;border-radius:50%;cursor:pointer}
main{flex:1;display:grid;place-items:center;padding:40px 16px;position:relative;overflow:hidden}
main:before{content:"";position:absolute;left:50%;top:0;width:800px;height:420px;transform:translateX(-50%);background:radial-gradient(ellipse at center,rgba(242,239,233,.16),rgba(19,19,18,0) 65%);pointer-events:none}
.box{position:relative;max-width:560px;width:100%;text-align:center}
.ok{width:76px;height:76px;border-radius:50%;margin:0 auto 22px;display:grid;place-items:center;font-size:34px;background:#f2efe9;color:#131312;box-shadow:0 16px 40px rgba(242,239,233,.3);animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.k{color:var(--gold2);letter-spacing:.24em;text-transform:uppercase;font-weight:700;font-size:12px}
h1{font-family:var(--hf);font-stretch:125%;letter-spacing:-.01em;font-weight:600;font-size:clamp(40px,7vw,60px);line-height:1.02;margin:10px 0 12px;color:var(--ink)}
.lead{color:var(--muted);font-size:17px;margin:0 0 28px}
.steps{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:8px 22px;text-align:left}
.st{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.st:last-child{border:0}
.st b{font-family:var(--hf);font-stretch:125%;letter-spacing:-.01em;font-size:30px;color:var(--gold);line-height:1;font-weight:500;flex:none;width:26px}
.st h4{margin:0 0 2px;color:var(--ink);font-size:16px}
.st p{margin:0;color:var(--muted);font-size:14px}
.ready{background:#222221;border:1px solid rgba(242,239,233,.4);border-radius:22px;padding:22px;margin-bottom:18px;text-align:left}
.ready h3{margin:0 0 4px;color:var(--ink);font-size:18px}
.ready p{margin:0 0 14px;color:var(--muted);font-size:14px}
.ready .row{display:flex;gap:8px;flex-wrap:wrap}
.ready .link{margin-top:12px;font-size:13px;color:var(--muted);word-break:break-all}
.ready .link a{color:var(--gold)}
.wait{color:var(--muted);font-size:14px;margin-bottom:18px}
.wait.err{color:#e89a8a}
.cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:14px;padding:14px 22px;font-weight:700;font-size:15px;text-decoration:none}
.btn.gold{background:#f2efe9;color:#131312}
.btn.ghost{background:rgba(255,255,255,.06);color:var(--ink);border:1px solid var(--line)}
footer{text-align:center;color:var(--muted);font-size:13px;padding:24px}

/* Beloglazov Event */
:root{--hf:Archivo,Manrope,system-ui,sans-serif}
h1,.h2,h3{text-transform:uppercase}
h1,.h2,.hero h1{font-weight:500!important}
h1 em,.hero h1 em{font-style:normal!important;color:var(--muted)!important}
.brand{gap:10px!important;color:#fff}
.brand .pb-word{height:13px}
.brand span{border-left:1px solid rgba(255,255,255,.18);padding-left:10px;font-size:12px!important;letter-spacing:.02em}
.btn{border-radius:999px!important}
.btn.gold:hover{background:#fff}
.btn.ghost{background:transparent!important;border:1px solid rgba(255,255,255,.28)!important}
.btn.ghost:hover{background:rgba(255,255,255,.08)!important}
.k{color:var(--muted)!important}
@media (max-width:560px){.brand .pb-word{height:11px}.brand span{display:none}}
h1{font-size:clamp(30px,5.4vw,46px)!important}.st b{font-size:24px!important}
</style>
</head>
<body>
<div class="top"><a class="brand" href="../" aria-label="Beloglazov Event"><svg class="pb-mark" viewBox="0 0 100 100" width="30" height="30" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M0,50a50,50 0 1,0 100,0a50,50 0 1,0 -100,0Z M9.76,50a40.24,35.68 0 1,0 80.48,0a40.24,35.68 0 1,0 -80.48,0Z M14.25,50a35.75,31.27 0 1,0 71.5,0a35.75,31.27 0 1,0 -71.5,0Z M40.48,50a9.52,9.52 0 1,0 19.04,0a9.52,9.52 0 1,0 -19.04,0Z"/></svg><img class="pb-word" src="../assets/wordmark-white.png" alt="Beloglazov Event"></a><button class="lang" id="lang">EN</button></div>
<main><div class="box">
  <div class="ok">✓</div>
  <div class="k" id="plan"></div>
  <h1 data-t="h"></h1>
  <p class="lead" data-t="lead"></p>
  <div id="claim"></div>
  <div class="steps">
    <div class="st"><b>1</b><div><h4 data-t="s1h"></h4><p data-t="s1p"></p></div></div>
    <div class="st"><b>2</b><div><h4 data-t="s2h"></h4><p data-t="s2p"></p></div></div>
    <div class="st"><b>3</b><div><h4 data-t="s3h"></h4><p data-t="s3p"></p></div></div>
  </div>
  <div class="cta"><a class="btn gold" href="../secret-mission/" data-t="b1"></a><a class="btn ghost" href="https://pabeloglazov.com" target="_blank" rel="noopener" data-t="b2"></a></div>
</div></main>
<footer data-t="foot"></footer>
<script>
(function () {
  var I = {
    ru: { brand: 'Белоглазов', h: 'Спасибо! Оплата прошла', lead: 'Чек уже на вашей почте. Дальше — всё просто:',
      s1h: 'Ссылки продублированы на почту', s1p: 'Письмо с панелью ведущего и ссылкой «Мои игры» уже отправлено на адрес из чека.',
      rh: 'Ваша игра готова', rp: 'Откройте панель ведущего: впишите имена пары, проверьте задания и нажмите «Открыть игру».', ra: 'Панель ведущего', rm: 'Мои игры', rg: 'Ссылка для гостей:',
      wait: 'Проверяем оплату и создаём вашу игру…', err: 'Не получилось создать игру автоматически: ', errTail: ' Ничего страшного — оплата сохранена, я пришлю доступ вручную в течение часа.', retry: 'Попробовать ещё раз', mail: 'Письмо отправлено на ',
      s2h: 'Настройте игру', s2p: 'Имена, задания, язык и факты о гостях — всё в панели ведущего. Можно заранее проверить на двух телефонах.',
      s3h: 'Играйте', s3p: 'Выведите QR на экран — гости сканируют и начинают. Итоги и отчёт будут в конце вечера.',
      b1: 'Посмотреть игру', b2: 'Связаться со мной', foot: '© Павел Белоглазов · ведущий и автор игр',
      plans: { event: 'Одно событие · $39', 'pro-month': 'Host Pro · помесячно', 'pro-year': 'Host Pro · на год' }, plan0: 'Покупка' },
    en: { brand: 'Beloglazov', h: 'Thank you! Payment received', lead: 'Your receipt is in your inbox. Here’s what happens next:',
      s1h: 'Links are in your inbox too', s1p: 'We’ve emailed your host panel and “My games” link to the address on the receipt.',
      rh: 'Your game is ready', rp: 'Open the host panel: add the couple’s names, check the missions and press “Open the game”.', ra: 'Host panel', rm: 'My games', rg: 'Guest link:',
      wait: 'Checking your payment and creating your game…', err: 'We couldn’t create your game automatically: ', errTail: ' Don’t worry — your payment is safe; I’ll send your access manually within an hour.', retry: 'Try again', mail: 'Email sent to ',
      s2h: 'Set up the game', s2p: 'Names, missions, language and guest facts — all in the host panel. Test it on two phones beforehand.',
      s3h: 'Play', s3p: 'Put the QR code on screen — guests scan and start. Results and a report are ready at the end of the night.',
      b1: 'See the game', b2: 'Contact me', foot: '© Pavel Beloglazov · host and game author',
      plans: { event: 'One event · $39', 'pro-month': 'Host Pro · monthly', 'pro-year': 'Host Pro · yearly' }, plan0: 'Purchase' }
  };
  var API = 'https://script.google.com/macros/s/AKfycbwvLVfMge8_eCpteZrgj-MpxqO1W_TvQoMAz0jxqx42W8ySqwz2xmutpwKfVGUGZXcG3w/exec', SK = 'pb_claim_session', R = null, ERR = '';
  var q = new URLSearchParams(location.search), plan = q.get('plan') || '';
  var sid = q.get('session_id') || '';
  if (sid) { try { sessionStorage.setItem(SK, sid); } catch (e) {} try { history.replaceState(null, '', location.pathname + '?plan=' + encodeURIComponent(plan)); } catch (e) {} }
  else { try { sid = sessionStorage.getItem(SK) || ''; } catch (e) {} }
  var L = (function () { try { var s = localStorage.getItem('pb_lang'); if (s === 'ru' || s === 'en') return s; } catch (e) {} return /^(ru|uk|be|kk)/i.test(navigator.language || 'ru') ? 'ru' : 'en'; })();
  function paint() {
    var d = I[L]; document.documentElement.lang = L;
    [].forEach.call(document.querySelectorAll('[data-t]'), function (el) { el.textContent = d[el.dataset.t]; });
    document.getElementById('plan').textContent = d.plans[plan] || d.plan0;
    document.getElementById('lang').textContent = L === 'ru' ? 'EN' : 'RU';
    document.title = d.h + ' · ' + d.brand;
    paintClaim();
  }
  function esc(x) { return String(x == null ? '' : x).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function paintClaim() {
    var d = I[L], el = document.getElementById('claim');
    if (!sid) { el.innerHTML = ''; return; }
    if (R) {
      el.innerHTML = '<div class="ready"><h3>' + esc(d.rh) + '</h3><p>' + esc(d.rp) + '</p><div class="row">' +
        '<a class="btn gold" target="_blank" rel="noopener" href="' + esc(R.adminUrl) + '">' + esc(d.ra) + '</a>' +
        '<a class="btn ghost" href="' + esc(R.hostUrl.replace('https://game.pabeloglazov.com/', '../')) + '">' + esc(d.rm) + '</a></div>' +
        '<div class="link">' + esc(d.rg) + ' <a target="_blank" rel="noopener" href="' + esc(R.playUrl) + '">' + esc(R.playUrl) + '</a></div>' +
        '<div class="link">' + esc(d.mail) + esc(R.email) + '</div></div>';
    } else if (ERR) {
      el.innerHTML = '<div class="wait err">' + esc(d.err + ERR + d.errTail) + '</div><button class="btn ghost" id="retry" style="margin-bottom:18px">' + esc(d.retry) + '</button>';
      document.getElementById('retry').onclick = claim;
    } else el.innerHTML = '<div class="wait">' + esc(d.wait) + '</div>';
  }
  function claim(n) {
    n = typeof n === 'number' ? n : 0; ERR = ''; paintClaim();
    fetch(API, { method: 'POST', credentials: 'omit', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: 'pfClaim', args: [sid, L] }) })
      .then(function (r) { return r.text(); })
      .then(function (t) {
        var j; try { j = JSON.parse(t); } catch (e) { if (n < 4) return setTimeout(function () { claim(n + 1); }, 2000); throw new Error('server'); }
        if (!j.ok) {
          var m = String(j.error || '').replace(/^(Exception|Error):\s*/i, '');
          if (/не завершена|not complete/i.test(m) && n < 5) return setTimeout(function () { claim(n + 1); }, 4000);
          throw new Error(m);
        }
        R = j.data; paintClaim();
      })
      .catch(function (e) { if (!e.message && n < 3) return setTimeout(function () { claim(n + 1); }, 2000); ERR = e.message || 'network'; paintClaim(); });
  }
  document.getElementById('lang').onclick = function () { L = L === 'ru' ? 'en' : 'ru'; try { localStorage.setItem('pb_lang', L); } catch (e) {} paint(); };
  paint();
  if (sid) claim(0);
})();
</script>
</body>
</html>
