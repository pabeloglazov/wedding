<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Игры для праздников · Павел Белоглазов</title>
<meta name="description" content="Интерактивные игры для свадеб и праздников: гости играют с телефонов по QR-коду.">
<meta name="theme-color" content="#14151d">
<meta property="og:title" content="Игры для праздников · Павел Белоглазов">
<meta property="og:description" content="Интерактивы, которые знакомят гостей и оживляют вечер">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%A8%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#14151d;--bg2:#1b1c27;--card:#212330;--card2:#272a39;--line:rgba(255,255,255,.08);--ink:#f5efe4;--text:#e7dfd1;--muted:#a99c8e;--gold:#e2cd92;--gold2:#d8c28a;--acc:#b8894d}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.55;overflow-x:clip}
a{color:inherit}
.serif{font-family:"Cormorant Garamond",Georgia,serif}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.top{position:sticky;top:0;z-index:10;background:rgba(20,21,29,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none}
.brand i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#e2cd92,#8a6a35);display:grid;place-items:center;font-style:normal;color:#14151d;font-weight:800;font-size:14px}
.brand b{font-family:"Cormorant Garamond",Georgia,serif;font-size:22px;font-weight:600;color:var(--ink);letter-spacing:.2px}
.brand span{color:var(--muted);font-size:13px}
.nav{display:flex;gap:4px;margin-left:auto;align-items:center}
.nav a{color:var(--muted);text-decoration:none;font-weight:600;font-size:14px;padding:8px 12px;border-radius:999px}
.nav a:hover,.nav a.on{color:var(--ink);background:rgba(255,255,255,.06)}
.lang{border:1px solid var(--line);background:none;color:var(--ink);font:inherit;font-weight:800;font-size:12px;letter-spacing:.06em;width:40px;height:40px;border-radius:50%;cursor:pointer;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:14px 22px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;transition:transform .15s,background .2s}
.btn:active{transform:scale(.97)}
.btn.gold{background:linear-gradient(135deg,#e8d59e,#c9a86a);color:#191a24}
.btn.ghost{background:rgba(255,255,255,.06);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:rgba(255,255,255,.1)}
.btn[disabled]{opacity:.45;cursor:default}
.k{color:var(--gold2);letter-spacing:.24em;text-transform:uppercase;font-weight:700;font-size:12px}
.chip{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--muted);font-weight:600}
footer{border-top:1px solid var(--line);margin-top:80px;padding:32px 0 48px;color:var(--muted);font-size:13px}
footer .wrap{display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap}
@media (max-width:760px){.nav a:not(.keep){display:none}.brand span{display:none}.wrap{padding:0 16px}}

.hero{padding:72px 0 40px;text-align:center;position:relative}
.hero:before{content:"";position:absolute;left:50%;top:-40px;width:900px;height:420px;transform:translateX(-50%);background:radial-gradient(ellipse at center,rgba(226,205,146,.16),rgba(20,21,29,0) 65%);pointer-events:none}
.hero h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:clamp(42px,7vw,76px);line-height:1.02;margin:14px 0 16px;color:var(--ink)}
.hero h1 em{color:var(--gold);font-style:italic}
.hero p{max-width:620px;margin:0 auto;color:var(--muted);font-size:18px}
.hero .cta{display:flex;gap:10px;justify-content:center;margin-top:28px;flex-wrap:wrap}
.filters{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:24px 0 28px}
.filters button{border:1px solid var(--line);background:none;color:var(--muted);font:inherit;font-weight:600;font-size:14px;padding:8px 16px;border-radius:999px;cursor:pointer}
.filters button.on{background:var(--ink);color:#14151d;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.game{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;text-decoration:none;color:inherit;transition:transform .25s,box-shadow .25s,border-color .25s}
.game:hover{transform:translateY(-4px);box-shadow:0 24px 50px rgba(0,0,0,.35);border-color:rgba(226,205,146,.25)}
.cover{position:relative;aspect-ratio:16/10;overflow:hidden;display:grid;place-items:center}
.cover .b1,.cover .b2,.cover .b3{position:absolute;border-radius:50%;filter:blur(2px)}
.cover .em{position:relative;font-size:clamp(64px,8vw,92px);line-height:1;filter:drop-shadow(0 14px 22px rgba(0,0,0,.35));display:flex;gap:6px;transition:transform .4s}
.game:hover .cover .em{transform:scale(1.06) rotate(-2deg)}
.badge{position:absolute;top:12px;right:12px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:rgba(20,21,29,.7);color:var(--gold);backdrop-filter:blur(6px)}
.badge.soon{color:#cbbfb1}
.body{padding:18px 20px 20px;display:flex;flex-direction:column;flex:1}
.body h3{font-family:"Cormorant Garamond",Georgia,serif;font-size:28px;font-weight:600;margin:0;color:var(--ink);line-height:1.1}
.meta{color:var(--muted);font-size:13px;margin:6px 0 10px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.body p{margin:0 0 18px;color:var(--text);font-size:14.5px;flex:1}
.body .btn{width:100%}
section{padding-top:72px}
.h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:clamp(34px,4.6vw,48px);color:var(--ink);margin:10px 0 28px;line-height:1.05}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.step{background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:24px}
.step b{display:block;font-family:"Cormorant Garamond",Georgia,serif;font-size:44px;color:var(--gold);line-height:1;font-weight:500}
.step h4{margin:12px 0 6px;font-size:18px;color:var(--ink)}
.step p{margin:0;color:var(--muted);font-size:14.5px}
.pro{background:linear-gradient(135deg,#262838,#1b1c27);border:1px solid rgba(226,205,146,.18);border-radius:28px;padding:44px;display:grid;grid-template-columns:1.3fr 1fr;gap:32px;align-items:center}
.pro ul{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.pro li{display:flex;gap:12px;color:var(--text)}
.pro li:before{content:"✦";color:var(--gold)}
.pro .soon{display:inline-block;margin-bottom:14px}
@media (max-width:980px){.grid{grid-template-columns:repeat(2,1fr)}.pro{grid-template-columns:1fr;padding:28px}}
@media (max-width:640px){.grid,.steps{grid-template-columns:1fr}.hero{padding:48px 0 24px}.hero p{font-size:16px}}
</style>
</head>
<body>
<div class="top"><div class="wrap">
  <a class="brand" href="./"><i>PB</i><b data-t="brand"></b><span data-t="brandSub"></span></a>
  <nav class="nav"><a href="#games" class="on keep" data-t="navGames"></a><a href="#how" data-t="navHow"></a><a href="#pro" data-t="navPro"></a></nav>
  <button class="lang" id="lang">EN</button>
</div></div>

<div class="wrap">
  <div class="hero">
    <div class="k" data-t="kicker"></div>
    <h1 data-h="heroH"></h1>
    <p data-t="heroP"></p>
    <div class="cta"><a class="btn gold" href="#games" data-t="heroBtn"></a><a class="btn ghost" href="#how" data-t="heroBtn2"></a></div>
  </div>

  <div id="games">
    <div class="filters" id="filters"></div>
    <div class="grid" id="grid"></div>
  </div>

  <section id="how">
    <div class="k" data-t="howK"></div>
    <div class="h2" data-t="howH"></div>
    <div class="steps">
      <div class="step"><b>01</b><h4 data-t="s1h"></h4><p data-t="s1p"></p></div>
      <div class="step"><b>02</b><h4 data-t="s2h"></h4><p data-t="s2p"></p></div>
      <div class="step"><b>03</b><h4 data-t="s3h"></h4><p data-t="s3p"></p></div>
    </div>
  </section>

  <section id="pro">
    <div class="pro">
      <div>
        <span class="chip soon" data-t="proSoon"></span>
        <div class="h2" style="margin-top:0" data-t="proH"></div>
        <ul><li data-t="pro1"></li><li data-t="pro2"></li><li data-t="pro3"></li><li data-t="pro4"></li></ul>
      </div>
      <div style="text-align:center">
        <p style="color:var(--muted);margin:0 0 18px" data-t="proP"></p>
        <a class="btn gold" href="https://pabeloglazov.com" target="_blank" rel="noopener" data-t="proBtn"></a>
      </div>
    </div>
  </section>
</div>

<footer><div class="wrap"><span data-t="foot"></span><a href="https://pabeloglazov.com" target="_blank" rel="noopener">pabeloglazov.com</a></div></footer>

<script>
(function () {
  var GAMES = [
    { id: 'secret-mission', href: 'secret-mission/', status: 'live', emoji: ['🕶️', '💌'],
      bg: 'linear-gradient(140deg,#2b2d40 0%,#1c1d29 100%)', blobs: ['#e2cd92', '#c27078', '#b7d3e8'],
      tags: ['wedding', 'meet', 'welcome'],
      ru: { t: 'Секретная миссия', m: 'от 20 гостей · 1–2 часа · телефоны по QR', d: 'Каждый гость получает личную тайную миссию: найти пару по символу, познакомиться с «другой стороной», собрать пожелания молодым. Ведущий видит всё вживую на проекторе.' },
      en: { t: 'Secret Mission', m: '20+ guests · 1–2 hours · phones via QR', d: 'Every guest gets a private secret mission: find their emoji match, meet the other side of the family, collect wishes for the couple. The host sees it all live on the projector.' } },
    { id: 'human-bingo', status: 'soon', emoji: ['🎯', '✅'],
      bg: 'linear-gradient(140deg,#2a3340 0%,#1b1f29 100%)', blobs: ['#b7d3e8', '#a7ae86', '#e08b45'],
      tags: ['meet', 'welcome', 'party'],
      ru: { t: 'Человеческое бинго', m: 'от 15 гостей · 30–60 минут', d: 'Карточка бинго из фактов о гостях: «был в трёх странах», «поёт в хоре». Найди людей, собери линию — и забирай приз.' },
      en: { t: 'Human Bingo', m: '15+ guests · 30–60 min', d: 'A bingo card made of guest facts: “has been to three countries”, “sings in a choir”. Find the people, complete a line and claim the prize.' } },

  ];

  var I = {

      heroH: 'Игры, которые <em>знакомят</em> гостей', heroP: 'Выберите игру — гости сканируют QR и играют со своих телефонов, а вы видите весь вечер на большом экране.',

    en: { brand: 'Beloglazov', brandSub: 'games for celebrations', navGames: 'Games', navHow: 'How it works', navPro: 'For hosts', kicker: 'Interactive games for celebrations',
      heroH: 'Games that <em>connect</em> your guests', heroP: 'Pick a game — guests scan a QR code and play on their own phones, while you watch the whole night unfold on the big screen.',

  };
  var L = (function () { try { var s = localStorage.getItem('pb_lang'); if (s === 'ru' || s === 'en') return s; } catch (e) {} return /^(ru|uk|be|kk)/i.test(navigator.language || 'ru') ? 'ru' : 'en'; })();
  var F = 'all';
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function paint() {
    var d = I[L]; document.documentElement.lang = L;
    [].forEach.call(document.querySelectorAll('[data-t]'), function (el) { el.textContent = d[el.dataset.t]; });
    [].forEach.call(document.querySelectorAll('[data-h]'), function (el) { el.innerHTML = d[el.dataset.h]; });
    document.getElementById('lang').textContent = L === 'ru' ? 'EN' : 'RU';
    document.title = L === 'ru' ? 'Игры для праздников · Павел Белоглазов' : 'Games for celebrations · Pavel Beloglazov';
    var used = { all: 1 }; GAMES.forEach(function (g) { g.tags.forEach(function (t) { used[t] = 1; }); });

      return '<button data-f="' + k + '"' + (k === F ? ' class="on"' : '') + '>' + TAGS[k][L === 'ru' ? 0 : 1] + '</button>'; }).join('');
    document.getElementById('grid').innerHTML = GAMES.filter(function (g) { return F === 'all' || g.tags.indexOf(F) >= 0; }).map(function (g) {

      return '<' + tag + ' class="game"><div class="cover" style="background:' + g.bg + '">' + bl + '<div class="em">' + g.emoji.map(function (e) { return '<span>' + e + '</span>'; }).join('') + '</div>' +

        '<div class="body"><h3>' + esc(t.t) + '</h3><div class="meta">' + esc(t.m) + '</div><div class="tags">' + g.tags.map(function (k) { return '<span class="chip">' + TAGS[k][L === 'ru' ? 0 : 1] + '</span>'; }).join('') + '</div>' +

    }).join('');
  }
  document.getElementById('filters').onclick = function (e) { var b = e.target.closest('button'); if (!b) return; F = b.dataset.f; paint(); };

</script>
</body>
</html>
