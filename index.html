<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Игры для праздников · Павел Белоглазов</title>
<meta name="description" content="Интерактивные игры для свадеб и праздников: гости играют с телефонов по QR-коду.">
<meta name="theme-color" content="#131312">
<meta property="og:title" content="Игры для праздников · Павел Белоглазов">
<meta property="og:description" content="Интерактивы, которые знакомят гостей и оживляют вечер">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/brand.css">
<script src="assets/brand.js"></script>
<style>
:root{--bg:#131312;--bg2:#181817;--card:#1c1c1b;--card2:#262625;--line:rgba(255,255,255,.1);--ink:#ffffff;--text:#e8e8e6;--muted:#a3a3a3;--gold:#f2efe9;--gold2:#d9d6d0;--acc:#bdbab4}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.55;overflow-x:clip}
a{color:inherit}
.serif{font-family:var(--hf);font-stretch:125%;letter-spacing:-.01em}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.top{position:sticky;top:0;z-index:10;background:rgba(19,19,18,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none}
.brand i{width:30px;height:30px;border-radius:9px;background:#f2efe9;display:grid;place-items:center;font-style:normal;color:#131312;font-weight:800;font-size:14px}
.brand b{font-family:var(--hf);font-stretch:125%;letter-spacing:-.01em;font-size:22px;font-weight:600;color:var(--ink);letter-spacing:.2px}
.brand span{color:var(--muted);font-size:13px}
.nav{display:flex;gap:4px;margin-left:auto;align-items:center}
.nav a{color:var(--muted);text-decoration:none;font-weight:600;font-size:14px;padding:8px 12px;border-radius:999px}
.nav a:hover,.nav a.on{color:var(--ink);background:rgba(255,255,255,.06)}
.lang{border:1px solid var(--line);background:none;color:var(--ink);font:inherit;font-weight:800;font-size:12px;letter-spacing:.06em;width:40px;height:40px;border-radius:50%;cursor:pointer;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:14px 22px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;transition:transform .15s,background .2s}
.btn:active{transform:scale(.97)}
.btn.gold{background:#f2efe9;color:#131312}
.btn.ghost{background:rgba(255,255,255,.06);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:rgba(255,255,255,.1)}
.btn[disabled]{opacity:.45;cursor:default}
.k{color:var(--gold2);letter-spacing:.24em;text-transform:uppercase;font-weight:700;font-size:12px}
.chip{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--muted);font-weight:600}
footer{border-top:1px solid var(--line);margin-top:80px;padding:32px 0 48px;color:var(--muted);font-size:13px}
footer .wrap{display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap}
@media (max-width:760px){.nav a:not(.keep){display:none}.brand span{display:none}.wrap{padding:0 16px}}

.hero{padding:72px 0 40px;text-align:center;position:relative}
.hero:before{content:"";position:absolute;left:50%;top:-40px;width:900px;height:420px;transform:translateX(-50%);background:radial-gradient(ellipse at center,rgba(242,239,233,.16),rgba(19,19,18,0) 65%);pointer-events:none}
.hero h1{font-family:var(--hf);font-stretch:125%;letter-spacing:-.01em;font-weight:600;font-size:clamp(42px,7vw,76px);line-height:1.02;margin:14px 0 16px;color:var(--ink)}
.hero h1 em{color:var(--gold);font-style:italic}
.hero p{max-width:620px;margin:0 auto;color:var(--muted);font-size:18px}
.hero .cta{display:flex;gap:10px;justify-content:center;margin-top:28px;flex-wrap:wrap}
.filters{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:24px 0 28px}
.filters button{border:1px solid var(--line);background:none;color:var(--muted);font:inherit;font-weight:600;font-size:14px;padding:8px 16px;border-radius:999px;cursor:pointer}
.filters button.on{background:var(--ink);color:#131312;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.game{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;text-decoration:none;color:inherit;transition:transform .25s,box-shadow .25s,border-color .25s}
.game:hover{transform:translateY(-4px);box-shadow:0 24px 50px rgba(0,0,0,.35);border-color:rgba(242,239,233,.25)}
.cover{position:relative;aspect-ratio:16/10;overflow:hidden;display:grid;place-items:center}
.cover .b1,.cover .b2,.cover .b3{position:absolute;border-radius:50%;filter:blur(2px)}
.cover .em{position:relative;font-size:clamp(64px,8vw,92px);line-height:1;filter:drop-shadow(0 14px 22px rgba(0,0,0,.35));display:flex;gap:6px;transition:transform .4s}
.game:hover .cover .em{transform:scale(1.06) rotate(-2deg)}
.badge{position:absolute;top:12px;right:12px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:rgba(19,19,18,.7);color:var(--gold);backdrop-filter:blur(6px)}
.badge.soon{color:#bdbdbd}
.body{padding:18px 20px 20px;display:flex;flex-direction:column;flex:1}
.body h3{font-family:var(--hf);font-stretch:125%;letter-spacing:-.01em;font-size:28px;font-weight:600;margin:0;color:var(--ink);line-height:1.1}
.meta{color:var(--muted);font-size:13px;margin:6px 0 10px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.body p{margin:0 0 18px;color:var(--text);font-size:14.5px;flex:1}
.body .btn{width:100%}
section{padding-top:72px}
.h2{font-family:var(--hf);font-stretch:125%;letter-spacing:-.01em;font-weight:600;font-size:clamp(34px,4.6vw,48px);color:var(--ink);margin:10px 0 28px;line-height:1.05}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.step{background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:24px}
.step b{display:block;font-family:var(--hf);font-stretch:125%;letter-spacing:-.01em;font-size:44px;color:var(--gold);line-height:1;font-weight:500}
.step h4{margin:12px 0 6px;font-size:18px;color:var(--ink)}
.step p{margin:0;color:var(--muted);font-size:14.5px}
.pro{background:#1c1c1b;border:1px solid rgba(242,239,233,.18);border-radius:28px;padding:44px;display:grid;grid-template-columns:1.3fr 1fr;gap:32px;align-items:center}
.pro ul{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.pro li{display:flex;gap:12px;color:var(--text)}
.pro li:before{content:"✦";color:var(--gold)}
.pro .soon{display:inline-block;margin-bottom:14px}
@media (max-width:980px){.grid{grid-template-columns:repeat(2,1fr)}.pro{grid-template-columns:1fr;padding:28px}}
@media (max-width:640px){.grid,.steps{grid-template-columns:1fr}.hero{padding:48px 0 24px}.hero p{font-size:16px}}
.price-toggle{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:4px;margin:0 0 24px;background:var(--bg2)}
.price-toggle button{border:0;background:none;color:var(--muted);font:inherit;font-weight:700;font-size:14px;padding:8px 16px;border-radius:999px;cursor:pointer}
.price-toggle button.on{background:var(--ink);color:#131312}
.price-toggle small{color:var(--gold);font-weight:800;margin-left:4px}
.price-toggle button.on small{color:#131312;opacity:.55}
.nav a{white-space:nowrap}
.plans{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;align-items:stretch}
.plan{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px;display:flex;flex-direction:column;position:relative}
.plan.best{background:#f2efe9;border-color:#f2efe9;box-shadow:0 30px 70px rgba(0,0,0,.35);color:#131312}
.plan.best h3,.plan.best .pr b{color:#131312}.plan.best .for,.plan.best .pr span,.plan.best .pr s,.plan.best .sub{color:#6b6862}.plan.best li{color:#1f1f1e}.plan.best li:before{color:#131312}
.plan.best .tag{right:20px;left:auto;background:#131312;color:#f2efe9;border:1px solid #f2efe9}
.plan.best .btn.gold{background:#131312;color:#f2efe9}.plan.best .btn.gold:hover{background:#000}
.plan .tag{position:absolute;top:-12px;left:28px;background:#f2efe9;color:#131312;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:5px 12px;border-radius:999px}
.plan h3{font-family:var(--hf);font-stretch:125%;letter-spacing:-.01em;font-size:24px;font-weight:600;margin:0;color:var(--ink)}
.plan .for{color:var(--muted);font-size:14px;margin:4px 0 18px;min-height:42px}
.plan .pr{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.plan .pr{flex-wrap:wrap}.plan .pr s{color:var(--muted);font-size:16px;font-weight:600}
.plan .pr b{font-family:var(--hf);font-stretch:125%;letter-spacing:-.01em;font-size:40px;font-weight:500;color:var(--gold);line-height:1}
.plan .pr span{color:var(--muted);font-size:14px}
.plan .sub{color:var(--muted);font-size:13px;min-height:20px;margin-bottom:18px}
.plan ul{list-style:none;padding:0;margin:0 0 24px;display:grid;gap:10px;flex:1;align-content:start}
.plan .pr b.fr{font-size:32px!important}
.plan li{display:flex;gap:10px;font-size:14px;color:var(--text)}
.plan li.hl{font-weight:700}
.plan li:before{content:"✦";color:var(--gold);flex:none}
.plan .btn{width:100%;white-space:nowrap;padding-left:12px;padding-right:12px}
.toggles{display:flex;flex-direction:column;align-items:center;gap:10px;margin:0 0 28px}
.toggles .price-toggle{margin:0}
.price-toggle.sm button{font-size:13px;padding:6px 14px}
.price-toggle.off{visibility:hidden}
.plan .pr small{color:var(--muted);font-size:14px;font-weight:600}
.plan .btn[aria-disabled=true]{opacity:.5;pointer-events:none}
.agency{margin-top:20px;display:flex;align-items:center;gap:24px;flex-wrap:wrap;text-align:left;border:1px dashed rgba(255,255,255,.22);border-radius:24px;padding:22px 26px;background:rgba(255,255,255,.02)}
.agency .at{flex:1;min-width:240px}
.agency h3{font-family:var(--hf);font-stretch:125%;text-transform:uppercase;font-size:18px;font-weight:600;margin:0 0 8px;color:var(--ink)}
.agency .chips2{display:flex;flex-wrap:wrap;gap:6px}
.agency .chips2 span{border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:13px;color:var(--text)}
.agency .ar{display:flex;align-items:center;gap:16px}
.agency .ar b{font-size:15px;color:var(--muted);font-weight:600;white-space:nowrap}
@media (max-width:640px){.agency{padding:20px}.agency .ar{width:100%;justify-content:space-between}}
.pnote{text-align:center;color:var(--muted);font-size:13px;margin-top:18px}
@media (max-width:1100px){.plans{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){.plans{grid-template-columns:1fr;max-width:520px;margin:0 auto}}
.cmp{margin:56px auto 0;max-width:980px;text-align:left}
.cmp h3{text-align:center;font-family:var(--hf);font-stretch:125%;text-transform:uppercase;font-size:22px;font-weight:600;margin:0 0 18px;color:var(--ink)}
.cmpw{overflow-x:auto;border:1px solid var(--line);border-radius:20px;background:var(--bg2)}
.cmp table{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
.cmp th,.cmp td{padding:13px 16px;border-bottom:1px solid var(--line);text-align:center;color:var(--text);vertical-align:middle}
.cmp th{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800}
.cmp td:first-child,.cmp th:first-child{text-align:left;color:var(--ink);font-weight:700}
.cmp tr:last-child td{border-bottom:0}
.cmp .y{color:var(--gold);font-weight:800}.cmp .n{color:rgba(255,255,255,.28)}
.cmp th.best,.cmp td.best{background:rgba(242,239,233,.05)}
