<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Секретная миссия · игра для знакомства гостей</title>
<meta name="description" content="Каждый гость получает личную тайную миссию и знакомится с другими. Игра по QR, без приложений.">
<meta name="theme-color" content="#14151d">
<meta property="og:title" content="Секретная миссия · Secret Mission">
<meta property="og:description" content="Игра, которая знакомит гостей на свадьбе">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%95%B6%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#14151d;--bg2:#1b1c27;--card:#212330;--card2:#272a39;--line:rgba(255,255,255,.08);--ink:#f5efe4;--text:#e7dfd1;--muted:#a99c8e;--gold:#e2cd92;--gold2:#d8c28a;--acc:#b8894d}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.55;overflow-x:clip}
a{color:inherit}
.serif{font-family:"Cormorant Garamond",Georgia,serif}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.top{position:sticky;top:0;z-index:10;background:rgba(20,21,29,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none}
.brand i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#e2cd92,#8a6a35);display:grid;place-items:center;font-style:normal;color:#14151d;font-weight:800;font-size:14px}
.brand b{font-family:"Cormorant Garamond",Georgia,serif;font-size:22px;font-weight:600;color:var(--ink);letter-spacing:.2px}
.brand span{color:var(--muted);font-size:13px}
.nav{display:flex;gap:4px;margin-left:auto;align-items:center}
.nav a{color:var(--muted);text-decoration:none;font-weight:600;font-size:14px;padding:8px 12px;border-radius:999px}
.nav a:hover,.nav a.on{color:var(--ink);background:rgba(255,255,255,.06)}
.lang{border:1px solid var(--line);background:none;color:var(--ink);font:inherit;font-weight:800;font-size:12px;letter-spacing:.06em;width:40px;height:40px;border-radius:50%;cursor:pointer;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:14px 22px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;transition:transform .15s,background .2s}
.btn:active{transform:scale(.97)}
.btn.gold{background:linear-gradient(135deg,#e8d59e,#c9a86a);color:#191a24}
.btn.ghost{background:rgba(255,255,255,.06);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:rgba(255,255,255,.1)}
.btn[disabled]{opacity:.45;cursor:default}
.k{color:var(--gold2);letter-spacing:.24em;text-transform:uppercase;font-weight:700;font-size:12px}
.chip{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--muted);font-weight:600}
footer{border-top:1px solid var(--line);margin-top:80px;padding:32px 0 48px;color:var(--muted);font-size:13px}
footer .wrap{display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap}
@media (max-width:760px){.nav a:not(.keep){display:none}.brand span{display:none}.wrap{padding:0 16px}}

.back{color:var(--muted);text-decoration:none;font-weight:600;font-size:14px}
.back:hover{color:var(--ink)}
.hero{display:grid;grid-template-columns:1.15fr 1fr;gap:48px;align-items:center;padding:64px 0 24px;position:relative}
.hero:before{content:"";position:absolute;right:-10%;top:-10%;width:720px;height:520px;background:radial-gradient(ellipse at center,rgba(226,205,146,.14),rgba(20,21,29,0) 62%);pointer-events:none}
.hero h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:clamp(46px,7vw,84px);line-height:1;margin:12px 0 16px;color:var(--ink)}
.hero p.lead{color:var(--muted);font-size:18px;max-width:540px;margin:0}
.facts{display:flex;gap:18px;flex-wrap:wrap;margin:22px 0 28px;color:var(--text);font-size:14px}
.facts span{display:flex;gap:8px;align-items:center}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.phone{justify-self:center;width:300px;aspect-ratio:9/18.5;border-radius:44px;background:#0f1016;border:1px solid rgba(255,255,255,.12);box-shadow:0 40px 90px rgba(0,0,0,.5),inset 0 0 0 8px #191a24;padding:22px 16px;position:relative;transform:rotate(3deg)}
.phone:before{content:"";position:absolute;top:14px;left:50%;width:84px;height:22px;border-radius:12px;background:#0b0b10;transform:translateX(-50%)}
.scr{background:#f6f1e9;border-radius:30px;height:100%;padding:34px 14px 14px;color:#2a2420;overflow:hidden;font-size:12px}
.scr .row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.scr .nm{font-weight:800;font-size:14px}.scr .dots{display:flex;gap:4px;margin-top:4px}.scr .dots i{width:7px;height:7px;border-radius:50%;background:#e8dfd2}.scr .dots i.on{background:#b8894d}
.scr .code{border:1.5px solid #b8894d;border-radius:10px;padding:3px 8px;text-align:center;font-weight:800;font-size:15px;letter-spacing:.1em}
.scr .code small{display:block;font-size:7px;color:#86796c;letter-spacing:.12em;text-transform:uppercase}
.scr .card{background:#fff;border-radius:14px;padding:14px;box-shadow:0 6px 18px rgba(60,40,20,.08);margin-bottom:10px}
.scr .kk{font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:#b8894d;font-weight:800}
.scr .task{font-family:"Cormorant Garamond",Georgia,serif;font-size:20px;line-height:1.15;font-weight:600;margin-top:6px}
.scr .emo{font-size:58px;text-align:center;margin:8px 0 2px}
.scr .btnm{background:#b8894d;color:#fff;border-radius:10px;text-align:center;padding:10px;font-weight:800;margin-top:8px}
section{padding-top:80px}
.h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:clamp(34px,4.6vw,48px);color:var(--ink);margin:10px 0 28px;line-height:1.05}
.types{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.type{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px}
.type i{font-style:normal;font-size:34px}
.type h4{margin:12px 0 6px;color:var(--ink);font-size:17px}
.type p{margin:0;color:var(--muted);font-size:14px}
.host{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.hf{background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;gap:16px}
.hf i{font-style:normal;font-size:28px;flex:none}
.hf h4{margin:0 0 4px;color:var(--ink);font-size:17px}
.hf p{margin:0;color:var(--muted);font-size:14px}
.proof{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;text-align:center}
.proof div{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px 12px}
.proof b{display:block;font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:56px;color:var(--gold);line-height:1}
.proof span{display:block;margin-top:8px;color:var(--muted);font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.final{text-align:center;background:linear-gradient(135deg,#262838,#1b1c27);border:1px solid rgba(226,205,146,.18);border-radius:28px;padding:48px 24px}
.final p{color:var(--muted);max-width:560px;margin:0 auto 22px}
.modal{position:fixed;inset:0;background:rgba(10,10,14,.7);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.on{display:flex}
.box{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px;width:100%;max-width:420px}
.box h3{font-family:"Cormorant Garamond",Georgia,serif;font-size:30px;margin:0 0 6px;color:var(--ink);font-weight:600}
.box p{color:var(--muted);margin:0 0 16px;font-size:14px}
.box input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px;color:var(--ink);font:inherit;font-size:16px;outline:none;margin-bottom:12px}
.box input:focus{border-color:var(--gold2)}
.box .row{display:flex;gap:8px}.box .row .btn{flex:1}
@media (max-width:980px){.hero{grid-template-columns:1fr;gap:36px}.types{grid-template-columns:repeat(2,1fr)}.proof{grid-template-columns:repeat(2,1fr)}.host{grid-template-columns:1fr}}
@media (max-width:560px){.types{grid-template-columns:1fr}.phone{width:250px}.hero{padding-top:36px}.proof b{font-size:44px}}
</style>
</head>
<body>

  <section>
    <div class="k" data-t="typesK"></div>

  </section>

  <section>
    <div class="k" data-t="hostK"></div>
    <div class="h2" data-t="hostH"></div>
    <div class="host">
      <div class="hf"><i>✨</i><div><h4 data-t="h1h"></h4><p data-t="h1p"></p></div></div>

  <section>
    <div class="k" data-t="proofK"></div>
    <div class="h2" data-t="proofH"></div>
    <div class="proof">
      <div><b>36</b><span data-t="p1"></span></div><div><b>82</b><span data-t="p2"></span></div><div><b>126</b><span data-t="p3"></span></div><div><b>97</b><span data-t="p4"></span></div>
    </div>
  </section>

  <section>
    <div class="final">
      <div class="h2" style="margin-top:0" data-t="finH"></div>
      <p data-t="finP"></p>
      <div class="cta" style="justify-content:center"><a class="btn gold" href="https://pabeloglazov.com" target="_blank" rel="noopener" data-t="finBtn"></a><a class="btn ghost" href="../" data-t="all"></a></div>
    </div>
  </section>
</div>

<div class="modal" id="modal"><div class="box">
  <h3 data-t="mhH"></h3><p data-t="mhP"></p>
  <input id="key" type="password" autocomplete="off" data-ph="mhPh">
  <div class="row"><button class="btn ghost" id="mhCancel" data-t="cancel"></button><button class="btn gold" id="mhGo" data-t="enter"></button></div>
</div></div>

<footer><div class="wrap"><span data-t="foot"></span><a href="https://pabeloglazov.com" target="_blank" rel="noopener">pabeloglazov.com</a></div></footer>
