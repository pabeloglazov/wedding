<style>
  :root{
    --accent:#b8894d; --bg:#f6f1e9; --card:#ffffff; --ink:#2a2420; --muted:#86796c; --line:#e8dfd2;
    --ok:#3f8a5a; --err:#b4483c; --r:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.45}
  body{min-height:100vh;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 28px)}
  .wrap{max-width:460px;margin:0 auto}
  h1,h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;margin:0;line-height:1.1}
  h1{font-size:44px;letter-spacing:.5px}
  h2{font-size:30px}
  .langbar{display:flex;justify-content:flex-end;margin-bottom:6px}
  .lang{display:inline-flex;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:3px}
  .lang button{border:0;background:none;font:inherit;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted);padding:6px 12px;border-radius:999px}
  .lang button.on{background:var(--ink);color:#fff}
  .hero{text-align:center;padding:10px 6px 22px}
  .kicker{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:8px}
  .lead{color:var(--muted);margin:14px 0 0}
  .card{background:var(--card);border-radius:var(--r);padding:20px;margin-bottom:14px;box-shadow:0 1px 2px rgba(60,40,20,.05),0 8px 24px rgba(60,40,20,.06)}
  .center{text-align:center}
  .lbl{display:block;font-weight:700;font-size:15px;margin:4px 0 8px}
  .lbl .opt{font-weight:500;color:var(--muted);font-size:13px}
  .lbl + .inp, .lbl + .seg{margin-bottom:18px}
  .hint{color:var(--muted);font-size:13px;margin:-4px 0 12px}
  .inp{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;font:inherit;font-size:17px;background:#fffdfa;color:var(--ink);outline:none;resize:none}
  .inp:focus{border-color:var(--accent)}
  .inp.code{font-size:34px;letter-spacing:.35em;text-align:center;font-weight:700;padding:12px}
  textarea.inp{font-size:16px}
  .seg{display:flex;gap:8px}
  .seg button{flex:1;border:1.5px solid var(--line);background:#fffdfa;border-radius:12px;padding:12px 6px;font:inherit;font-size:14px;font-weight:600;color:var(--ink)}
  .seg button.on{border-color:var(--accent);background:var(--accent);color:#fff}
  .facts{display:flex;flex-direction:column;gap:8px}
  .fact{display:flex;align-items:center;gap:12px;text-align:left;border:1.5px solid var(--line);background:#fffdfa;border-radius:14px;padding:12px 14px;font:inherit;font-size:15px;color:var(--ink)}
  .fact .box{flex:0 0 22px;height:22px;border-radius:7px;border:2px solid var(--line);position:relative}
  .fact.on{border-color:var(--accent);background:#fbf5ec}
  .fact.on .box{background:var(--accent);border-color:var(--accent)}
  .fact.on .box:after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
  .btn{display:block;width:100%;border:0;border-radius:16px;padding:17px;margin-top:16px;font:inherit;font-size:17px;font-weight:700;background:var(--ink);color:#fff}
  .btn.acc{background:var(--accent)}
  .btn:disabled{opacity:.55}
  .link{display:block;margin:12px auto 0;background:none;border:0;color:var(--muted);font:inherit;font-size:14px;text-decoration:underline;text-underline-offset:3px;padding:8px}
  .err{color:var(--err);font-size:14px;font-weight:600;margin-top:10px;min-height:0}
  .err:empty{display:none}
  .muted{color:var(--muted)}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
  .hello{font-weight:700;font-size:17px}
  .dots{display:flex;gap:5px;margin-top:6px;align-items:center;flex-wrap:wrap}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--line)}
  .dot.on{background:var(--accent)}
  .plus{font-size:12px;color:var(--accent);font-weight:700;margin-left:4px}
  .codechip{border:1.5px solid var(--accent);background:#fff;border-radius:14px;padding:6px 12px;text-align:center;font:inherit;color:var(--ink)}
  .codechip span{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .codechip b{font-size:22px;letter-spacing:.12em}
  .task{font-size:19px;line-height:1.4;margin:12px 0 0}
  .task.big{font-family:"Cormorant Garamond",Georgia,serif;font-size:27px;font-weight:600;line-height:1.2}
  .secret{font-size:12px;color:var(--muted);margin:14px 0 0;letter-spacing:.04em}
  .emoji{font-size:110px;line-height:1;margin:14px 0 6px}
  .ename{font-family:"Cormorant Garamond",Georgia,serif;font-size:32px;font-weight:600}
  .banner{background:var(--ink);color:#fff;border-radius:var(--r);padding:16px 18px;margin-bottom:14px}
  .banner b{color:#f3d9ae}
  .photo{display:flex;align-items:center;justify-content:center;gap:10px;border:1.5px dashed var(--line);border-radius:14px;padding:14px;margin-top:14px;color:var(--muted);font-weight:600;cursor:pointer;flex-direction:column}
  .photo input{display:none}
  .photo img{max-width:100%;max-height:220px;border-radius:10px}
  .spin{width:54px;height:54px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--accent);margin:18px auto;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .ov{position:fixed;inset:0;background:rgba(30,22,16,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px;z-index:10;animation:fi .2s}
  .ovcard{background:var(--card);border-radius:24px;padding:28px 22px 18px;width:100%;max-width:460px;text-align:center;animation:up .28s cubic-bezier(.2,.9,.3,1.2)}
  @keyframes fi{from{opacity:0}}
  @keyframes up{from{transform:translateY(40px);opacity:0}}
  .check{width:68px;height:68px;border-radius:50%;background:var(--ok);color:#fff;font-size:36px;line-height:68px;margin:0 auto 14px}
  .bigcode{font-size:84px;font-weight:700;letter-spacing:.15em;margin:10px 0}
  .progress{font-weight:700;color:var(--accent);margin-top:10px}
  .loading{text-align:center;padding-top:30vh;color:var(--muted)}
  /* живая лента */
  .live{padding:18px 18px 8px}
  .livehead{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--ink)}
  .pulse{width:8px;height:8px;border-radius:50%;background:#d0493b;box-shadow:0 0 0 0 rgba(208,73,59,.5);animation:pl 1.6s infinite}
  @keyframes pl{70%{box-shadow:0 0 0 8px rgba(208,73,59,0)}100%{box-shadow:0 0 0 0 rgba(208,73,59,0)}}
  .lstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 6px}
  .lstats div{background:#fbf7f1;border-radius:12px;padding:10px 8px;text-align:center}
  .lstats b{display:block;font-size:24px;font-weight:700;line-height:1.1}
  .lstats span{font-size:11px;color:var(--muted);font-weight:600}
  .podium{margin:14px 0 4px}
  .podium h3,.ticker h3{margin:0 0 6px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .prow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
  .prow:last-child{border:0}
  .medal{font-size:22px;width:28px;text-align:center}
  .pname{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pscore{font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap}
  .ticker{margin-top:14px}
  .trow{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
  .trow:last-child{border:0}
  .trow .tt{flex:1}
  .trow .ago{font-size:12px;color:var(--muted);white-space:nowrap}
  .trow.new{animation:nw 1.2s ease}
  @keyframes nw{from{background:#fbf0de}to{background:transparent}}
  .empty{color:var(--muted);font-size:14px;padding:6px 0 10px}
</style>
</head>

      '<div class="card">' +
      '<label class="lbl" for="name">' + T('name') + '</label>' +
      '<input id="name" class="inp" maxlength="40" autocomplete="given-name" placeholder="' + T('namePh') + '" value="' + esc(nameVal) + '">' +
      '<label class="lbl">' + T('side') + '</label>' +
      '<div class="seg" id="side">' +
      ['Жених', 'Невеста', 'Оба'].map(function (s) {
        var t = s === 'Жених' ? T('groom') : s === 'Невеста' ? T('bride') : T('both');
        return '<button type="button" data-s="' + s + '"' + (regSide === s ? ' class="on"' : '') + '>' + t + '</button>';
      }).join('') + '</div>' +
      (facts ? '<label class="lbl">' + T('factsLbl') + '</label><p class="hint">' + T('factsHint') + '</p><div class="facts" id="facts">' + facts + '</div>' : '') +
      '<div class="err" id="err"></div>' +
      '<button class="btn acc" id="go">' + T('getMission') + '</button>' +
      '</div>' +
      '<button class="link" id="rec">' + T('lost') + '</button>';

    $('side').onclick = function (e) {
      var b = e.target.closest('button'); if (!b) return;
      regSide = b.dataset.s;
      [].forEach.call(this.children, function (c) { c.classList.toggle('on', c === b); });
    };
    if ($('facts')) $('facts').onclick = function (e) {
      var b = e.target.closest('.fact'); if (!b) return;
      var k = b.dataset.k; regFacts[k] = !regFacts[k]; b.classList.toggle('on', regFacts[k]);
    };
    $('rec').onclick = recoverView;
    $('go').onclick = function () {
      if (busy) return;
      var name = $('name').value.trim();
      if (!name) { setErr(T('enterName')); $('name').focus(); return; }
      var facts = Object.keys(regFacts).filter(function (k) { return regFacts[k]; });
      var btn = this; lock(btn, T('issuing')); setErr('');
      call('apiRegister', name, regSide, facts, L).then(function (r) {
        busy = false; gid = r.guestId; store('set', LS, gid); lastSig = ''; showState(r.state, true); loadFeed();
      }).catch(function (m) { unlock(btn); setErr(m); });
    };
  }

  function recoverView() {
    view = 'recover';
    app.innerHTML =
      '<div class="hero"><h2>' + T('backTitle') + '</h2><p class="lead">' + T('backLead') + '</p></div>' +
      '<div class="card"><label class="lbl" for="rname">' + T('nameShort') + '</label><input id="rname" class="inp" maxlength="40">' +
      '<label class="lbl" for="rcode">' + T('yourCode') + '</label><input id="rcode" class="inp code" inputmode="numeric" maxlength="3" placeholder="000">' +
      '<div class="err" id="err"></div><button class="btn" id="rgo">' + T('back') + '</button></div>' +
      '<button class="link" id="back">' + T('goBack') + '</button>';
    $('back').onclick = welcome;
    $('rgo').onclick = function () {
      if (busy) return;
      var btn = this; lock(btn); setErr('');
      call('apiRecover', $('rname').value, $('rcode').value, L).then(function (r) {
        busy = false; gid = r.guestId; store('set', LS, gid); lastSig = ''; showState(r.state, true);
      }).catch(function (m) { unlock(btn); setErr(m); });
    };
  }

  function closedView(st) {
    return '<div class="hero">' + (cfgCouple() ? '<div class="kicker">' + esc(cfgCouple()) + '</div>' : '') +
      '<h1>' + esc(cfgTitle()) + '</h1><p class="lead">' + T('closed') + '</p></div>' +
      (st ? '<div class="card center"><div class="kicker">' + T('yourCode') + '</div><div class="bigcode">' + esc(st.me.code) + '</div><p class="muted">' + T('doneCount') + st.me.done + '</p></div>' : '');
  }

  /* ---------- основной экран ---------- */

  function sigOf(st) {
    var m = st.mission;
    if (!st.open) return 'closed|' + L;
    if (!m) return 'none|' + st.me.done + '|' + st.me.finished + '|' + L;
    return [m.type, m.status, m.emoji || '', m.partnerName || '', m.text, m.requeued ? 1 : 0, L].join('|');
  }

  function showState(st, force) {
    view = 'game';
    ST = st;
    clearTimeout(pollT);
    var sig = sigOf(st);
    if (sig !== lastSig || force) {
      var note = $('note') ? $('note').value : '', code = $('code') ? $('code').value : '';
      lastSig = sig; photoData = null;
      app.innerHTML = st.open ? mainView(st) : closedView(st);
      if (note && $('note')) $('note').value = note;
      if (code && $('code')) $('code').value = code;
      if (force) window.scrollTo(0, 0);
    }
    updateLive(st);
    schedule(st);
  }

  function schedule(st) {
    var m = st.mission;
    var ms = 0;
    if (!st.open) ms = 20000;
    else if (m && m.type === 'pair' && m.status === 'waiting') ms = 3000;
    else if (m && m.type === 'pair' && m.status === 'searching') ms = 6000;
    if (ms) pollT = setTimeout(refresh, ms);
  }

  function refresh() {
    if (!gid) return;
    call('apiState', gid, L).then(handle).catch(function () { pollT = setTimeout(refresh, 8000); });
  }

  function handle(r) {
    if (r && r.lost) { store('del', LS); gid = null; lastSig = ''; welcome(); return; }
    showState(r.state);
  }

  function dots(me) {
    var h = '';
    for (var i = 0; i < me.goal; i++) h += '<span class="dot' + (i < me.done ? ' on' : '') + '"></span>';
    if (me.done > me.goal) h += '<span class="plus">+' + (me.done - me.goal) + '</span>';
    return h;
  }

  function mainView(st) {
    var me = st.me, m = st.mission;
    var h = '<div class="top"><div><div class="hello">' + esc(me.name) + '</div><div class="dots">' + dots(me) + '</div></div>' +
      '<button class="codechip" data-act="code"><span>' + T('codeChip') + '</span><b>' + esc(me.code) + '</b></button></div>';
    if (me.finished) h += '<div class="banner"><b>' + T('finale') + '</b> ' + esc(st.finale) + '</div>';
    h += missionView(st, m);
    return h;
  }

  function noteField() {
    return '<label class="lbl" for="note">' + T('noteLbl') + ' <span class="opt">' + T('optional') + '</span></label>' +
      '<textarea id="note" class="inp" rows="2" maxlength="300" placeholder="' + T('notePh') + '"></textarea>';
  }
  function photoField() {
    return '<label class="photo" id="photoLbl"><input type="file" id="photo" accept="image/*">' +
      '<span id="photoTxt">' + T('addPhoto') + '</span><img id="photoPrev" alt="" hidden></label>';
  }

  function missionView(st, m) {
    var me = st.me;
    if (!m) {
      return '<div class="card center"><div class="kicker">' + T('mission') + (me.done + 1) + '</div>' +
        '<h2>' + (me.done ? T('readyNext') : T('ready')) + '</h2>' +
        '<p class="muted">' + T('onlyYou') + '</p>' +
        '<button class="btn acc" data-act="next">' + T('getMission') + '</button></div>';
    }
    var labels = { find: T('tFind'), meet: T('tMeet'), fun: T('tFun') };

    if (m.type === 'pair' && m.status === 'waiting') {
      return '<div class="card center"><div class="kicker">' + T('mission') + m.num + '</div>' +
        '<h2>' + (m.requeued ? T('pairLost') : T('pairPick')) + '</h2>' +
        '<div class="spin"></div><p class="muted">' + (m.requeued ? T('pairNew') : '') + T('pairWait') + '</p>' +
        '<button class="link" data-act="nowait">' + T('noWait') + '</button></div>';
    }
    if (m.type === 'pair' && m.status === 'searching') {
      return '<div class="card center"><div class="kicker">' + T('mission') + m.num + ' · ' + T('findPair') + '</div>' +
        '<div class="emoji">' + esc(m.emoji) + '</div><div class="ename">' + esc(m.emojiName) + '</div>' +
        '<p>' + T('pairText') + '</p>' +
        '<p class="secret">' + T('pairHint') + '</p></div>' +
        '<div class="card"><label class="lbl" for="code">' + T('pairCode') + '</label>' +
        '<input id="code" class="inp code" inputmode="numeric" pattern="[0-9]*" maxlength="3" placeholder="000">' +
        '<div class="err" id="err"></div><button class="btn" data-act="confirm">' + T('weFound') + '</button></div>' +
        '<div id="giveup"></div>';
    }
    if (m.type === 'pair' && m.status === 'met') {
      return '<div class="card"><div class="kicker">' + T('mission') + m.num + ' · ' + T('metKicker') + '</div>' +
        '<h2>' + esc(T('itsX', m.partnerName)) + '</h2><p class="task">' + nl(m.text) + '</p></div>' +
        '<div class="card">' + noteField() + (m.photo ? photoField() : '') +
        '<div class="err" id="err"></div><button class="btn acc" data-act="complete">' + T('didIt') + '</button></div>';
    }
    var h = '<div class="card"><div class="kicker">' + T('mission') + m.num + ' · ' + (labels[m.type] || '') + '</div>' +
      '<p class="task big">' + nl(m.text) + '</p><p class="secret">' + T('secret') + '</p></div>' +
      '<div class="card">';
    if (m.needCode) {
      h += '<label class="lbl" for="code">' + T('askCode') + '</label>' +
        '<input id="code" class="inp code" inputmode="numeric" pattern="[0-9]*" maxlength="3" placeholder="000">';
    }
    h += noteField() + (m.photo ? photoField() : '') +
      '<div class="err" id="err"></div><button class="btn acc" data-act="complete">' + (m.needCode ? T('count') : T('done')) + '</button></div>';
    if (m.canSkip) h += '<button class="link" data-act="skip">' + T('skip', st.me.skipsLeft) + '</button>';
    return h;
  }

  function updateLive(st) {
    var m = st.mission, box = $('giveup');
    if (!box) return;
    if (m && m.type === 'pair' && m.status === 'searching' && m.elapsed >= m.giveUpAfter) {
      if (!box.innerHTML) box.innerHTML = '<button class="link" data-act="giveup">' + T('cantFind') + '</button>';
    } else box.innerHTML = '';
  }

  /* ---------- живая лента ---------- */

  function loadFeed() {
    if (!CFG.feed) return;
    clearTimeout(feedT);
    call('apiFeed').then(function (f) {
      if (f && f.off) { liveEl.innerHTML = ''; return; }
      FEED = f; renderLive();
      feedT = setTimeout(loadFeed, 20000);
    }).catch(function () { feedT = setTimeout(loadFeed, 30000); });
  }

  function ago(t) {
    var base = FEED ? FEED.now : Date.now();
    var s = Math.max(0, (base - t) / 1000);
    if (s < 60) return T('now');
    if (s < 3600) return Math.floor(s / 60) + T('min') + T('ago');
    return Math.floor(s / 3600) + T('hour') + T('ago');
  }

  function evText(e) {
    if (e.type === 'join') return T('eJoin');
    if (e.type === 'pair') return T('ePair').replace('{e}', e.emoji || '🤝');
    if (e.type === 'finish') return T('eFinish');
    if (e.type === 'done') return e.mtype === 'find' ? T('eFind') : e.mtype === 'meet' ? T('eMeet') : e.mtype === 'pair' ? T('ePairDone') : T('eFun');
    return '';
  }

  function renderLive() {
    if (!FEED || !CFG.feed) { liveEl.innerHTML = ''; return; }
    var s = FEED.stats, medals = ['🥇', '🥈', '🥉'];
    var top = FEED.top.length ? FEED.top.map(function (p, i) {
      return '<div class="prow"><span class="medal">' + medals[i] + '</span><span class="pname">' + esc(p.name) + '</span>' +
        '<span class="pscore">' + (p.finished ? T('finishedMark') + ' · ' : '') + p.done + T('of') + FEED.goal + '</span></div>';
    }).join('') : '<div class="empty">' + T('noLeaders') + '</div>';
    var evs = FEED.events.length ? FEED.events.slice(0, 8).map(function (e) {
      var k = e.t + e.type + (e.emoji || '') + (e.mtype || ''), isNew = Object.keys(seenEv).length && !seenEv[k];
      seenEv[k] = 1;
      return '<div class="trow' + (isNew ? ' new' : '') + '"><span class="tt">' + esc(evText(e)) + '</span><span class="ago">' + ago(e.t) + '</span></div>';
    }).join('') : '<div class="empty">' + T('noEvents') + '</div>';
    liveEl.innerHTML = '<div class="card live">' +
      '<div class="livehead"><span class="pulse"></span>' + T('live') + '</div>' +
      '<div class="lstats"><div><b>' + s.players + '</b><span>' + T('players') + '</span></div><div><b>' + s.meets + '</b><span>' + T('meets') + '</span></div><div><b>' + s.done + '</b><span>' + T('missions') + '</span></div></div>' +
      '<div class="podium"><h3>' + T('top3') + '</h3>' + top + '</div>' +
      '<div class="ticker"><h3>' + T('tick') + '</h3>' + evs + '</div></div>';
  }

  /* ---------- действия ---------- */

  app.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b) return;
    var a = b.dataset.act;
    if (a === 'code') return showCode();
    if (a === 'closeov') return closeOv();
    if (busy) return;
    if (a === 'next') return doNext(b);
    if (a === 'confirm') return doConfirm(b);
    if (a === 'complete') return doComplete(b);
    if (a === 'skip') return doSkip(b);
    if (a === 'giveup') return doGiveUp(b);
    if (a === 'nowait') return doNoWait(b);
  });

  app.addEventListener('change', function (e) {
    if (e.target.id !== 'photo' || !e.target.files || !e.target.files[0]) return;
    $('photoTxt').textContent = T('processing');
    resize(e.target.files[0], function (data) {
      photoData = data;
      var img = $('photoPrev');
      if (data && img) { img.src = data; img.hidden = false; $('photoTxt').textContent = T('replacePhoto'); }
      else $('photoTxt').textContent = T('photoFail');
    });
  });

  app.addEventListener('input', function (e) {
    if (e.target.id === 'code' || e.target.id === 'rcode') e.target.value = e.target.value.replace(/\D/g, '').slice(0, 3);
  });

  function doNext(b) {
    lock(b, T('choosing'));
    call('apiNext', gid, L).then(function (r) { busy = false; closeOv(); if (r.lost) return handle(r); lastSig = ''; showState(r.state, true); })
      .catch(function (m) { unlock(b); alert(m); });
  }

  function doConfirm(b) {
    var code = ($('code') || {}).value || '';
    if (!/^\d{3}$/.test(code)) { setErr(T('code3')); return; }
    lock(b, T('checking')); setErr('');
    call('apiConfirmPair', gid, code, L).then(function (r) { busy = false; handle(r); loadFeed(); })
      .catch(function (m) { unlock(b); setErr(m); });
  }

  function doComplete(b) {
    var m = ST && ST.mission; if (!m) return;
    var code = ($('code') || {}).value || '';
    if (m.needCode && !/^\d{3}$/.test(code)) { setErr(T('enterCode3')); return; }
    var note = ($('note') || {}).value || '';
    lock(b, photoData ? T('uploading') : T('checking')); setErr('');
    call('apiComplete', gid, code, note, photoData, L).then(function (r) {
      busy = false;
      if (r.lost) return handle(r);
      lastSig = ''; showState(r.state, true);
      showResult(r.state, r.state.result || {});
      loadFeed();
    }).catch(function (msg) { unlock(b); setErr(msg); });
  }

  function doSkip(b) {
    lock(b, T('changing'));
    call('apiSkip', gid, L).then(function (r) { busy = false; lastSig = ''; handle(r); })
      .catch(function (m) { unlock(b); alert(m); });
  }

  function doGiveUp(b) {
    if (!confirm(T('giveUpQ'))) return;
    lock(b);
    call('apiGiveUpPair', gid, L).then(function (r) { busy = false; lastSig = ''; handle(r); })
      .catch(function (m) { unlock(b); alert(m); });
  }

  function doNoWait(b) {
    lock(b, T('choosing'));
    call('apiGiveUpPair', gid, L).then(function (r) { busy = false; lastSig = ''; handle(r); })
      .catch(function (m) { unlock(b); alert(m); });
  }

  /* ---------- оверлеи ---------- */

  function overlay(html) {
    closeOv();
    var d = document.createElement('div');
    d.className = 'ov'; d.id = 'ov';
    d.innerHTML = '<div class="ovcard">' + html + '</div>';
    d.addEventListener('click', function (e) { if (e.target === d) closeOv(); });
    app.appendChild(d);
  }
  function closeOv() { var o = $('ov'); if (o) o.remove(); }

  function showCode() {
    overlay('<div class="kicker">' + T('yourCode') + '</div><div class="bigcode">' + esc(ST.me.code) + '</div>' +
      '<p class="muted">' + T('showCode') + '</p><button class="btn" data-act="closeov">' + T('close') + '</button>');
  }

  function showResult(st, res) {
    var me = st.me;
    if (res.justFinished) {
      overlay('<div class="check">★</div><div class="kicker">' + T('allDone') + '</div><h2>' + T('inFinal') + '</h2>' +
        '<p>' + nl(st.finale) + '</p>' +
        '<button class="btn acc" data-act="next">' + T('playOn') + '</button><button class="link" data-act="closeov">' + T('close') + '</button>');
      return;
    }
    overlay('<div class="check">✓</div><h2>' + T('counted') + '</h2>' +
      (res.partner ? '<p>' + T('newFriend') + '<b>' + esc(res.partner) + '</b></p>' : '') +
      '<div class="progress">' + me.done + T('of') + me.goal + '</div>' +
      '<button class="btn acc" data-act="next">' + T('nextMission') + '</button><button class="link" data-act="closeov">' + T('later') + '</button>');
  }

  /* ---------- фото ---------- */

  function resize(file, cb) {
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      var max = 1280, w = img.naturalWidth, h = img.naturalHeight;
      var k = Math.min(1, max / Math.max(w, h));
      var c = document.createElement('canvas');
      c.width = Math.round(w * k); c.height = Math.round(h * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      try { cb(c.toDataURL('image/jpeg', 0.82)); } catch (e) { cb(null); }
    };
    img.onerror = function () { URL.revokeObjectURL(url); cb(null); };
    img.src = url;
  }

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible') return;
    if (gid && !busy) { clearTimeout(pollT); refresh(); }
    loadFeed();
  });

  /* ---------- старт ---------- */
  paintLang();
  if (gid) refresh(); else welcome();
  loadFeed();
};
</script>
<script>
(function boot(n) {
  fetch(window.SM_API, { method: 'POST', credentials: 'omit', redirect: 'follow',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: 'apiConfig', args: [] }) })
    .then(function (r) { return r.json(); })
    .then(function (j) { if (!j.ok) throw new Error(j.error); CFG = j.data; window.SM_START(); })
    .catch(function () {
      if (n < 3) return setTimeout(function () { boot(n + 1); }, 1000 * (n + 1));
      document.getElementById('app').innerHTML = '<div style="text-align:center;padding:40px 10px;color:#86796c">Нет связи · No connection<br><br><button onclick="location.reload()" style="border:0;border-radius:12px;padding:12px 20px;background:#212330;color:#fff;font:inherit">Обновить · Reload</button></div>';
    });
})(0);
</script>
</body>
</html>
