<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Квиз о паре · Белоглазов</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#14151d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%8D%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#14151d;--bg2:#1b1c27;--card:#212330;--card2:#2a2c3b;--line:rgba(255,255,255,.08);--ink:#f5efe4;--text:#e7dfd1;--muted:#a99c8e;--gold:#e2cd92;--gold2:#d8c28a;
  --a:#e07a5f;--b:#3d9a8b;--c:#d9a441;--d:#7b6fd6;--ok:#4caf7d;--bad:#d9665b;--cream:#f6f1e9;--cink:#2a2420;--cmuted:#86796c}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit}
.serif{font-family:"Cormorant Garamond",Georgia,serif}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 20px;font-weight:700;font-size:15px;text-decoration:none;transition:transform .12s,background .2s,opacity .2s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.gold{background:linear-gradient(135deg,#e8d59e,#c9a86a);color:#191a24}
.btn.ghost{background:rgba(255,255,255,.06);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:rgba(255,255,255,.1)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.4;pointer-events:none}
.k{color:var(--gold2);letter-spacing:.22em;text-transform:uppercase;font-weight:700;font-size:11px}
.muted{color:var(--muted)}
.top{position:sticky;top:0;z-index:20;background:rgba(20,21,29,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .in{max-width:1400px;margin:0 auto;padding:0 20px;height:60px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;min-width:0}
.brand i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#e2cd92,#8a6a35);display:grid;place-items:center;font-style:normal;color:#14151d;font-weight:800;font-size:14px;flex:none}
.brand b{font-family:"Cormorant Garamond",Georgia,serif;font-size:21px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{color:var(--muted);font-size:12px;white-space:nowrap}
.sp{flex:1}
.tag{border:1px solid rgba(226,205,146,.35);color:var(--gold);border-radius:999px;padding:4px 10px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}

/* ---------- редактор ---------- */
.ed{max-width:880px;margin:0 auto;padding:28px 20px 120px}
.ed h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:clamp(36px,6vw,52px);line-height:1.02;margin:8px 0 6px;color:var(--ink)}
.ed .lead{color:var(--muted);margin:0 0 24px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;margin-bottom:16px}
.panel h3{margin:0 0 12px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:6px}
.inp{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--ink);font-size:16px;outline:none;transition:border-color .2s}
.inp:focus{border-color:var(--gold2)}
textarea.inp{resize:vertical;min-height:52px;line-height:1.4}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mode{background:var(--bg2);border:1.5px solid var(--line);border-radius:16px;padding:14px;text-align:left;color:var(--text);transition:border-color .2s,background .2s}
.mode b{display:block;color:var(--ink);font-size:15px;margin:4px 0 2px}
.mode span{font-size:12px;color:var(--muted);line-height:1.35;display:block}
.mode i{font-style:normal;font-size:22px}
.mode.on{border-color:var(--gold2);background:#262738}
.tune{margin-top:12px}
.tune summary{cursor:pointer;color:var(--gold2);font-weight:700;font-size:14px;list-style:none}
.tune summary::-webkit-details-marker{display:none}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px;margin-top:14px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;padding:6px 0}
.sw input{width:44px;height:26px;appearance:none;-webkit-appearance:none;background:#3a3c4c;border-radius:99px;position:relative;cursor:pointer;flex:none;transition:background .2s}
.sw input:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.sw input:checked{background:var(--gold2)}.sw input:checked:after{transform:translateX(18px)}
.rng{display:flex;align-items:center;gap:10px;font-size:14px}
.rng input{flex:1;accent-color:var(--gold2)}
.rng b{min-width:44px;text-align:right;color:var(--ink)}
.qhead{display:flex;align-items:center;gap:10px;margin:26px 0 12px}
.qhead h2{font-family:"Cormorant Garamond",Georgia,serif;font-size:30px;margin:0;color:var(--ink);font-weight:600}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}}
.qtop{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.qnum{font-family:"Cormorant Garamond",Georgia,serif;font-size:26px;color:var(--gold);width:34px;line-height:1}
.qtools{margin-left:auto;display:flex;gap:4px}
.ic{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--muted);display:grid;place-items:center;font-size:15px}
.ic:hover{color:var(--ink);background:rgba(255,255,255,.06)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.opt{display:flex;align-items:center;gap:8px;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:4px 4px 4px 4px;transition:border-color .2s}
.opt.ok{border-color:var(--ok)}
.opt .ch{width:36px;height:36px;border-radius:9px;border:0;color:#fff;font-weight:800;flex:none;position:relative}
.opt.ok .ch:after{content:"✓";position:absolute;right:-5px;top:-6px;width:18px;height:18px;border-radius:50%;background:var(--ok);font-size:11px;line-height:18px;border:2px solid var(--bg)}
.opt input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--ink);font-size:15px;padding:8px 4px}
.hint{font-size:12px;color:var(--muted);margin-top:8px}
.qimg{margin:10px 0 10px}
.qimg .add{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px dashed var(--line);background:none;color:var(--muted);border-radius:12px;padding:12px;font-weight:700;font-size:14px;cursor:pointer;transition:border-color .2s,color .2s}
.qimg .add:hover,.qcard.drag .qimg .add{border-color:var(--gold);color:var(--gold)}
.qimg .add small{font-weight:600;opacity:.7}
.qimg .has{position:relative;border-radius:14px;overflow:hidden;background:#0b0c11;height:180px}
.qimg .has img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.qimg .has .bgb{position:absolute;inset:-20px;background-size:cover;background-position:center;filter:blur(18px) brightness(.55)}
.qimg .has .has-in{position:absolute;inset:0}
.qimg .has .acts{position:absolute;right:8px;bottom:8px;display:flex;gap:6px}
.qimg .has .acts button{border:0;border-radius:10px;padding:7px 11px;font-weight:800;font-size:13px;background:rgba(20,21,29,.78);color:#fff;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:pointer}
.qimg .busy{height:120px;border-radius:14px;display:grid;place-items:center;color:var(--muted);font-weight:700;border:1.5px dashed var(--line)}
.qimg .err{color:var(--bad);font-size:12px;font-weight:700;margin-top:6px}
.qcard.drag{border-color:var(--gold)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:rgba(20,21,29,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom))}
.bar .in{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar .btn.gold{flex:none;padding:14px 26px;font-size:16px}
.modal{position:fixed;inset:0;background:rgba(10,10,14,.7);backdrop-filter:blur(6px);z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.modal .box{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;width:100%;max-width:560px}
.modal h3{font-family:"Cormorant Garamond",Georgia,serif;font-size:28px;margin:0 0 6px;color:var(--ink)}
.modal pre{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:12px;color:var(--muted);margin:8px 0 12px;white-space:pre-wrap}

/* ---------- пульт ---------- */
.live{max-width:1400px;margin:0 auto;padding:18px 20px 24px;display:grid;grid-template-columns:320px minmax(0,1fr) 340px;gap:18px;align-items:start}
.ctl{position:sticky;top:78px;display:flex;flex-direction:column;gap:12px}
.next{width:100%;padding:18px;font-size:18px;border-radius:18px}
.next small{display:block;font-size:11px;opacity:.65;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.stat b{display:block;font-family:"Cormorant Garamond",Georgia,serif;font-size:32px;color:var(--gold);line-height:1;font-weight:500}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.cur{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.cur .q{color:var(--ink);font-weight:700;margin:4px 0 8px;line-height:1.35}
.cur .a{font-size:13px;color:var(--ok);font-weight:700}
.plist{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:8px 14px;max-height:340px;overflow:auto}
.plist .p{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.plist .p:last-child{border:0}
.plist .p b{flex:1;color:var(--ink);font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist .dot{width:8px;height:8px;border-radius:50%;background:#3a3c4c;flex:none}
.plist .dot.on{background:var(--ok)}
.links{display:flex;gap:8px;flex-wrap:wrap}
.pane h4{margin:0 0 8px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.pane h4 .btn{margin-left:auto}
.phwrap{display:flex;justify-content:center}
.phone{width:100%;max-width:340px;aspect-ratio:9/18.5;border-radius:40px;background:#0f1016;border:1px solid rgba(255,255,255,.12);padding:12px;box-shadow:0 30px 70px rgba(0,0,0,.45)}
.phone .scr{background:var(--cream);border-radius:30px;height:100%;overflow:auto;position:relative}
.tabs{display:none}
.kbd{font-size:12px;color:var(--muted);text-align:center}
.kbd b{border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--text);font-weight:700}

/* ---------- экран проектора ---------- */
.stage{container-type:inline-size;aspect-ratio:16/9;width:100%;position:relative;overflow:hidden;border-radius:18px;background:radial-gradient(ellipse at 50% 20%,#23263a,#0e0f15 70%);color:var(--ink);box-shadow:0 30px 70px rgba(0,0,0,.4);border:1px solid var(--line)}
.stage.full{border-radius:0;border:0;box-shadow:none}
.sv{position:absolute;inset:0;padding:4.5cqw 5cqw;display:flex;flex-direction:column;font-size:1.6cqw;animation:svIn .45s ease}
@keyframes svIn{from{opacity:0;transform:scale(.985)}}
.sv .kk{color:var(--gold2);letter-spacing:.24em;text-transform:uppercase;font-weight:700;font-size:.85em}
.sv h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:4.6em;line-height:1.02;margin:.15em 0 .2em}
.lob{display:grid;grid-template-columns:1fr auto;gap:4cqw;align-items:center;flex:1}
.lob .qr{background:#fff;border-radius:1.4em;padding:1.1em;width:17em;height:17em;display:grid;place-items:center}
.lob .qr img,.lob .qr canvas{width:100%!important;height:100%!important}
.lob .how{font-size:1.2em;color:var(--text);margin:.6em 0 1.2em}
.lob .how b{color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:.5em;max-height:12em;overflow:hidden}
.chips span{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:99em;padding:.35em .9em;font-weight:700;font-size:1em;animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
.qtop2{display:flex;align-items:center;gap:1em}
.qtop2 .n{font-weight:800;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;font-size:.9em}
.ring{margin-left:auto;width:5.2em;height:5.2em;position:relative;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:3.2}
.ring .bg{stroke:rgba(255,255,255,.1)}
.ring .fg{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset .25s linear,stroke .3s}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:1.8em;font-weight:800}
.qtext{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:3.6em;line-height:1.08;margin:.5em 0 .6em;flex:1;display:flex;align-items:center}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:1em}
.tile{border-radius:1em;padding:1em 1.2em;display:flex;align-items:center;gap:.8em;font-size:1.55em;font-weight:700;color:#fff;position:relative;overflow:hidden;transition:opacity .4s,transform .4s,filter .4s}
.tile .l{width:1.8em;height:1.8em;border-radius:.45em;background:rgba(255,255,255,.22);display:grid;place-items:center;font-weight:800;flex:none;font-size:.9em}
.tile .t{flex:1;position:relative;z-index:1}
.tile .cnt{position:relative;z-index:1;font-weight:800;opacity:0;transition:opacity .4s}
.tile .fill{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.18);width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.tiles.rev .tile{opacity:.35;filter:saturate(.4)}
.tiles.rev .tile.ok{opacity:1;filter:none;transform:scale(1.02);box-shadow:0 0 0 .18em #fff,0 1em 2em rgba(0,0,0,.35)}
.tiles.rev .tile .cnt{opacity:1}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:1em;color:var(--muted);font-weight:700;font-size:1em}
.qbody{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:2.2em;margin-top:.8em}
.qbody .qleft{display:flex;flex-direction:column;min-height:0}
.qbody .qtext{font-size:2.5em;margin:0 0 .5em;line-height:1.1}
.qbody .tiles{grid-template-columns:1fr;gap:.6em}
.qbody .tile{font-size:1.2em;padding:.55em .9em}
.qbody .tile .t{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.qpic{position:relative;border-radius:1.2em;overflow:hidden;background:#07080c;box-shadow:0 1.2em 3em rgba(0,0,0,.45);min-height:0;animation:picIn .6s cubic-bezier(.2,.8,.2,1)}
.qpic .bgb{position:absolute;inset:-2em;background-size:cover;background-position:center;filter:blur(2em) brightness(.5)}
.qpic img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
@keyframes picIn{from{opacity:0;transform:scale(.96)}}
.sv.wimg .ring{width:4.2em;height:4.2em}
.board{flex:1;display:grid;grid-template-rows:repeat(4,auto);grid-auto-flow:column;grid-auto-columns:1fr;column-gap:1.2em;row-gap:.6em;align-content:start;margin-top:.6em}
.brow{display:grid;grid-template-columns:2.2em 1fr auto;align-items:center;gap:.8em;background:rgba(255,255,255,.05);border-radius:.8em;padding:.5em .9em;font-size:1.35em;animation:rowIn .5s ease both}
@keyframes rowIn{from{opacity:0;transform:translateX(-1em)}}
.brow .pl{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.4em;color:var(--gold);text-align:center}
.brow .nm{font-weight:700;display:flex;align-items:center;gap:.5em;min-width:0}
.brow .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .up{color:var(--ok);font-size:.7em;font-weight:800}
.brow .dn{color:var(--bad);font-size:.7em;font-weight:800}
.brow .sc{font-weight:800}
.brow .gain{color:var(--gold);font-size:.7em;margin-right:.6em;font-weight:800}
.brow.me{background:rgba(226,205,146,.14)}
.pod{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:1.2em;align-items:end;padding:0 8em}
.pod>div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;opacity:0;transform:translateY(1em);transition:all .7s}
.pod>div.in{opacity:1;transform:none}
.pod .nm{font-family:"Cormorant Garamond",Georgia,serif;font-size:2em;font-weight:600;text-align:center;line-height:1.05}
.pod .ps{color:var(--muted);font-size:1em;margin:.2em 0 .5em;font-weight:700}
.pod .b{width:100%;height:0;border-radius:.8em .8em 0 0;background:linear-gradient(#e2cd92,#8a6a35);color:#14151d;font-weight:800;font-size:2.4em;display:flex;justify-content:center;padding-top:.2em;transition:height 1.1s cubic-bezier(.2,.8,.2,1)}
.noms{display:flex;gap:1em;justify-content:center;margin-top:1.2em}
.noms div{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:1em;padding:.7em 1.1em;text-align:center;opacity:0;transition:opacity .6s}
.noms div.in{opacity:1}
.noms i{font-style:normal;font-size:1.6em}
.noms span{display:block;font-size:.75em;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;font-weight:800;margin:.2em 0}
.noms b{font-size:1.15em}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}

/* ---------- телефон гостя ---------- */
.pv{min-height:100%;padding:22px 16px 20px;color:var(--cink);display:flex;flex-direction:column;font-size:15px;animation:svIn .35s ease}
.pv .kk{color:#b8894d;letter-spacing:.2em;text-transform:uppercase;font-weight:800;font-size:10px;text-align:center}
.pv h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:30px;line-height:1.05;margin:6px 0 4px;text-align:center}
.pv .sub{color:var(--cmuted);text-align:center;font-size:14px;margin:0 0 16px}
.pv .pin{width:100%;border:1.5px solid #e2d8c9;background:#fffdf9;border-radius:14px;padding:14px;font-size:17px;color:var(--cink);outline:none;margin-bottom:10px}
.pv .pin:focus{border-color:#b8894d}
.pv .pbtn{width:100%;border:0;border-radius:14px;padding:15px;font-weight:800;font-size:16px;background:#212330;color:#fff}
.pv .pbtn[disabled]{opacity:.4}
.pv .card{background:#fff;border-radius:18px;padding:16px;box-shadow:0 8px 24px rgba(60,40,20,.08)}
.pv .me{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--cmuted);margin-bottom:10px;font-weight:700}
.pv .me b{color:var(--cink)}
.pv .pq{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:22px;line-height:1.15;margin:4px 0 12px}
.pv .tm{height:6px;border-radius:99px;background:#ebe3d6;overflow:hidden;margin-bottom:12px}
.pv .tm i{display:block;height:100%;background:#b8894d;border-radius:99px;transition:width .25s linear}
.pv .ans{display:grid;grid-template-columns:1fr;gap:9px;flex:1}

<body>
<div id="app"></div>
<div class="modal" id="imp"><div class="box">
  <h3>Вставить вопросы списком</h3>
  <p class="muted" style="margin:0;font-size:14px">Каждый вопрос — отдельный блок через пустую строку. Правильный вариант отметьте «+», остальные «-».</p>

+ В церкви
- В кафе
- На работе
- В университете</pre>

</div></div>
<script>
(function () {
  'use strict';
  /* ============ общее ============ */
  var VIEW = (new URLSearchParams(location.search).get('view') || 'host');
  var KEY_CFG = 'pbq_cfg_v1', KEY_LIVE = 'pbq_live_v1';
  var L = ['A', 'B', 'C', 'D'], CL = ['ca', 'cb', 'cc', 'cd'], SH = ['▲', '◆', '●', '■'];
  var MODES = {
    wedding: { ic: '💍', t: 'Свадьба', d: 'Каждый сам за себя, быстрые вопросы, очки за скорость', s: { time: 20, speed: true, every: 3, teams: false, change: false } },
    pub: { ic: '🍻', t: 'Паб-квиз', d: 'Команды, больше времени, можно поменять ответ', s: { time: 45, speed: false, every: 5, teams: true, change: true } },
    corp: { ic: '🏢', t: 'Корпоратив', d: 'Каждый сам за себя, лидеры каждые 2 вопроса', s: { time: 30, speed: true, every: 2, teams: false, change: false } }
  };
  var SAMPLE = [
    ['Где познакомились Максим и Алина?', ['В церкви', 'В кафе', 'На работе', 'В университете'], 0],
    ['Кто первым написал сообщение?', ['Максим', 'Алина', 'Общий друг', 'Мама Алины'], 1],
    ['Сколько лет паре было, когда они познакомились?', ['17 и 16', '19 и 18', '22 и 20', '25 и 23'], 2],
    ['Куда было их первое свидание?', ['В кино', 'В парк', 'На каток', 'В ресторан'], 2],
    ['Какое любимое блюдо Максима?', ['Плов', 'Пицца', 'Борщ', 'Суши'], 0],
    ['Кто в паре лучше готовит?', ['Максим', 'Алина', 'Одинаково', 'Оба заказывают доставку'], 1],
    ['Где Максим сделал предложение?', ['На берегу океана', 'Дома за ужином', 'В горах', 'На крыше'], 2],
    ['Как зовут их кота?', ['Барсик', 'Персик', 'Нет кота', 'Мистер Бобо'], 3],
    ['Сколько времени пара встречалась до помолвки?', ['Полгода', '1 год', '2 года', '4 года'], 2],
    ['Кто из них больше опаздывает?', ['Максим', 'Алина', 'Никто', 'Оба и всегда'], 3]
  ];
  var BOTS = ['Аня', 'Максим К.', 'Оля', 'Дима', 'Лиза', 'Артём', 'Катя', 'Игорь', 'Маша', 'Саша', 'Вера', 'Паша'];
  var TEAMS = ['Сладкая парочка', 'Свидетели', 'Родня жениха', 'Родня невесты', 'Коллеги', 'Друзья детства'];

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function uid() { return Math.random().toString(36).slice(2, 10); }
  /* фото вопросов: хранятся отдельно от конфига и состояния игры, в состоянии — только id */
  var IMG = (function () {
    var P = 'pbq_img_', cache = {};
    function get(id) { if (!id) return ''; if (cache[id]) return cache[id]; try { var v = localStorage.getItem(P + id) || ''; if (v) cache[id] = v; return v; } catch (e) { return ''; } }
    function put(data) { var id = 'i' + uid(); localStorage.setItem(P + id, data); cache[id] = data; return id; }
    function gc(used) { try { var del = []; for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k && k.indexOf(P) === 0 && !used[k.slice(P.length)]) del.push(k); } del.forEach(function (k) { localStorage.removeItem(k); }); } catch (e) {} }
    function load(file) {
      return new Promise(function (res, rej) {
        if (!file || !/^image\//.test(file.type)) return rej(new Error('type'));
        var url = URL.createObjectURL(file), im = new Image();
        im.onload = function () {
          URL.revokeObjectURL(url);
          var max = 1600, q = 0.82, out = '';
          for (var k = 0; k < 6; k++) {
            var sc = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight)), w = Math.max(1, Math.round(im.naturalWidth * sc)), h = Math.max(1, Math.round(im.naturalHeight * sc));
            var c = document.createElement('canvas'); c.width = w; c.height = h;
            var x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(im, 0, 0, w, h);
            out = c.toDataURL('image/jpeg', q);
            if (out.length < 420000) break;
            max = Math.round(max * 0.8); q = Math.max(0.6, q - 0.06);
          }
          res(out);
        };
        im.onerror = function () { URL.revokeObjectURL(url); rej(new Error('decode')); };
        im.src = url;
      });
    }
    return { get: get, put: put, gc: gc, load: load };
  })();
  function picHtml(id, cls) { var d = IMG.get(id); if (!d) return ''; return '<div class="' + cls + '"><div class="bgb" style="background-image:url(' + d + ')"></div><img src="' + d + '" alt=""></div>'; }
  function ls(op, k, v) { try { if (op === 'get') return JSON.parse(localStorage.getItem(k) || 'null'); if (op === 'set') localStorage.setItem(k, JSON.stringify(v)); if (op === 'del') localStorage.removeItem(k); } catch (e) {} return null; }
  function plural(n, a, b, c) { var x = n % 10, y = n % 100; return x === 1 && y !== 11 ? a : x >= 2 && x <= 4 && (y < 10 || y >= 20) ? b : c; }

  /* ============ канал между вкладками ============ */
  var ch = null, handlers = [];
  try { ch = new BroadcastChannel('pbquiz'); ch.onmessage = function (e) { handlers.forEach(function (h) { h(e.data); }); }; } catch (e) {}
  window.addEventListener('storage', function (e) { if (e.key === 'pbq_msg' && e.newValue) { try { var m = JSON.parse(e.newValue); handlers.forEach(function (h) { h(m); }); } catch (x) {} } });
  function send(m) { if (ch) ch.postMessage(m); else try { localStorage.setItem('pbq_msg', JSON.stringify(Object.assign({ _: Date.now() + Math.random() }, m))); } catch (e) {} }
  function onMsg(h) { handlers.push(h); }

  /* ============ конфиг игры ============ */
  function defaultCfg() {
    return { title: 'Квиз о паре', couple: 'Максим и Алина', mode: 'wedding', s: Object.assign({}, MODES.wedding.s), bots: true,
      qs: SAMPLE.map(function (q) { return { id: uid(), text: q[0], opts: q[1].slice(), ok: q[2] }; }) };
  }
  var CFG = ls('get', KEY_CFG) || defaultCfg();
  function saveCfg() { ls('set', KEY_CFG, CFG); }

  /* ============ движок (живёт во вкладке ведущего) ============ */
  var G = null, botTimers = [], tick = null;
  function newGame() {
    var qs = CFG.qs.filter(function (q) { return (q.text.trim() || q.img) && q.opts.filter(function (o) { return o.trim(); }).length >= 2; });
    G = { id: uid(), title: CFG.title, couple: CFG.couple, mode: CFG.mode, s: Object.assign({}, CFG.s), qs: JSON.parse(JSON.stringify(qs)),
      phase: 'lobby', qi: -1, t0: 0, t1: 0, players: {}, ans: {}, prevRank: {}, ver: 0 };
    publish();
    if (CFG.bots) addBots();
  }
  function publish() { G.ver++; ls('set', KEY_LIVE, G); send({ type: 'state', g: G }); render(); }
  function clearBots() { botTimers.forEach(clearTimeout); botTimers = []; }
  function addBots() {
    var names = G.s.teams ? TEAMS : BOTS;
    names.forEach(function (n, i) {
      botTimers.push(setTimeout(function () {
        if (!G || G.phase === 'final') return;
        var id = 'bot' + i;
        if (!G.players[id]) { G.players[id] = { name: n, score: 0, streak: 0, best: 0, bot: true, skill: 0.45 + Math.random() * 0.4, gain: 0, ok: 0, times: [] }; publish(); }
      }, 500 + i * 450 + Math.random() * 400));
    });
  }
  function join(pid, name) {
    if (!G) return;
    name = String(name || '').trim().slice(0, 24) || 'Гость';
    if (G.players[pid]) { G.players[pid].name = name; }
    else G.players[pid] = { name: name, score: 0, streak: 0, best: 0, bot: false, gain: 0, ok: 0, times: [] };
    publish();
  }
  function answer(pid, qi, opt) {
    if (!G || G.phase !== 'question' || qi !== G.qi || !G.players[pid]) return;
    var a = G.ans[qi] || (G.ans[qi] = {});
    if (a[pid] && !G.s.change) return;
    if (Date.now() > G.t1) return;
    a[pid] = { o: opt, t: Date.now() - G.t0 };
    publish();
    maybeAutoReveal();
  }
  function startQuestion(i) {
    clearBots();
    G.phase = 'question'; G.qi = i;
    var q = G.qs[i];
    var dur = (q.time || G.s.time) * 1000;
    G.t0 = Date.now() + 1200; G.t1 = G.t0 + dur;
    G.ans[i] = {};
    Object.keys(G.players).forEach(function (id) {
      var p = G.players[id]; p.gain = 0;
      if (!p.bot) return;
      var right = Math.random() < p.skill;
      var at = 1200 + 1200 + Math.random() * dur * (right ? 0.55 : 0.8);
      var n = q.opts.filter(function (o) { return o.trim(); }).length;
      var o = right ? q.ok : (q.ok + 1 + Math.floor(Math.random() * (n - 1))) % n;
      botTimers.push(setTimeout(function () { if (G && G.phase === 'question' && G.qi === i) answer(id, i, o); }, at));
    });
    publish();
  }
  function reveal() {
    if (G.phase !== 'question') return;
    clearBots();
    var q = G.qs[G.qi], a = G.ans[G.qi] || {}, dur = G.t1 - G.t0;
    G.prevRank = rankMap();
    Object.keys(G.players).forEach(function (id) {
      var p = G.players[id], x = a[id]; p.gain = 0; p.last = x ? (x.o === q.ok ? 'ok' : 'bad') : 'none';
      if (x && x.o === q.ok) {
        var g = G.s.speed ? 500 + Math.round(500 * Math.max(0, 1 - x.t / dur)) : 1000;
        p.streak++; if (p.streak >= 3) g += 100 * Math.min(p.streak - 2, 3);
        p.best = Math.max(p.best, p.streak); p.ok++; p.times.push(x.t);
        p.gain = g; p.score += g;
      } else p.streak = 0;
    });
    G.phase = 'reveal';
    publish();
  }
  function next() {
    if (!G) return;
    if (G.phase === 'lobby') { if (Object.keys(G.players).length) startQuestion(0); return; }
    if (G.phase === 'question') { reveal(); return; }
    if (G.phase === 'reveal') {
      var last = G.qi >= G.qs.length - 1;
      if (last) { G.phase = 'board'; G.final = true; G.prevRank = G.prevRank || {}; publish(); return; }
      if ((G.qi + 1) % G.s.every === 0) { G.phase = 'board'; publish(); return; }
      startQuestion(G.qi + 1); return;
    }
    if (G.phase === 'board') { if (G.final) { G.phase = 'final'; publish(); } else startQuestion(G.qi + 1); return; }
  }
  function maybeAutoReveal() {
    if (!G || G.phase !== 'question') return;
    var n = Object.keys(G.players).length, a = Object.keys(G.ans[G.qi] || {}).length;
    if (Date.now() >= G.t1 || (n > 0 && a >= n && !G.s.change)) reveal();
  }
  function rankMap() { var m = {}; ranked().forEach(function (p, i) { m[p.id] = i + 1; }); return m; }
  function ranked(g) {
    g = g || G;
    return Object.keys(g.players).map(function (id) { return Object.assign({ id: id }, g.players[id]); })
      .sort(function (a, b) { return b.score - a.score || a.name.localeCompare(b.name); });
  }
  function nextLabel(g) {
    if (!g) return ['Запустить', ''];
    var n = Object.keys(g.players).length;
    switch (g.phase) {
      case 'lobby': return [n ? 'Начать игру' : 'Ждём гостей…', n + ' ' + plural(n, 'гость', 'гостя', 'гостей') + ' в игре'];
      case 'question': return ['Показать ответ', 'сейчас идёт таймер'];
      case 'reveal': return g.qi >= g.qs.length - 1 ? ['Таблица лидеров', 'последний вопрос'] : ((g.qi + 1) % g.s.every === 0 ? ['Таблица лидеров', 'после ' + (g.qi + 1) + '-го вопроса'] : ['Следующий вопрос', (g.qi + 2) + ' из ' + g.qs.length]);
      case 'board': return g.final ? ['Итоги и победители', 'финал'] : ['Следующий вопрос', (g.qi + 2) + ' из ' + g.qs.length];
      case 'final': return ['Игра завершена', 'можно вернуться в редактор'];
    }
    return ['Далее', ''];
  }

  /* ============ клиент (телефон гостя) ============ */
  function mkClient(local) {
    var pid;
    if (local) pid = 'me';
    else { try { pid = sessionStorage.getItem('pbq_pid'); if (!pid) { pid = 'p' + uid(); sessionStorage.setItem('pbq_pid', pid); } } catch (e) { pid = 'p' + uid(); } }
    return {
      pid: pid, picked: {},
      join: function (name) { if (local) join(pid, name); else send({ type: 'join', pid: pid, name: name }); },
      answer: function (qi, o) { this.picked[qi] = o; if (local) answer(pid, qi, o); else send({ type: 'answer', pid: pid, qi: qi, o: o }); }
    };
  }

  /* ============ отрисовка: экран проектора ============ */
  var scrSig = '', qrUrl = location.origin + location.pathname + '?view=play';
  function renderScreen(box, g) {
    if (!box) return;
    var n = g ? Object.keys(g.players).length : 0;
    var sig = !g ? 'none' : g.id + g.phase + g.qi + (g.phase === 'lobby' ? n : '') + (g.phase === 'final' ? 'f' : '');
    if (sig === scrSig && box.firstChild) { updScreen(box, g); return; }
    scrSig = sig;
    var h = '';
    if (!g) {
      h = '<div class="sv center"><div class="kk">Квиз о паре</div><h1>Экран проектора</h1><p class="muted" style="font-size:1.3em">Запустите игру на пульте ведущего</p></div>';
    } else if (g.phase === 'lobby') {
      var ps = ranked(g);
      h = '<div class="sv"><div class="kk">' + esc(g.couple) + '</div><h1>' + esc(g.title) + '</h1><div class="lob"><div>' +
        '<div class="how">Наведите камеру телефона на QR-код<br>и введите ' + (g.s.teams ? 'название команды' : 'своё имя') + '</div>' +
        '<div class="kk" style="margin-bottom:.6em">В игре · <b style="color:var(--ink)">' + n + '</b></div><div class="chips">' +
        ps.map(function (p) { return '<span>' + esc(p.name) + '</span>'; }).join('') + '</div></div>' +
        '<div class="qr" data-qr="1"></div></div></div>';
    } else if (g.phase === 'question' || g.phase === 'reveal') {
      var q = g.qs[g.qi], rev = g.phase === 'reveal';
      var a = g.ans[g.qi] || {}, cnt = [0, 0, 0, 0], tot = 0;
      Object.keys(a).forEach(function (k) { cnt[a[k].o]++; tot++; });
      var pic = q.img ? picHtml(q.img, 'qpic') : '';
      var tiles = '<div class="tiles' + (rev ? ' rev' : '') + '">' +
        q.opts.map(function (o, i) { if (!o.trim()) return ''; var pc = tot ? Math.round(cnt[i] / tot * 100) : 0;

      IMG.load(file).then(function (data) {
        var id; try { id = IMG.put(data); } catch (e) { gcImgs(); try { id = IMG.put(data); } catch (e2) { return paint('Не хватает места в браузере — уберите фото из других вопросов'); } }
        q.img = id; saveCfg(); paint();
      }, function () { paint('Не удалось открыть файл — нужна картинка JPG или PNG'); });
    }
    function wire() {
      [].forEach.call(box.querySelectorAll('[data-im]'), function (b) {
        b.onclick = function (e) { e.preventDefault(); if (b.dataset.im === 'del') { q.img = ''; saveCfg(); gcImgs(); paint(); } else { inp.value = ''; inp.click(); } };
      });
    }
    inp.onchange = function () { take(inp.files && inp.files[0]); };
    c.addEventListener('paste', function (e) { var it = [].slice.call((e.clipboardData || {}).items || []).filter(function (x) { return x.kind === 'file' && /^image\//.test(x.type); })[0]; if (it) { e.preventDefault(); take(it.getAsFile()); } });
    c.addEventListener('dragover', function (e) { if (e.dataTransfer && [].indexOf.call(e.dataTransfer.types || [], 'Files') >= 0) { e.preventDefault(); c.classList.add('drag'); } });
    c.addEventListener('dragleave', function (e) { if (!c.contains(e.relatedTarget)) c.classList.remove('drag'); });
    c.addEventListener('drop', function (e) { c.classList.remove('drag'); var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; if (f) { e.preventDefault(); take(f); } });
    c._take = take;
    wire();
  }
  function gcImgs() { var u = {}; CFG.qs.forEach(function (q) { if (q.img) u[q.img] = 1; }); if (G) G.qs.forEach(function (q) { if (q.img) u[q.img] = 1; }); IMG.gc(u); }
  function sum() {
    var n = CFG.qs.length, mins = Math.max(1, Math.round(n * (CFG.s.time + 12) / 60));
    $('bSum').textContent = (CFG.title || 'Квиз') + ' · ' + MODES[CFG.mode].t;
    $('bSub').textContent = n + ' ' + plural(n, 'вопрос', 'вопроса', 'вопросов') + ' · около ' + mins + ' мин' + (CFG.bots ? ' · с гостями-ботами' : '');
    if ($('qCount')) $('qCount').textContent = n + ' ' + plural(n, 'вопрос', 'вопроса', 'вопросов');
  }
  $('impCancel').onclick = function () { $('imp').classList.remove('on'); };
  $('imp').onclick = function (e) { if (e.target === this) this.classList.remove('on'); };
  $('impGo').onclick = function () {
    var blocks = $('impText').value.split(/\n\s*\n/), added = 0;
    blocks.forEach(function (b) {
      var lines = b.split('\n').map(function (x) { return x.trim(); }).filter(Boolean); if (lines.length < 3) return;
      var q = { id: uid(), text: lines[0].replace(/^\d+[.)]\s*/, ''), opts: ['', '', '', ''], ok: 0 }, k = 0;
      lines.slice(1, 5).forEach(function (l) { var ok = /^\+/.test(l); q.opts[k] = l.replace(/^[+\-–•*]\s*/, ''); if (ok) q.ok = k; k++; });
      CFG.qs.push(q); added++;
    });
    if (added) { saveCfg(); paintQs(); sum(); }
    $('impText').value = ''; $('imp').classList.remove('on');
  };

  /* ---------- пульт ---------- */
  function start() {
    var ok = CFG.qs.filter(function (q) { return (q.text.trim() || q.img) && q.opts.filter(function (o) { return o.trim(); }).length >= 2; });
    if (!ok.length) { alertBox('Добавьте хотя бы один вопрос с двумя вариантами'); return; }
    newGame(); window.scrollTo(0, 0);
  }
  function alertBox(t) { var b = $('bSub'); if (b) { b.textContent = t; b.style.color = 'var(--bad)'; setTimeout(function () { b.style.color = ''; sum(); }, 2500); } }
  var liveBuilt = false;
  function renderLive() {
    if (!liveBuilt) {
      liveBuilt = true; scrSig = '';
      $('app').innerHTML = '<div class="top"><div class="in"><a class="brand" href="../"><i>PB</i><b id="lTitle"></b><small>пульт ведущего</small></a><span class="sp"></span>' +
        '<button class="btn ghost sm dsk" id="bOpenScr" title="Открыть экран для проектора в новом окне">🖥 Экран</button><button class="btn ghost sm dsk" id="bOpenPh" title="Открыть телефон гостя в новой вкладке">📱 Гость</button><button class="btn ghost sm" id="bEdit">✎ Редактор</button></div></div>' +
        '<div class="tabs" id="tabs"><button data-t="ctl">Пульт</button><button data-t="scr">Экран</button><button data-t="ph">Я — гость</button></div>' +
        '<div class="live"><div class="ctl" data-p="ctl"><button class="btn gold next" id="bNext"></button><div class="kbd">Пробел или → — дальше</div>' +
        '<div class="stat"><div><b id="sP">0</b><span>гостей</span></div><div><b id="sA">–</b><span>ответили</span></div></div>' +
        '<div class="cur" id="cur"></div><div class="plist" id="plist"></div>' +
        '<div class="links"><button class="btn ghost sm" id="bSkip">⏭ Закончить таймер</button><button class="btn ghost sm" id="bRestart">↺ Заново</button></div></div>' +
        '<div class="pane" data-p="scr"><h4>Экран для проектора <button class="btn ghost sm" id="bOpenScr2">Открыть отдельно ↗</button></h4><div class="stage" id="stg"></div></div>' +
        '<div class="pane ph" data-p="ph"><h4>Телефон гостя · играйте сами <button class="btn ghost sm" id="bOpenPh2">↗</button></h4><div class="phwrap"><div class="phone"><div class="scr" id="ph"></div></div></div></div></div>' +
        '<div class="mnext"><button class="btn gold next" id="bNextM" style="display:block"></button></div>';
      var openS = function () { window.open('?view=screen', 'pbq_screen', 'width=1280,height=760'); };
      var openP = function () { window.open('?view=play', '_blank'); };
      $('bOpenScr').onclick = openS; $('bOpenScr2').onclick = openS; $('bOpenPh').onclick = openP; $('bOpenPh2').onclick = openP;
      $('bEdit').onclick = function () { clearBots(); G = null; liveBuilt = false; ls('del', KEY_LIVE); send({ type: 'reset' }); renderEditor(); window.scrollTo(0, 0); };
      $('bNext').onclick = next; $('bNextM').onclick = next;
      $('bSkip').onclick = function () { if (G && G.phase === 'question') { G.t1 = Date.now(); reveal(); } };
      $('bRestart').onclick = function () { clearBots(); newGame(); };
      [].forEach.call(document.querySelectorAll('#tabs button'), function (b) { b.onclick = function () { tab = b.dataset.t; paintTabs(); }; });
      paintTabs();
    }
    $('lTitle').textContent = G.title;
    var nl = nextLabel(G);
    [$('bNext'), $('bNextM')].forEach(function (b) { b.innerHTML = esc(nl[0]) + (nl[1] ? '<small>' + esc(nl[1]) + '</small>' : ''); b.disabled = G.phase === 'final' || (G.phase === 'lobby' && !Object.keys(G.players).length); });
    $('bSkip').style.display = G.phase === 'question' ? '' : 'none';
    var n = Object.keys(G.players).length, a = G.qi >= 0 ? Object.keys(G.ans[G.qi] || {}).length : 0;
    $('sP').textContent = n; $('sA').textContent = G.phase === 'question' || G.phase === 'reveal' ? a + '/' + n : '–';
    var q = G.qi >= 0 ? G.qs[G.qi] : null;
    $('cur').innerHTML = G.phase === 'lobby' ? '<div class="k">Лобби</div><div class="q">Гости сканируют QR на экране. ' + (G.qs.length) + ' ' + plural(G.qs.length, 'вопрос', 'вопроса', 'вопросов') + ' готово.</div><div class="muted" style="font-size:13px">Нажмите «Начать игру», когда все войдут.</div>' :
      G.phase === 'final' ? '<div class="k">Финал</div><div class="q">Победители на экране. Спасибо за игру!</div>' :
      '<div class="k">Вопрос ' + (G.qi + 1) + ' из ' + G.qs.length + (G.phase === 'board' ? ' · таблица' : '') + '</div><div class="q">' + esc(q.text) + '</div><div class="a">✓ ' + L[q.ok] + ' — ' + esc(q.opts[q.ok]) + '</div>';
    var ans = G.qi >= 0 ? (G.ans[G.qi] || {}) : {};
    $('plist').innerHTML = ranked().map(function (p, i) { return '<div class="p"><span class="muted" style="width:20px">' + (i + 1) + '</span><span class="dot' + (ans[p.id] && G.phase === 'question' ? ' on' : '') + '"></span><b>' + esc(p.name) + (p.id === 'me' ? ' (вы)' : '') + '</b><span>' + p.score + '</span></div>'; }).join('') || '<div class="p muted">Пока никого</div>';
    renderScreen($('stg'), G);
    renderPhone($('ph'), G, me);
  }
  function paintTabs() {
    [].forEach.call(document.querySelectorAll('#tabs button'), function (b) { b.classList.toggle('on', b.dataset.t === tab); });
    [].forEach.call(document.querySelectorAll('.live>[data-p]'), function (p) { p.classList.toggle('on', p.dataset.p === tab); });
    scrSig = ''; if (G) { renderScreen($('stg'), G); }
  }
  document.addEventListener('keydown', function (e) {
    if (!G || /INPUT|TEXTAREA/.test((e.target || {}).tagName || '')) return;
    if (e.key === ' ' || e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); next(); }
  });
  setInterval(function () {
    if (!G) return;
    maybeAutoReveal();
    updScreen($('stg'), G); updPhone($('ph'), G, me);
  }, 200);
  window.addEventListener('beforeunload', function () { send({ type: 'reset' }); });
  window.__quiz = { get g() { return G; }, next: next, cfg: function () { return CFG; } };
  render();
})();
</script>
</body>
</html>
