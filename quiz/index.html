<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Квиз о паре · Белоглазов</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#131312">
<link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/brand.css">
<script src="../assets/brand.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-database-compat.js"></script>
<style>
:root{--bg:#131312;--bg2:#181817;--card:#1c1c1b;--card2:#262625;--line:rgba(255,255,255,.1);--ink:#ffffff;--text:#e8e8e6;--muted:#a3a3a3;
  --gold:#f2efe9;--gold2:#e4e1db;--g1:#fff;--g2:#d9d6d0;--gdark:#f2efe9;--gink:#131312;--gsoft:rgba(242,239,233,.14);
  --a:#e07a5f;--b:#3d9a8b;--c:#d9a441;--d:#7b6fd6;--ok:#4caf7d;--bad:#d9665b;--cream:#131312;--cink:#ffffff;--cmuted:#a3a3a3;
  --hf:Archivo,Manrope,system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit}
a{color:var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:13px 20px;font-weight:700;font-size:15px;text-decoration:none;transition:transform .12s,background .2s,opacity .2s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.gold{background:var(--gold);color:var(--gink)}
.btn.gold:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid rgba(255,255,255,.28)}
.btn.ghost:hover{background:rgba(255,255,255,.1)}
.btn.sm{padding:8px 14px;font-size:13px;border-radius:999px}
.btn.danger{background:rgba(217,102,91,.16);color:#f0a79f;border:1px solid rgba(217,102,91,.3)}
.btn[disabled]{opacity:.4;pointer-events:none}
.k{color:var(--gold2);letter-spacing:.22em;text-transform:uppercase;font-weight:700;font-size:11px}
.muted{color:var(--muted)}
.top{position:sticky;top:0;z-index:20;background:rgba(19,19,18,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .in{max-width:1400px;margin:0 auto;padding:0 20px;height:60px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;min-width:0}
.brand i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--g1),var(--gdark));display:grid;place-items:center;font-style:normal;color:#14151d;font-weight:800;font-size:14px;flex:none}
.brand b{font-family:var(--hf);font-stretch:125%;font-size:21px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{color:var(--muted);font-size:12px;white-space:nowrap}
.sp{flex:1}
.tag{border:1px solid var(--gsoft);color:var(--gold);border-radius:999px;padding:4px 10px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.tag.pro{background:var(--gsoft)}
.acc{display:flex;align-items:center;gap:8px;min-width:0}
.acc .em{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:#2a2a28;color:var(--ink);border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;transition:all .25s;z-index:90;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}

.top .pb-lock{color:var(--ink)}
.stage .pb-lock{position:absolute;right:3.2cqw;bottom:2.6cqw;opacity:.55;transform:scale(1.1);transform-origin:right bottom}
.stage .pb-word{height:1.1cqw}
.stage .pb-mark{width:2.2cqw;height:2.2cqw}
.pv .pbrand{display:flex;justify-content:center;margin:0 0 14px;opacity:.9}
.lt .pbrand{margin-bottom:18px}
body.solo-screen.idle,body.solo-screen.idle *{cursor:none}
/* ---------- редактор ---------- */
.ed{max-width:880px;margin:0 auto;padding:28px 20px 120px}
.ed h1{font-family:var(--hf);font-stretch:125%;font-weight:500;text-transform:uppercase;letter-spacing:-.01em;font-size:clamp(30px,5.4vw,50px);line-height:1.02;margin:8px 0 6px;color:var(--ink)}
.ed .lead{color:var(--muted);margin:0 0 20px}
.notice{border:1px solid var(--gsoft);background:var(--gsoft);border-radius:16px;padding:12px 14px;font-size:14px;margin-bottom:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.notice b{color:var(--ink)}
.notice .sp{display:none}
.notice>span:nth-child(2){flex:1 1 260px}
.notice>span:first-child{font-size:20px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;margin-bottom:16px}
.panel h3{margin:0 0 12px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.panel .sub{font-size:13px;color:var(--muted);margin:-6px 0 12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:6px}
.inp{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--ink);font-size:16px;outline:none;transition:border-color .2s}
.inp:focus{border-color:var(--gold2)}
textarea.inp{resize:vertical;min-height:52px;line-height:1.4}
select.inp{appearance:none;-webkit-appearance:none}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mode{background:var(--bg2);border:1.5px solid var(--line);border-radius:16px;padding:14px;text-align:left;color:var(--text);transition:border-color .2s,background .2s}
.mode b{display:block;color:var(--ink);font-size:15px;margin:4px 0 2px}
.mode span{font-size:12px;color:var(--muted);line-height:1.35;display:block}
.mode i{font-style:normal;font-size:22px}
.mode.on{border-color:var(--gold);background:#232322}
.lbl{font-size:12px;color:var(--muted);font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin:16px 0 8px}
.tune{margin-top:16px;border:1.5px solid var(--gsoft);background:var(--gsoft);border-radius:16px;padding:0 14px}
.tune summary{cursor:pointer;color:var(--ink);font-weight:800;font-size:15px;list-style:none;display:flex;align-items:center;gap:12px;padding:14px 0}
.tune summary::-webkit-details-marker{display:none}
.tune summary span:first-child{width:34px;height:34px;border-radius:10px;background:var(--gold);display:grid;place-items:center;font-size:17px;flex:none}
.tune summary small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.tune summary .chev{margin-left:auto;color:var(--gold);font-size:18px;transition:transform .2s}
.tune[open] summary .chev{transform:rotate(180deg)}
.tune[open]{padding-bottom:14px}
.tune .tgrid{margin-top:4px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px;margin-top:14px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;padding:6px 0}
.sw input{width:44px;height:26px;appearance:none;-webkit-appearance:none;background:rgba(255,255,255,.2);border-radius:99px;position:relative;cursor:pointer;flex:none;transition:background .2s}
.sw input:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.sw input:checked{background:var(--gold)}.sw input:checked:after{transform:translateX(18px);background:var(--gink)}
.sw input:not(:checked):after{background:#8f8f8c}
.rng{display:flex;align-items:center;gap:10px;font-size:14px}
.rng input{flex:1;accent-color:var(--gold2)}
.rng b{min-width:44px;text-align:right;color:var(--ink)}
.swatches{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.swatches button{width:38px;height:38px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
.swatches button.on{border-color:#fff}
.swatches label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer;margin-left:4px}
.swatches input[type=color]{width:38px;height:38px;border:0;padding:0;background:none;border-radius:50%;cursor:pointer}
.photoSlot{display:flex;gap:14px;align-items:center}
.photoSlot .ph{width:84px;height:84px;border-radius:50%;background:var(--bg) center/cover no-repeat;border:1.5px dashed var(--line);flex:none;display:grid;place-items:center;font-size:26px;color:var(--muted)}
.photoSlot .ph{cursor:pointer;transition:border-color .15s,transform .15s}
.photoSlot .ph:hover{border-color:rgba(255,255,255,.5);transform:scale(1.03)}
.qhead{display:flex;align-items:center;gap:10px;margin:26px 0 12px;flex-wrap:wrap}
.qhead h2{font-family:var(--hf);font-stretch:125%;font-size:22px;margin:0;color:var(--ink);font-weight:500;text-transform:uppercase}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px;animation:fadeIn .3s ease}
.qcard.warn{border-color:rgba(217,164,65,.5)}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}}
.qtop{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.qnum{font-weight:800;font-size:15px;color:var(--gold);min-width:26px}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;color:var(--muted);font-size:12px;font-weight:800;padding:6px 10px;border-radius:8px;white-space:nowrap}
.seg button.on{background:var(--card2);color:var(--ink)}
.x2b{border:1px solid var(--line);background:none;color:var(--muted);font-size:12px;font-weight:800;padding:6px 10px;border-radius:10px}
.x2b.on{background:var(--gsoft);color:var(--gold);border-color:var(--gsoft)}
.grip{flex:none;width:28px;height:34px;display:grid;place-items:center;color:var(--muted);cursor:grab;touch-action:none;border-radius:8px;-webkit-user-select:none;user-select:none;transition:color .15s,background .15s}
.grip:hover{color:var(--ink);background:rgba(255,255,255,.07)}
.grip:active{cursor:grabbing}
.opt .grip{width:22px;margin-left:2px}
.dragging{box-shadow:0 22px 50px rgba(0,0,0,.55);opacity:.97;cursor:grabbing}
.dragging .grip{color:var(--ink)}
.sort-ph{border:1.5px dashed rgba(255,255,255,.28);border-radius:12px;background:rgba(255,255,255,.03);box-sizing:border-box}
.sort-ph.ph-qcard{border-radius:20px;margin-bottom:12px}
body.sorting,body.sorting *{-webkit-user-select:none;user-select:none;cursor:grabbing!important}
.tip{position:relative;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1px solid rgba(255,255,255,.28);color:var(--muted);font-style:normal;vertical-align:middle;cursor:help;flex:none;outline:none;text-transform:none;letter-spacing:0;font-weight:700;transition:color .15s,border-color .15s}
.tip i{font-style:normal;font-family:Georgia,serif;font-size:12px;line-height:1}
.qtools .tip{width:34px;height:34px;border-radius:10px;border-color:var(--line)}
.tip:hover,.tip.on,.tip:focus-visible{color:var(--ink);border-color:rgba(255,255,255,.55)}
.tipb{position:fixed;top:0;left:0;width:280px;background:#262625;color:#e8e8e6;border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.45;font-weight:500;text-align:left;box-shadow:0 18px 40px rgba(0,0,0,.5);display:none;z-index:80;pointer-events:none;white-space:normal;text-transform:none;letter-spacing:0;animation:tipIn .15s ease}
@keyframes tipIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@media (hover:hover){.tip:hover .tipb{display:block}}
.tip.on .tipb,.tip:focus-visible .tipb{display:block}
.tipline{display:flex;align-items:center;gap:8px;margin-top:12px}
.lk{display:inline-flex;align-items:center;gap:4px;margin-left:8px;padding:2px 8px 2px 6px;border-radius:99px;border:1px solid rgba(255,255,255,.22);font-style:normal;font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);vertical-align:middle;white-space:nowrap}
.lk svg{width:11px;height:11px}
.lk.sm{padding:0;border:0;margin-left:5px}
.mode.locked{opacity:.62}
.mode.locked:hover{opacity:.85}
.ups{text-align:center;padding:6px 4px 2px}
.ups .upi{width:52px;height:52px;border-radius:16px;margin:0 auto 12px;display:grid;place-items:center;background:var(--gsoft);color:var(--ink)}
.ups h3{margin:0 0 8px;font-size:20px;line-height:1.25}
.ups p{margin:0 0 10px;line-height:1.5}
.ups .small{font-size:12.5px}
.ups .links{justify-content:center;margin-top:14px}
.qtools{margin-left:auto;display:flex;gap:4px}
.ic{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--muted);display:grid;place-items:center;font-size:15px}
.ic:hover{color:var(--ink);background:rgba(255,255,255,.06)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.opt{display:flex;align-items:center;gap:8px;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:4px;transition:border-color .2s;min-width:0}
.opt.ok{border-color:var(--ok)}
.opt .ch{width:36px;height:36px;border-radius:9px;border:0;color:#fff;font-weight:800;flex:none;position:relative}
.opt.ok .ch:after{content:"✓";position:absolute;right:-5px;top:-6px;width:18px;height:18px;border-radius:50%;background:var(--ok);font-size:11px;line-height:18px;border:2px solid var(--bg)}
.opt input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--ink);font-size:15px;padding:8px 4px}
.numrow{display:grid;grid-template-columns:1fr 140px;gap:8px;margin-top:10px}
.hint{font-size:12px;color:var(--muted);margin-top:8px}
.hint.w{color:var(--c)}
.qimg{margin:10px 0}
.qimg .add{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px dashed var(--line);background:none;color:var(--muted);border-radius:12px;padding:11px;font-weight:700;font-size:14px;cursor:pointer;transition:border-color .2s,color .2s}
.qimg .add:hover,.qcard.drag .qimg .add{border-color:var(--gold);color:var(--gold)}
.qimg .add small{font-weight:600;opacity:.7}
.qimg .has{position:relative;border-radius:14px;overflow:hidden;background:#0b0c11;height:180px}
.qimg .has img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.bgb{position:absolute;inset:-20px;background-size:cover;background-position:center;filter:blur(18px) brightness(.55)}
.qimg .has .has-in{position:absolute;inset:0}
.qimg .has .acts{position:absolute;right:8px;bottom:8px;display:flex;gap:6px}
.qimg .has .acts button{border:0;border-radius:10px;padding:7px 11px;font-weight:800;font-size:13px;background:rgba(20,21,29,.78);color:#fff;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:pointer}
.qimg .busy{height:110px;border-radius:14px;display:grid;place-items:center;color:var(--muted);font-weight:700;border:1.5px dashed var(--line)}
.err{color:var(--bad);font-size:12px;font-weight:700;margin-top:6px}
.qcard.drag{border-color:var(--gold)}
.addrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.addrow .btn{border-style:dashed;padding:14px 10px;white-space:normal;text-align:center;line-height:1.25}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:rgba(19,19,18,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom))}
.bar .in{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar .btn.gold{flex:none;padding:14px 26px;font-size:16px}
.modal{position:fixed;inset:0;background:rgba(10,10,14,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.modal .box{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;width:100%;max-width:560px;max-height:92vh;overflow:auto}
.modal h3{font-family:var(--hf);font-stretch:125%;font-size:22px;text-transform:uppercase;margin:0 0 6px;color:var(--ink);font-weight:600}
.crp{display:flex;justify-content:center;background:#0b0b0a;border-radius:14px;padding:10px;user-select:none;-webkit-user-select:none}
.cst{position:relative;display:inline-block;line-height:0;overflow:hidden;border-radius:6px;touch-action:none}
.cst img{display:block;max-width:100%;max-height:min(58vh,520px);pointer-events:none}
.cbox{position:absolute;box-shadow:0 0 0 2000px rgba(0,0,0,.6);outline:2px solid #fff;cursor:move;touch-action:none}
.cbox.round{border-radius:50%;outline:none;box-shadow:0 0 0 2px #fff,0 0 0 2000px rgba(0,0,0,.6)}
.cbox .g{position:absolute;inset:0;pointer-events:none;border:0;border-radius:0;box-shadow:none;background:linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,.28)) 33.33% 0/1px 100% no-repeat,linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,.28)) 66.66% 0/1px 100% no-repeat,linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,.28)) 0 33.33%/100% 1px no-repeat,linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,.28)) 0 66.66%/100% 1px no-repeat}
.cbox.round .g{border-radius:50%!important}
.cbox i{position:absolute;width:22px;height:22px;border:3px solid #fff;touch-action:none}
.cbox i[data-h=nw]{left:-4px;top:-4px;border-right:0;border-bottom:0;cursor:nwse-resize}
.cbox i[data-h=ne]{right:-4px;top:-4px;border-left:0;border-bottom:0;cursor:nesw-resize}
.cbox i[data-h=sw]{left:-4px;bottom:-4px;border-right:0;border-top:0;cursor:nesw-resize}
.cbox i[data-h=se]{right:-4px;bottom:-4px;border-left:0;border-top:0;cursor:nwse-resize}
.cbox i:after{content:"";position:absolute;inset:-12px}
.car{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.car button{border:1px solid var(--line);background:none;color:var(--muted);border-radius:99px;padding:6px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.car button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cbt{display:flex;gap:8px;margin-top:14px}.cbt .btn{flex:1}
.modal pre{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:12px;color:var(--muted);margin:8px 0 12px;white-space:pre-wrap}
.qrbox{background:#fff;border-radius:16px;padding:12px;width:210px;height:210px;margin:12px auto;display:grid;place-items:center}
.qrbox img,.qrbox canvas{width:100%!important;height:100%!important}
.linkrow{display:flex;gap:8px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 12px;margin:8px 0}
.linkrow code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;color:var(--text)}
.qlist{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.qlist button{display:flex;align-items:center;gap:10px;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--text)}
.qlist button.on{border-color:var(--gold2)}
.qlist button b{color:var(--ink);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qlist button span{font-size:12px;color:var(--muted);white-space:nowrap}

/* ---------- пульт ---------- */
.live{max-width:1400px;margin:0 auto;padding:18px 20px 24px;display:grid;grid-template-columns:330px minmax(0,1fr) 340px;gap:18px;align-items:start}
.ctl{position:sticky;top:78px;display:flex;flex-direction:column;gap:12px}
.next{width:100%;padding:16px 18px;font-size:18px;border-radius:18px;white-space:normal;line-height:1.2;flex-direction:column;gap:2px}
.next small{display:block;font-size:11px;opacity:.65;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.qlist button .ic{width:30px;height:30px;flex:none}
.stat{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-family:var(--hf);font-stretch:125%;font-size:28px;color:var(--gold);line-height:1;font-weight:500}
.stat span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.netline{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-weight:700;flex-wrap:wrap}
.netline i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.netline i.slow{background:var(--c)}.netline i.off{background:var(--bad)}
.netline .codeb{margin-left:auto;color:var(--ink);letter-spacing:.08em}
.cur{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.cur .q{color:var(--ink);font-weight:700;margin:4px 0 8px;line-height:1.35}
.cur .a{font-size:13px;color:var(--ok);font-weight:700}
.cur .cpl{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.cur .cpl button{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:6px 10px;font-size:12px;font-weight:700}
.cur .cpl button.on{border-color:var(--ok);color:var(--ok)}
.demo{background:rgba(217,164,65,.12);border:1px solid rgba(217,164,65,.35);color:#f0cf8f;border-radius:14px;padding:10px 12px;font-size:13px;font-weight:600}
.demo a{color:#fff}
.plist{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:8px 14px;max-height:340px;overflow:auto}
.plist .p{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.plist .p:last-child{border:0}
.plist .p b{flex:1;color:var(--ink);font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist .p small{color:var(--muted);font-size:11px}
.plist .dot{width:8px;height:8px;border-radius:50%;background:#3a3c4c;flex:none}
.plist .dot.on{background:var(--ok)}
.plist .dot.off{background:var(--bad)}
.plist .kick{border:0;background:none;color:var(--muted);width:24px;height:24px;border-radius:6px;font-size:13px;flex:none}
.plist .kick:hover{background:rgba(217,102,91,.2);color:var(--bad)}
.plist .kick.sure{background:var(--bad);color:#fff;width:auto;padding:0 8px;font-size:11px;font-weight:800}
.links{display:flex;gap:8px;flex-wrap:wrap}
.pane h4{margin:0 0 8px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.pane h4 .btn{margin-left:auto}
.phwrap{display:flex;justify-content:center}
.phone{width:100%;max-width:340px;aspect-ratio:9/18.5;border-radius:40px;background:#0f1016;border:1px solid rgba(255,255,255,.12);padding:12px;box-shadow:0 30px 70px rgba(0,0,0,.45)}
.phone .scr{background:var(--cream);border-radius:30px;height:100%;overflow:auto;position:relative}
.tabs{display:none}
.kbd{font-size:12px;color:var(--muted);text-align:center}

/* ---------- экран проектора ---------- */
.stage{container-type:inline-size;aspect-ratio:16/9;width:100%;position:relative;overflow:hidden;border-radius:18px;background:radial-gradient(ellipse at 50% 18%,#262625,#0b0b0a 72%);color:var(--ink);box-shadow:0 30px 70px rgba(0,0,0,.4);border:1px solid var(--line)}
.stage.full{border-radius:0;border:0;box-shadow:none}
.stage .glow{position:absolute;inset:0;background:radial-gradient(ellipse at 15% 0%,var(--gsoft),transparent 55%);pointer-events:none}
.sv{position:absolute;inset:0;padding:4.5cqw 5cqw;display:flex;flex-direction:column;font-size:1.6cqw;animation:svIn .45s ease}
@keyframes svIn{from{opacity:0;transform:scale(.985)}}
.sv .kk{color:var(--gold2);letter-spacing:.24em;text-transform:uppercase;font-weight:700;font-size:.85em}
.sv h1{font-family:var(--hf);font-stretch:125%;font-weight:500;text-transform:uppercase;letter-spacing:-.01em;font-size:3.6em;line-height:1.02;margin:.15em 0 .2em}
.lob{display:grid;grid-template-columns:1fr auto;gap:4cqw;align-items:center;flex:1;min-height:0}
.lob .left{min-width:0}
.lob .ttl{display:flex;align-items:center;gap:1.1em}
.lob .cph{width:7.5em;height:7.5em;border-radius:50%;background:center/cover no-repeat;flex:none;box-shadow:0 0 0 .25em var(--gsoft),0 1em 2em rgba(0,0,0,.4)}
.lob .right{display:flex;flex-direction:column;align-items:center;gap:.9em}
.lob .qr{background:#fff;border-radius:1.3em;padding:1em;width:15em;height:15em;display:grid;place-items:center}
.lob .qr img,.lob .qr canvas{width:100%!important;height:100%!important}
.lob h1.cpl{font-size:4.6em;line-height:1;margin:.12em 0 0;overflow-wrap:anywhere}
.lob .ttl .kk{font-size:1em}
.lob .join{cursor:pointer;transition:transform .2s,border-color .2s}
.lob .join:hover{transform:scale(1.02);border-color:rgba(255,255,255,.3)}
.qrzoom{position:absolute;inset:0;z-index:30;display:grid;place-items:center;background:rgba(8,8,8,.5);-webkit-backdrop-filter:blur(1.2em);backdrop-filter:blur(1.2em);cursor:pointer;animation:qzBg .25s ease both}
.qrzoom.out{animation:qzOut .2s ease both}
.qrzoom .qz{display:flex;flex-direction:column;align-items:center;gap:.7em;animation:qzIn .35s cubic-bezier(.2,1.2,.4,1) both}
.qrzoom .qr{background:#fff;border-radius:1.8em;padding:1.4em;width:22em;height:22em;display:grid;place-items:center;box-shadow:0 2em 5em rgba(0,0,0,.55)}
.qrzoom .qr img,.qrzoom .qr canvas{width:100%!important;height:100%!important}
.qrzoom .jurl{font-size:1.5em;font-weight:700;color:var(--muted);margin-top:.4em}
.qrzoom .jcode{display:flex;align-items:baseline;gap:.5em;line-height:1}
.qrzoom .jcode span{font-size:1.1em;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:800}
.qrzoom .jcode b{font-size:3.6em;font-weight:800;letter-spacing:.08em;color:#fff}
@keyframes qzBg{from{opacity:0}}
@keyframes qzOut{to{opacity:0}}
@keyframes qzIn{from{opacity:0;transform:scale(.85)}}
.lob .lcount{margin:1.6em 0 .7em}
.lob .join{display:flex;flex-direction:column;align-items:center;gap:.55em;padding:1.1em 1.1em 1em;border:1px solid rgba(255,255,255,.12);border-radius:1.8em;background:rgba(255,255,255,.035)}
.lob .jurl{font-size:.95em;font-weight:700;color:var(--muted);letter-spacing:.01em;margin-top:.2em}
.lob .jcode{display:flex;align-items:baseline;gap:.45em;line-height:1}
.lob .jcode span{font-size:.8em;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:800}
.lob .jcode b{font-size:2.6em;font-weight:800;letter-spacing:.08em;color:var(--ink)}
.lob .wifi{display:flex;align-items:center;gap:.7em;font-size:.8em;color:var(--muted);font-weight:700;max-width:15em}
.lob .wifi .wq{background:#fff;border-radius:.5em;padding:.3em;width:4.4em;height:4.4em;flex:none}
.lob .wifi .wq img,.lob .wifi .wq canvas{width:100%!important;height:100%!important}
.lob .wifi b{color:var(--ink);display:block}
.chips{display:flex;flex-wrap:wrap;gap:.5em;max-height:10em;overflow:hidden}
.chips span{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:99em;padding:.35em .9em;font-weight:700;font-size:1em;animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
.chips span small{color:var(--muted);font-weight:700;margin-left:.3em}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
.intro{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.intro .n{letter-spacing:.3em;text-transform:uppercase;color:var(--gold2);font-weight:800;font-size:1.1em;animation:fadeIn .6s ease}
.intro .nm{font-family:var(--hf);font-stretch:125%;font-weight:600;text-transform:uppercase;font-size:6em;line-height:1;margin:.15em 0;max-width:90%;animation:introIn 1s cubic-bezier(.2,.9,.2,1) both;text-shadow:0 .1em .6em rgba(0,0,0,.5)}
@keyframes introIn{0%{opacity:0;transform:scale(1.4);filter:blur(.3em)}100%{opacity:1;transform:none;filter:none}}
.intro .mem{display:flex;flex-wrap:wrap;gap:.5em;justify-content:center;max-width:80%;margin-top:.8em;animation:fadeIn 1s .5s both}
.intro .mem span{background:rgba(255,255,255,.08);border-radius:99em;padding:.3em .9em;font-weight:700}
.intro .dots{display:flex;gap:.4em;margin-top:2em}
.intro .dots i{width:.6em;height:.6em;border-radius:50%;background:rgba(255,255,255,.18)}
.intro .dots i.on{background:var(--gold)}
.intro .burst{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 50%,var(--gsoft),transparent 45%);animation:burst 1.4s ease-out both}
@keyframes burst{from{opacity:0;transform:scale(.4)}40%{opacity:1}to{opacity:.6;transform:scale(1.1)}}
.qtop2{display:flex;align-items:center;gap:1em}
.qtop2 .n{font-weight:800;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;font-size:.9em}
.x2{background:var(--gold);color:var(--gink);border-radius:.5em;padding:.2em .6em;font-weight:800;font-size:.9em;letter-spacing:.05em}
.ctype{color:var(--gold);font-weight:800;font-size:.9em;letter-spacing:.06em}
.ring{margin-left:auto;width:5.2em;height:5.2em;position:relative;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:3.2}
.ring .bg{stroke:rgba(255,255,255,.1)}
.ring .fg{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset .25s linear,stroke .3s}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:1.8em;font-weight:800}
.qtext{font-family:var(--hf);font-stretch:125%;font-weight:500;font-size:2.9em;line-height:1.12;margin:.4em 0 .5em;flex:1;display:flex;align-items:center}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:1em}
.tile{border-radius:1em;padding:1em 1.2em;display:flex;align-items:center;gap:.8em;font-size:1.55em;font-weight:700;color:#fff;position:relative;overflow:hidden;transition:opacity .4s,transform .4s,filter .4s}
.tile .l{width:1.8em;height:1.8em;border-radius:.45em;background:rgba(255,255,255,.22);display:grid;place-items:center;font-weight:800;flex:none;font-size:.9em;position:relative;z-index:1}
.tile .t{flex:1;position:relative;z-index:1}
.tile .cnt{position:relative;z-index:1;font-weight:800;opacity:0;transition:opacity .4s}
.tile .fill{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.18);width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.tiles.rev .tile{opacity:.35;filter:saturate(.4)}
.tiles.rev .tile.ok{opacity:1;filter:none;transform:scale(1.02);box-shadow:0 0 0 .18em #fff,0 1em 2em rgba(0,0,0,.35)}
.tiles.rev .tile .cnt{opacity:1}
.tiles.pic{grid-template-columns:repeat(4,1fr);flex:1;min-height:0}
.tiles.pic .tile{flex-direction:column;align-items:stretch;padding:.4em;gap:.4em;font-size:1.2em}
.tiles.pic .tile .im{flex:1;min-height:6em;border-radius:.6em;background:#0b0c11 center/cover no-repeat;position:relative;z-index:1}
.tiles.pic .tile .row{display:flex;align-items:center;gap:.5em;position:relative;z-index:1;min-height:1.8em}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:1em;color:var(--muted);font-weight:700;font-size:1em;gap:1em}
.qbody{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:2.2em;margin-top:.8em}
.qbody .qleft{display:flex;flex-direction:column;min-height:0}
.qbody .qtext{font-size:2.1em;margin:0 0 .5em;line-height:1.1}
.qbody .tiles{grid-template-columns:1fr;gap:.6em}
.qbody .tile{font-size:1.2em;padding:.55em .9em}
.qbody .tile .t{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.qpic{position:relative;border-radius:1.2em;overflow:hidden;background:#07080c;box-shadow:0 1.2em 3em rgba(0,0,0,.45);min-height:0;animation:picIn .6s cubic-bezier(.2,.8,.2,1)}
.qpic .bgb{inset:-2em;filter:blur(2em) brightness(.5)}
.qpic img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
@keyframes picIn{from{opacity:0;transform:scale(.96)}}
.sv.wimg .ring{width:4.2em;height:4.2em}
.cst{display:flex;gap:.8em;margin:.2em 0 .6em}
.cst span{border:1px solid rgba(255,255,255,.14);border-radius:99em;padding:.3em .9em;font-weight:700;font-size:.95em;color:var(--muted)}
.cst span.on{border-color:var(--ok);color:var(--ok)}
.cres{display:block;margin:.2em 0 .7em;font-size:1.15em;font-weight:700;line-height:1.6}
.cres b{color:var(--gold)}
.cres .m{background:var(--ok);color:#fff;border-radius:.4em;padding:.15em .6em;font-size:.85em;margin-left:.6em;white-space:nowrap}
.cres .m.diff{background:var(--c)}
.numq{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3em;text-align:center}
.numq .ph{font-size:1.5em;color:var(--muted);font-weight:700}
.numq .big{font-family:var(--hf);font-stretch:125%;font-size:6em;line-height:.95;color:var(--gold);font-weight:600;animation:introIn .9s cubic-bezier(.2,.9,.2,1) both}
.numq .unit{font-size:1.4em;color:var(--text);font-weight:700}
.close3{display:flex;gap:1em;margin-top:.6em}
.close3 div{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:1em;padding:.45em 1em;min-width:9em;font-size:.9em}
.close3 small{display:block;color:var(--muted);font-weight:700;font-size:.75em;letter-spacing:.1em;text-transform:uppercase}
.close3 b{display:block;font-size:1.3em}
.close3 em{font-style:normal;color:var(--gold);font-weight:800}
.board{flex:1;display:grid;grid-template-rows:repeat(4,auto);grid-auto-flow:column;grid-auto-columns:1fr;column-gap:1.2em;row-gap:.6em;align-content:start;margin-top:.6em}
.board2{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:2em;margin-top:.4em;min-height:0}
.board2 h5{margin:0 0 .5em;font-size:.85em;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.board2 .col{display:flex;flex-direction:column;gap:.5em}
.brow{display:grid;grid-template-columns:2.2em 1fr auto;align-items:center;gap:.8em;background:rgba(255,255,255,.05);border-radius:.8em;padding:.5em .9em;font-size:1.3em;animation:rowIn .5s ease both}
@keyframes rowIn{from{opacity:0;transform:translateX(-1em)}}
.brow .pl{font-family:var(--hf);font-stretch:125%;font-size:1.4em;color:var(--gold);text-align:center}
.brow .nm{font-weight:700;display:flex;align-items:center;gap:.5em;min-width:0}
.brow .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .nm small{color:var(--muted);font-size:.7em;font-weight:700}
.brow .up{color:var(--ok);font-size:.7em;font-weight:800}
.brow .dn{color:var(--bad);font-size:.7em;font-weight:800}
.brow .sc{font-weight:800}
.brow .gain{color:var(--gold);font-size:.7em;margin-right:.6em;font-weight:800}
.pod{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:1.2em;align-items:end;padding:0 8em}
.pod>div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;opacity:0;transform:translateY(1em);transition:all .7s}
.pod>div.in{opacity:1;transform:none}
.pod .nm{font-family:var(--hf);font-stretch:125%;font-size:2em;font-weight:600;text-align:center;line-height:1.05}
.pod .ps{color:var(--muted);font-size:1em;margin:.2em 0 .5em;font-weight:700}
.pod .b{width:100%;height:0;border-radius:.8em .8em 0 0;background:linear-gradient(var(--g1),var(--g2));color:var(--gink);font-weight:800;font-size:2.4em;display:flex;justify-content:center;padding-top:.2em;transition:height 1.1s cubic-bezier(.2,.8,.2,1)}
.noms{display:flex;gap:1em;justify-content:center;margin-top:1.2em;flex-wrap:wrap}
.noms div{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:1em;padding:.7em 1.1em;text-align:center;opacity:0;transition:opacity .6s}
.noms div.in{opacity:1}
.noms i{font-style:normal;font-size:1.6em}
.noms span{display:block;font-size:.75em;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;font-weight:800;margin:.2em 0}
.noms b{font-size:1.15em}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.sndov{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(0,0,0,.55);cursor:pointer}
.sndov div{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 22px;color:var(--ink);font-weight:800;text-align:center}
.sndov small{display:block;color:var(--muted);font-weight:600;margin-top:4px}

/* ---------- телефон гостя ---------- */
.pv{min-height:100%;padding:22px 16px 20px;color:var(--cink);display:flex;flex-direction:column;font-size:15px;animation:svIn .35s ease;position:relative}
.pv .kk{color:var(--gdark);letter-spacing:.2em;text-transform:uppercase;font-weight:800;font-size:10px;text-align:center}
.pv h2{font-family:var(--hf);font-stretch:125%;font-weight:500;font-size:24px;line-height:1.05;margin:6px 0 4px;text-align:center}
.pv .sub{color:var(--cmuted);text-align:center;font-size:14px;margin:0 0 16px}
.pv .pin{width:100%;border:1.5px solid rgba(255,255,255,.16);background:#1c1c1b;border-radius:14px;padding:14px;font-size:17px;color:var(--cink);outline:none;margin-bottom:10px}
.pv .pin:focus{border-color:var(--gdark)}
.pv .pin.code{text-align:center;font-size:30px;font-weight:800;letter-spacing:.25em}
.pv .pbtn{width:100%;text-align:center;display:block;border:0;border-radius:999px;padding:15px;font-weight:800;font-size:16px;background:#fff;color:#131312}
.pv .pbtn.acc{background:var(--gold);color:var(--gink)}
.pv .pbtn[disabled]{opacity:.4}
.pv .card{background:#1c1c1b;border-radius:18px;padding:16px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.pv .me{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--cmuted);margin-bottom:10px;font-weight:700;gap:8px}
.pv .me b{color:var(--cink)}
.pv .pq{font-family:var(--hf);font-stretch:125%;font-weight:500;font-size:19px;line-height:1.15;margin:4px 0 12px}
.pv .hintc{font-size:13px;color:var(--gdark);font-weight:800;margin:-6px 0 10px}
.pv .tm{height:6px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;margin-bottom:12px}
.pv .tm i{display:block;height:100%;background:var(--gdark);border-radius:99px;transition:width .25s linear}
.pv .ans{display:grid;grid-template-columns:1fr;gap:9px;flex:1}
.pv .ans button{border:0;border-radius:16px;padding:14px;color:#fff;font-weight:800;font-size:16px;display:flex;align-items:center;gap:10px;text-align:left;min-height:58px;transition:transform .12s,opacity .3s,box-shadow .3s}
.pv .ans button:active{transform:scale(.97)}
.pv .ans button .l{width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.25);display:grid;place-items:center;flex:none;font-size:14px}
.pv .ans.picked button{opacity:.35}
.pv .ans.picked button.sel{opacity:1;box-shadow:0 0 0 3px #131312,0 0 0 5px #fff}
.pv .ans.pic{grid-template-columns:1fr 1fr;grid-auto-rows:min-content;align-content:center}
.pv .ans.pic button{flex-direction:column;align-items:stretch;padding:6px;gap:6px;min-height:0}
.pv .ans.pic button .im{aspect-ratio:1;border-radius:11px;background:#1a1b22 center/cover no-repeat}
.pv .ans.pic button .im{display:grid;place-items:center}.pv .ans.pic button .im em{font-style:normal;font-family:var(--hf);font-stretch:125%;font-size:40px;color:#fff;opacity:.92}
.pv .ans.pic button .rw{display:flex;align-items:center;gap:6px;font-size:14px}
.pv .numin{display:flex;flex-direction:column;gap:10px;margin-top:6px}
