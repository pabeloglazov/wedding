<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08080a">
<meta name="robots" content="noindex">
<title>Молоко</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap">
<style>
/* Один экран: живой фон → шапка → карусель станций (coverflow) → инфо → плейлист → стеклянная панель плеера */
:root{
  --bg:#08080a;
  --fg:#f5f3f8;
  --mute:rgba(245,243,248,.58);
  --faint:rgba(245,243,248,.34);
  --glass:rgba(255,255,255,.11);
  --glass-hi:rgba(255,255,255,.2);
  --accent:#ff2d2d;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --cw:240px;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;filter:saturate(1.15)}
#grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.06;mix-blend-mode:overlay}
#app{position:relative;z-index:2;height:100%;max-width:430px;margin:0 auto;display:flex;flex-direction:column;padding-inline:16px;box-sizing:border-box}
header{display:flex;align-items:center;justify-content:space-between;padding-block:12px 4px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;letter-spacing:.22em}
.logo svg{width:22px;height:22px}
.st-count{font-size:11px;letter-spacing:.14em;color:var(--mute);font-variant-numeric:tabular-nums}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border:0;background:transparent;color:var(--fg);border-radius:14px;cursor:pointer}
.icon-btn svg{width:22px;height:22px}
.icon-btn.off{color:var(--faint)}
.icon-btn:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--fg);outline-offset:2px}

#stage{position:relative;flex:0 0 auto;perspective:1000px;touch-action:none;cursor:grab;margin-top:6px}
#stage:active{cursor:grabbing}
.card{position:absolute;left:50%;top:50%;width:var(--cw);margin-left:calc(var(--cw) / -2);border-radius:22px;padding:8px 8px 0;box-sizing:border-box;background:var(--glass);border:1px solid var(--glass-hi);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);will-change:transform;transform-style:preserve-3d}
.card img{display:block;width:100%;aspect-ratio:1;border-radius:15px;pointer-events:none;-webkit-user-drag:none}
.card .cap{text-align:center;padding:10px 4px 12px;line-height:1.25}
.card .cap b{display:block;font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .cap span{display:block;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .shade{position:absolute;inset:-1px;border-radius:22px;background:#050507;pointer-events:none}

.spacer{flex:1 1 0;min-height:8px}
#info{text-align:center;padding-block:14px 0}
#info h2{margin:0;font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
#info p{margin:6px 0 0;font-size:14px;color:var(--mute)}
.live{display:flex;align-items:center;justify-content:space-between;padding-block:10px 2px;font-size:11px;letter-spacing:.14em;color:var(--mute);font-variant-numeric:tabular-nums}
.live b{display:flex;align-items:center;gap:7px;font-weight:600;color:var(--fg)}
.live b i{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 var(--accent);animation:pulse 1.6s infinite}
.live.paused b i{animation:none;opacity:.4}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.35)}100%{box-shadow:0 0 0 8px rgba(255,255,255,0)}}
.swap{animation:swapIn .32s cubic-bezier(.2,.8,.2,1)}
@keyframes swapIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

#list{flex:1 1 auto;min-height:0;overflow-y:auto;touch-action:pan-y;margin:0;padding:0 2px;list-style:none;display:flex;flex-direction:column;gap:2px}
#list button{width:100%;display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:10px;padding:9px 10px;border:0;border-radius:12px;background:transparent;color:var(--mute);font:inherit;text-align:left;cursor:pointer}
#list button.on{background:rgba(255,255,255,.08);color:var(--fg)}
#list .n{font-size:12px;font-variant-numeric:tabular-nums;color:var(--faint);display:flex;align-items:flex-end;gap:2px;height:14px}
#list .on .n i{display:block;width:3px;background:var(--accent);border-radius:1px;height:4px}
#list .t{min-width:0}
#list .t b{display:block;font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#list .t span{display:block;font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#list .d{font-size:12px;font-variant-numeric:tabular-nums;color:var(--faint)}

#player{flex:0 0 auto;margin-block:10px calc(10px + env(safe-area-inset-bottom,0px));border-radius:26px;padding:10px 12px 8px;background:var(--glass);border:1px solid var(--glass-hi);backdrop-filter:blur(26px) saturate(1.5);-webkit-backdrop-filter:blur(26px) saturate(1.5)}
.mini{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;background:rgba(0,0,0,.42);border-radius:14px;padding:6px 10px 6px 6px}
.mini img{width:44px;height:44px;border-radius:9px;display:block}
.mini .t{min-width:0;line-height:1.25}
.mini .t b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .t span{display:block;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eq{display:flex;align-items:flex-end;gap:3px;height:18px}
.eq i{width:3px;height:3px;background:var(--fg);border-radius:2px;opacity:.85}
.prog{padding-block:10px 4px;touch-action:none;cursor:pointer}
.prog .bar{height:4px;border-radius:2px;background:rgba(255,255,255,.16);position:relative}
.prog .fill{position:absolute;inset:0 auto 0 0;width:0;border-radius:2px;background:var(--fg)}
.times{display:flex;justify-content:space-between;font-size:10px;color:var(--faint);font-variant-numeric:tabular-nums;margin-top:5px}
.ctrl{display:flex;align-items:center;justify-content:space-between}
.ctrl .mid{display:flex;align-items:center;gap:6px}
.ctrl button{width:48px;height:48px;border:0;background:transparent;color:var(--fg);display:grid;place-items:center;border-radius:50%;cursor:pointer;transition:transform .12s}
.ctrl button:active{transform:scale(.92)}
.ctrl button svg{width:24px;height:24px}
.ctrl #play{width:56px;height:56px;color:var(--accent)}
.ctrl #play svg{width:30px;height:30px}
.vol{display:flex;align-items:center;gap:6px;width:96px}
.vol svg{width:18px;height:18px;flex:none;color:var(--mute)}
.vol input{width:100%;accent-color:var(--fg)}

#gate{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:rgba(5,5,7,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:opacity .5s}
#gate.hide{opacity:0;pointer-events:none}
#gate .box{text-align:center;padding:24px;max-width:300px}
#gate h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:0 0 8px;text-wrap:balance}
#gate p{color:var(--mute);font-size:14px;line-height:1.45;margin:0 0 22px}
#gate button{font:600 16px var(--font);color:#0a0a0c;background:var(--fg);border:0;border-radius:999px;padding:15px 28px;cursor:pointer}
@media (prefers-reduced-motion:reduce){.swap{animation:none}}
</style>

</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<canvas id="grain" aria-hidden="true"></canvas>

<div id="app">
  <header>
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3c3.5 4.5 6 8 6 11a6 6 0 0 1-12 0c0-3 2.5-6.5 6-11z"/></svg>МОЛОКО</div>
    <div class="st-count" id="count">01 / 06</div>
    <button class="icon-btn" id="clickBtn" aria-label="Звук щелчка" title="Звук щелчка">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="3" width="8" height="14" rx="4"/><path d="M12 7v3M12 17v4M8 21h8"/></svg>
    </button>
  </header>

  <div class="spacer"></div>
  <div id="stage" aria-roledescription="карусель" aria-label="Станции"></div>
  <div id="info">
    <h2 id="stName"></h2>
    <p id="stTag"></p>
  </div>
  <div class="spacer"></div>

  <div id="player">
    <div class="mini">
      <img id="miniCover" alt="">
      <div class="t"><b id="miniTitle"></b><span id="miniArtist"></span></div>
      <div class="eq" id="eq"><i></i><i></i><i></i><i></i><i></i></div>
    </div>
    <div class="live" id="live"><b><i></i><span id="liveTxt">ПРЯМОЙ ЭФИР</span></b><span id="tCur">0:00</span></div>
    <div class="ctrl">
      <div class="vol"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg><input id="vol" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Громкость"></div>
      <div class="mid">
        <button id="prev" aria-label="Предыдущая станция"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 6v12L3 12zM21 6v12l-8-6z"/></svg></button>
        <button id="play" aria-label="Пауза"><svg id="playIco" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
        <button id="next" aria-label="Следующая станция"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 6v12l8-6zM3 6v12l8-6z"/></svg></button>
      </div>
      <div style="width:96px"></div>
    </div>
  </div>
</div>

<div id="gate">
  <div class="box">
    <h1>Молоко</h1>
    <p>Музыка для твоего состояния. Листай карточки влево и вправо: у каждой станции свой цвет и свой эфир.</p>
    <button id="startBtn">Включить звук</button>
  </div>
</div>

<script>
/* ---------- Данные станций ---------- */
const STATIONS = [
  {id:'workout',name:'Тренировка',tag:'Бег, зал, интервалы',c1:'#FF2D2D',c2:'#FF8A00',
   tracks:[['Красная линия','Кинетика',192],['Интервал 7','Пульс',178],['Тяжёлый подход','Северный ветер',205],['Последний километр','Кинетика',186],['На пределе','Метро',171]]},
  {id:'chill',name:'Отдых',tag:'Вечер, расслабиться',c1:'#7B5CFF',c2:'#FF6FB5',
   tracks:[['Тёплая веранда','Бархатный час',214],['Поздний чай','Мира Соль',187],['У окна','Бархатный час',199],['Низкое солнце','Кассета',226],['Медленное воскресенье','Мира Соль',203]]},
  {id:'focus',name:'Фокус',tag:'Работа, концентрация',c1:'#00C2A8',c2:'#0A84FF',
   tracks:[['Глубокое поле','Тихая сетка',248],['Одна задача','Люмен',231],['Чистая вода','Тихая сетка',262],['Только сигнал','Хальден',240]]},
  {id:'study',name:'Учёба',tag:'Занятия, чтение',c1:'#F5C400',c2:'#FF9F0A',
   tracks:[['На полях','Бумажная лампа',196],['Глава вторая','Эллис Рен',208],['Маркер','Бумажная лампа',184],['Тихая библиотека','Клуб тетрадей',221],['Открытая книга','Эллис Рен',199]]},
  {id:'drive',name:'Дорога',tag:'Трасса, ночной город',c1:'#0A84FF',c2:'#5AC8FA',
   tracks:[['Ночная трасса','Неоновый берег',217],['Съезд 42','Хромовое поле',203],['Стоп-огни','Неоновый берег',229],['Эстакада','Гранд Раннер',195],['Побережье 88','Хромовое поле',211]]},
  {id:'sleep',name:'Сон',tag:'Засыпание, тишина',c1:'#2A3AA8',c2:'#8A6BD8',
   tracks:[['Тихая комната','Ноктюрн',301],['Медленный прилив','Безветрие',288],['Синий час','Ноктюрн',315],['Пёрышко','Безветрие',296]]}
];

/* Потоки станций: записанные бесшовные петли (audio/*.mp3), длина в секундах */
const LOOPS = {chill:{s:182.857143,bpm:84},workout:{s:120.000000,bpm:128},focus:{s:164.571429,bpm:70},study:{s:151.578957,bpm:76},drive:{s:147.692313,bpm:104},sleep:{s:137.142857,bpm:56}};

/* ---------- Состояние ---------- */
const N = STATIONS.length;
const mod = (n,m=N)=>((n%m)+m)%m;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let saved = 0;
try{ saved = parseInt(localStorage.getItem('moloko-st')||'0',10)||0; }catch(e){}
const S = {
  pos:saved, vel:0, target:saved, dragging:false, settled:true,
  station:mod(saved), track:0, elapsed:0, playing:false, started:false,
  clickOn:true, fan:1, lastTickIdx:Math.round(saved), level:0
};

/* ---------- Обложки (генерируются в canvas) ---------- */
const COVERS = {};
function drawCover(st){
  const W=480, c=document.createElement('canvas'); c.width=c.height=W;
  const g=c.getContext('2d');
  const lin=(x0,y0,x1,y1,a,b)=>{const l=g.createLinearGradient(x0,y0,x1,y1);l.addColorStop(0,a);l.addColorStop(1,b);return l;};
  let ink='#fff';
  switch(st.id){
    case 'workout':
      g.fillStyle=lin(0,0,W,W,st.c1,st.c2); g.fillRect(0,0,W,W);
      g.save(); g.translate(W/2,W/2); g.rotate(-Math.PI/5); g.fillStyle='rgba(10,0,0,.82)';
      for(let i=-6;i<6;i++) g.fillRect(i*86,-W,34,W*2); g.restore();
      break;
    case 'chill':
      g.fillStyle=lin(0,0,0,W,st.c1,st.c2); g.fillRect(0,0,W,W);
      g.fillStyle='rgba(255,236,200,.92)'; g.beginPath(); g.arc(W*.62,W*.4,W*.2,0,7); g.fill();
      g.strokeStyle='rgba(40,10,60,.55)'; g.lineWidth=10;
      for(let k=0;k<5;k++){g.beginPath();for(let x=0;x<=W;x+=8){const y=W*.6+k*26+Math.sin(x/38+k)*9;x?g.lineTo(x,y):g.moveTo(x,y);}g.stroke();}
      break;
    case 'focus':
      g.fillStyle='#04201f'; g.fillRect(0,0,W,W);
      for(let r=14;r>0;r--){g.beginPath();g.arc(W*.5,W*.44,r*18,0,7);g.fillStyle=r%2?st.c1:st.c2;g.globalAlpha=.12+.06*(14-r)/14*5;g.fill();}
      g.globalAlpha=1; g.fillStyle='#e9fffb'; g.beginPath(); g.arc(W*.5,W*.44,10,0,7); g.fill();
      break;
    case 'study':
      g.fillStyle=st.c1; g.fillRect(0,0,W,W); ink='#1a1300';
      g.strokeStyle='rgba(26,19,0,.22)'; g.lineWidth=2;
      for(let y=40;y<W;y+=28){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke();}
      g.strokeStyle='rgba(200,40,40,.6)'; g.beginPath(); g.moveTo(70,0); g.lineTo(70,W); g.stroke();
      g.fillStyle=st.c2; g.beginPath(); g.arc(W*.7,W*.36,W*.15,0,7); g.fill();
      break;
    case 'drive':
      g.fillStyle=lin(0,0,0,W,'#050a2a',st.c1); g.fillRect(0,0,W,W);
      const sun=lin(0,W*.15,0,W*.55,'#ffd1f0',st.c2); g.fillStyle=sun; g.beginPath(); g.arc(W/2,W*.48,W*.24,Math.PI,0); g.fill();
      g.fillStyle='#050a2a'; for(let i=0;i<6;i++) g.fillRect(0,W*.3+i*i*4+i*10,W,3+i*1.6);
      g.strokeStyle='rgba(180,230,255,.55)'; g.lineWidth=2;
      for(let i=0;i<9;i++){const y=W*.5+Math.pow(i/8,2)*W*.5;g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke();}
      for(let i=-8;i<=8;i++){g.beginPath();g.moveTo(W/2+i*10,W*.5);g.lineTo(W/2+i*90,W);g.stroke();}
      break;
    case 'sleep':
      g.fillStyle=lin(0,0,W,W,'#0b0f3a',st.c1); g.fillRect(0,0,W,W);
      let s=7; const rnd=()=>((s=s*16807%2147483647)/2147483647);
      g.fillStyle='#fff'; for(let i=0;i<70;i++){g.globalAlpha=.3+rnd()*.7;g.beginPath();g.arc(rnd()*W,rnd()*W*.8,rnd()*1.8+.4,0,7);g.fill();}
      g.globalAlpha=1; g.fillStyle='#f3ecff'; g.beginPath(); g.arc(W*.62,W*.38,W*.16,0,7); g.fill();
      g.fillStyle='#14175a'; g.beginPath(); g.arc(W*.69,W*.33,W*.15,0,7); g.fill();
      break;
  }
  g.fillStyle=ink; g.textBaseline='alphabetic';
  const title=st.name.toUpperCase(); let fs=72;
  do{ g.font='800 '+fs+'px Inter, system-ui, sans-serif'; fs-=2; }while(g.measureText(title).width>W-60&&fs>30);
  g.fillText(title,30,W-36);
  g.font='600 18px Inter, system-ui, sans-serif'; g.globalAlpha=.8;
  g.fillText(LOOPS[st.id].bpm+' УД/МИН',30,W-36-fs-18);
  g.globalAlpha=1;
  return c.toDataURL('image/jpeg',.86);
}

/* ---------- Карусель ---------- */
const stage=document.getElementById('stage');
const SLOTS=[];
for(let k=0;k<7;k++){
  const el=document.createElement('div'); el.className='card';
  el.innerHTML='<img alt=""><div class="cap"><b></b><span></span></div><div class="shade"></div>';
  stage.appendChild(el);
  SLOTS.push({el,img:el.querySelector('img'),b:el.querySelector('b'),sp:el.querySelector('span'),shade:el.querySelector('.shade'),idx:-1});
}
let CW=240, STEP=134;
function layout(){
  const vw=Math.min(innerWidth,430), vh=innerHeight;
  CW=Math.round(Math.min(vw*.66, 290, vh*.36));
  STEP=CW*.56;
  document.documentElement.style.setProperty('--cw',CW+'px');
  stage.style.height=Math.round(CW*1.27+18)+'px';
}
layout(); addEventListener('resize',layout);

function renderCards(){
  const base=Math.round(S.pos);
  for(let k=-3;k<=3;k++){
    const s=SLOTS[k+3], real=base+k, idx=mod(real);
    if(s.idx!==idx){ const st=STATIONS[idx]; s.img.src=COVERS[st.id]||''; s.b.textContent=st.name; s.sp.textContent=st.tag; s.idx=idx; }
    s.real=real;
    const d=(real-S.pos)*S.fan, ad=Math.abs(d), sg=Math.sign(d);
    const x=sg*(Math.min(ad,1)*STEP + Math.max(0,ad-1)*CW*.3);
    const sc=1-.17*Math.min(ad,1)-.13*clamp(ad-1,0,1)-.1*clamp(ad-2,0,1);
    const rot=reduce?0:-sg*Math.min(ad,1)*30;
    s.el.style.transform=`translate3d(${x.toFixed(1)}px,-50%,${(-ad*50).toFixed(1)}px) rotateY(${rot.toFixed(2)}deg) scale(${sc.toFixed(4)})`;
    s.el.style.zIndex=String(20-Math.round(ad*4));
    s.el.style.opacity=String(clamp((3.1-ad)/.7,0,1));
    s.shade.style.opacity=String(Math.min(ad,2.4)*.24);
  }
}

/* ---------- Жесты ---------- */
let drag=null;
stage.addEventListener('pointerdown',e=>{
  stage.setPointerCapture(e.pointerId);
  drag={x:e.clientX,pos0:S.pos,lastX:e.clientX,lastT:performance.now(),v:0,moved:0,target:e.target.closest('.card')};
  S.dragging=true; S.settled=false; S.vel=0; duck(true);
});
stage.addEventListener('pointermove',e=>{
  if(!drag) return;
  const now=performance.now(), dx=e.clientX-drag.x;
  drag.moved=Math.max(drag.moved,Math.abs(dx));
  S.pos=drag.pos0-dx/STEP;
  const dt=Math.max(1,now-drag.lastT);
  const inst=-(e.clientX-drag.lastX)/STEP/(dt/1000);
  drag.v=drag.v*.6+inst*.4;
  drag.lastX=e.clientX; drag.lastT=now;
});
function endDrag(){
  if(!drag) return;
  S.dragging=false; duck(false);
  const cur=Math.round(S.pos);
  if(drag.moved<6){
    const slot=SLOTS.find(s=>s.el===drag.target);
    S.target=slot?slot.real:cur;
  }else{
    const throwN=clamp(Math.round(drag.v*.22),-3,3);
    S.target=Math.round(S.pos+ (Math.abs(drag.v)>1.2?throwN:0));
    S.vel=drag.v*.5;
  }
  drag=null;
}
stage.addEventListener('pointerup',endDrag);
stage.addEventListener('pointercancel',endDrag);
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'){S.target=Math.round(S.target)+1;S.settled=false;}
  if(e.key==='ArrowLeft'){S.target=Math.round(S.target)-1;S.settled=false;}
});

/* ---------- Аудио ---------- */
let ac, master, musicBus, duckG, lp, analyser, clickBus, noiseBuf, radio, radioG, staticG;
let fData;
function initAudio(){
  ac=new (window.AudioContext||window.webkitAudioContext)();
  try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}
  master=ac.createGain(); master.gain.value=+document.getElementById('vol').value;
  musicBus=ac.createGain(); duckG=ac.createGain();
  lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=20000; lp.Q.value=.7;
  analyser=ac.createAnalyser(); analyser.fftSize=256; analyser.smoothingTimeConstant=.78;
  fData=new Uint8Array(analyser.frequencyBinCount);
  musicBus.connect(duckG).connect(lp).connect(analyser).connect(master).connect(ac.destination);
  clickBus=ac.createGain(); clickBus.gain.value=1; clickBus.connect(ac.destination);
  noiseBuf=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);
  const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  radio=ac.createBufferSource(); radio.buffer=noiseBuf; radio.loop=true;
  const rbp=ac.createBiquadFilter(); rbp.type='bandpass'; rbp.frequency.value=2200; rbp.Q.value=.6;
  radioG=ac.createGain(); radioG.gain.value=0;
  staticG=ac.createGain(); staticG.gain.value=0;
  radio.connect(rbp); rbp.connect(radioG).connect(master); rbp.connect(staticG).connect(master); radio.start();
  unlockIOS();
}
function unlockIOS(){
  // тихий <audio> переводит iPhone в режим воспроизведения, чтобы звук шёл даже при беззвучном режиме
  try{
    const sr=8000,n=800,buf=new ArrayBuffer(44+n*2),v=new DataView(buf);
    const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
    w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
    v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
    let bin='';const u=new Uint8Array(buf);for(let i=0;i<u.length;i++)bin+=String.fromCharCode(u[i]);
    const a=new Audio('data:audio/wav;base64,'+btoa(bin)); a.loop=true; a.volume=.01; a.setAttribute('playsinline','');
    const p=a.play(); if(p&&p.catch) p.catch(()=>{});
  }catch(e){}
}

/* Щелчок: тик барабана будильника iPhone + плотный низ */
function tick(soft){
  if(navigator.vibrate){ try{ navigator.vibrate(soft?6:10); }catch(e){} }
  if(!ac||!S.clickOn) return;
  const t=ac.currentTime+.002, k=soft?.42:1, p=1+(Math.random()*.1-.05);
  // верх — сухой щелчок
  const n=ac.createBufferSource(); n.buffer=noiseBuf;
  const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=3700*p; bp.Q.value=5;
  const g1=ac.createGain(); g1.gain.setValueAtTime(.0001,t); g1.gain.exponentialRampToValueAtTime(2.6*k,t+.0006); g1.gain.exponentialRampToValueAtTime(.0001,t+.0055);
  n.connect(bp).connect(g1).connect(clickBus); n.start(t,Math.random()*1.5); n.stop(t+.02);
  // середина — «деревянная» часть
  const o2=ac.createOscillator(); o2.type='sine'; o2.frequency.value=1450*p;
  const g2=ac.createGain(); g2.gain.setValueAtTime(.0001,t); g2.gain.exponentialRampToValueAtTime(.22*k,t+.0008); g2.gain.exponentialRampToValueAtTime(.0001,t+.009);
  o2.connect(g2).connect(clickBus); o2.start(t); o2.stop(t+.02);
  // низ — насыщенность
  const o3=ac.createOscillator(); o3.type='sine'; o3.frequency.setValueAtTime(190*p,t); o3.frequency.exponentialRampToValueAtTime(140*p,t+.022);
  const g3=ac.createGain(); g3.gain.setValueAtTime(.0001,t); g3.gain.exponentialRampToValueAtTime(.42*k,t+.0015); g3.gain.exponentialRampToValueAtTime(.0001,t+.024);
  o3.connect(g3).connect(clickBus); o3.start(t); o3.stop(t+.04);
}

function duck(on){
  if(!ac) return;
  const t=ac.currentTime;
  duckG.gain.setTargetAtTime(on?.5:1,t,.06);
  lp.frequency.setTargetAtTime(on?1100:20000,t,on?.05:.15);
  radioG.gain.setTargetAtTime(on?.018:0,t,.08);
}

/* ---------- Эфир: загрузка, кэш и переключение потоков ---------- */
const BUFS={}, LOADING={};
let cur=null, wantId=null;
function load(id){
  if(BUFS[id]) return Promise.resolve(BUFS[id]);
  if(LOADING[id]) return LOADING[id];
  LOADING[id]=fetch('audio/'+id+'.mp3')
    .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.arrayBuffer(); })
    .then(ab=>new Promise((res,rej)=>ac.decodeAudioData(ab,res,rej)))
    .then(b=>{ BUFS[id]=b; return b; })
    .catch(e=>{ delete LOADING[id]; throw e; });
  return LOADING[id];
}
// сначала текущая станция, потом соседние, потом остальные — по одной, чтобы не забивать сеть
let preloadRun=0;
function preloadAround(){
  const run=++preloadRun, c=S.station, order=[0,1,-1,2,-2,3].map(k=>STATIONS[mod(c+k)].id);
  (async()=>{ for(const id of order){ if(run!==preloadRun) return; try{ await load(id); }catch(e){} } })();
}
function setLive(txt){ $('liveTxt').textContent=txt; }
function setStatic(on){ if(staticG) staticG.gain.setTargetAtTime(on?.035:0,ac.currentTime,.08); }
function stopCur(fade){
  if(!cur) return;
  const {src,g}=cur, t=ac.currentTime;
  g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(g.gain.value,t); g.gain.linearRampToValueAtTime(0,t+fade);
  try{ src.stop(t+fade+.05); }catch(e){}
  cur=null;
}
function playStation(id){
  wantId=id;
  if(!ac||!S.playing) return;
  if(cur&&cur.id===id) return;
  const b=BUFS[id];
  if(!b){
    stopCur(.4); setStatic(true); setLive('НАСТРОЙКА…');
    load(id).then(()=>{ if(wantId===id&&S.playing) playStation(id); })
            .catch(()=>{ if(wantId===id){ setStatic(false); setLive('НЕТ СИГНАЛА'); } });
    return;
  }
  setStatic(false); setLive('ПРЯМОЙ ЭФИР');
  const L=LOOPS[id].s, extra=b.duration-L, lead=extra>.004?Math.min(extra,1105/44100):0;
  const src=ac.createBufferSource(); src.buffer=b; src.loop=true; src.loopStart=lead; src.loopEnd=lead+L;
  const g=ac.createGain(); src.connect(g).connect(musicBus);
  // эфир идёт всегда: подключаешься к станции в той точке, где она играет сейчас
  const live=(Date.now()/1000)%L, t=ac.currentTime;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(1,t+.8);
  src.start(t,lead+live);
  stopCur(.6);
  cur={src,g,id};
}
function commitStation(idx){
  if(idx===S.station&&S.started) return;
  S.station=idx; S.elapsed=0;
  try{ localStorage.setItem('moloko-st',String(Math.round(S.pos))); }catch(e){}
  renderInfo(true);
  if(ac){ playStation(STATIONS[idx].id); preloadAround(); }
}
/* ---------- Интерфейс ---------- */
const $=id=>document.getElementById(id);
const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
function renderInfo(stationChanged){
  const st=STATIONS[S.station];
  $('count').textContent=String(S.station+1).padStart(2,'0')+' / '+String(N).padStart(2,'0');
  $('stName').textContent=st.name; $('stTag').textContent=st.tag;
  if(stationChanged){ const i=$('info'); i.classList.remove('swap'); void i.offsetWidth; i.classList.add('swap'); }
  $('miniCover').src=COVERS[st.id]||''; $('miniTitle').textContent=st.name; $('miniArtist').textContent='Молоко · '+st.tag;
}
function togglePlay(force){
  S.playing = typeof force==='boolean'?force:!S.playing;
  $('play').setAttribute('aria-label',S.playing?'Пауза':'Играть');
  $('live').classList.toggle('paused',!S.playing);
  $('playIco').innerHTML = S.playing
    ? '<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>'
    : '<path d="M7 4.5v15l13-7.5z"/>';
  if(ac){
    if(S.playing) playStation(STATIONS[S.station].id);
    else { wantId=null; stopCur(.25); setStatic(false); setLive('ПАУЗА'); }
  }
}
$('play').addEventListener('click',()=>togglePlay());
$('next').addEventListener('click',()=>{S.target=Math.round(S.target)+1;S.settled=false;});
$('prev').addEventListener('click',()=>{S.target=Math.round(S.target)-1;S.settled=false;});
$('vol').addEventListener('input',e=>{ if(master) master.gain.setTargetAtTime(+e.target.value,ac.currentTime,.03); });
$('clickBtn').addEventListener('click',()=>{ S.clickOn=!S.clickOn; $('clickBtn').classList.toggle('off',!S.clickOn); if(S.clickOn) tick(false); });


$('startBtn').addEventListener('click',()=>{
  initAudio(); ac.resume && ac.resume();
  S.started=true;
  togglePlay(true); tick(false); preloadAround();
  $('gate').classList.add('hide');
  if(!reduce){ S.fan=0; const t0=performance.now(); const intro=()=>{const k=Math.min(1,(performance.now()-t0)/750);S.fan=1-Math.pow(1-k,3);if(k<1)requestAnimationFrame(intro);}; requestAnimationFrame(intro); }
});

/* ---------- Фон ---------- */
const bg=$('bg'), bctx=bg.getContext('2d');
function sizeBg(){ bg.width=Math.max(60,Math.round(innerWidth/7)); bg.height=Math.max(100,Math.round(innerHeight/7)); }
sizeBg(); addEventListener('resize',sizeBg);
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mix=(a,b,f)=>a.map((v,i)=>Math.round(v+(b[i]-v)*f));
const rgba=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
STATIONS.forEach(s=>{s.r1=hex(s.c1);s.r2=hex(s.c2);});
function drawBg(time){
  const w=bg.width,h=bg.height, i0=Math.floor(S.pos), f=S.pos-i0;
  const A=STATIONS[mod(i0)], B=STATIONS[mod(i0+1)];
  const c1=mix(A.r1,B.r1,f), c2=mix(A.r2,B.r2,f);
  document.documentElement.style.setProperty('--accent',rgba(mix(c1,[255,255,255],.12),1));
  bctx.globalCompositeOperation='source-over'; bctx.fillStyle='#08080a'; bctx.fillRect(0,0,w,h);
  bctx.globalCompositeOperation='lighter';
  const tt=reduce?0:time/1000, L=1+S.level*.1;
  const blob=(x,y,r,c,a)=>{const g=bctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,rgba(c,a));g.addColorStop(.55,rgba(c,a*.45));g.addColorStop(1,rgba(c,0));bctx.fillStyle=g;bctx.fillRect(0,0,w,h);};
  blob(w*(.36+Math.cos(tt*.21)*.12),h*(.36+Math.sin(tt*.17)*.07),w*.95*L,c1,.78+S.level*.15);
  blob(w*(.72+Math.sin(tt*.19)*.1),h*(.3+Math.cos(tt*.23)*.06),w*.62*L,c2,.6);
  blob(w*(.48+Math.sin(tt*.13)*.1),h*(.74+Math.cos(tt*.15)*.05),w*.75,mix(c1,[0,0,0],.35),.5);
}
// зерно
(()=>{const g=$('grain');g.width=256;g.height=256;const x=g.getContext('2d'),im=x.createImageData(256,256);for(let i=0;i<im.data.length;i+=4){const v=Math.random()*255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255;}x.putImageData(im,0,0);g.style.width='100%';g.style.height='100%';g.style.imageRendering='pixelated';})();

/* ---------- Главный цикл ---------- */
const eqBars=[...$('eq').children];
let lastT=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-lastT)/1000); lastT=now;
  // пружина к центру
  if(!S.dragging&&!S.settled){
    const k=300,c=30;
    S.vel+=((S.target-S.pos)*k - S.vel*c)*dt;
    S.pos+=S.vel*dt;
    if(Math.abs(S.target-S.pos)<.0015&&Math.abs(S.vel)<.02){
      S.pos=S.target; S.vel=0; S.settled=true;
      tick(true);
      commitStation(mod(S.target));
    }
  }
  // щелчок при прохождении каждой позиции
  const ri=Math.round(S.pos);
  if(ri!==S.lastTickIdx){ tick(false); S.lastTickIdx=ri; }
  renderCards();
  // уровень звука
  let lvl=0;
  if(analyser&&S.playing){
    analyser.getByteFrequencyData(fData);
    let sum=0; for(let i=0;i<32;i++) sum+=fData[i]; lvl=sum/(32*255);
    const bands=[2,5,10,18,30];
    eqBars.forEach((b,i)=>{b.style.height=(3+fData[bands[i]]/255*15).toFixed(1)+'px';});
  }else eqBars.forEach(b=>b.style.height='3px');
  S.level+= (lvl-S.level)*.2;
  drawBg(now);
  // время в эфире станции
  if(S.playing&&S.started) S.elapsed+=dt;
  $('tCur').textContent=fmt(S.elapsed);
  requestAnimationFrame(frame);
}

/* ---------- Старт ---------- */
(async()=>{
  try{ await Promise.race([document.fonts.load('800 64px Inter'),new Promise(r=>setTimeout(r,1500))]); }catch(e){}
  STATIONS.forEach(s=>COVERS[s.id]=drawCover(s));
  SLOTS.forEach(s=>s.idx=-1);
  renderInfo(true);
  requestAnimationFrame(frame);
})();
</script>
