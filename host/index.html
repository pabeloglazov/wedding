<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мои игры · Белоглазов</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#131312">
<link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/brand.css">
<script src="../assets/brand.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#131312;--bg2:#181817;--card:#1c1c1b;--line:rgba(255,255,255,.1);--ink:#ffffff;--text:#e8e8e6;--muted:#a3a3a3;--gold:#f2efe9;--gold2:#d9d6d0}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,system-ui,sans-serif;line-height:1.55}
a{color:inherit}
.top{position:sticky;top:0;z-index:5;background:rgba(19,19,18,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .in{max-width:980px;margin:0 auto;padding:0 24px;height:64px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand i{width:30px;height:30px;border-radius:9px;background:#f2efe9;display:grid;place-items:center;font-style:normal;color:#131312;font-weight:800;font-size:14px}
.brand b{font-family:var(--hf);font-stretch:125%;letter-spacing:-.01em;font-size:22px;font-weight:600;color:var(--ink)}
.sp{flex:1}
.lang,.out{border:1px solid var(--line);background:none;color:var(--ink);font:inherit;font-weight:800;font-size:12px;height:40px;border-radius:999px;cursor:pointer;padding:0 14px}
.lang{width:40px;padding:0}
.out{color:var(--muted);font-weight:700}
.wrap{max-width:980px;margin:0 auto;padding:40px 24px 80px}
.k{color:var(--gold2);letter-spacing:.24em;text-transform:uppercase;font-weight:700;font-size:12px}
h1{font-family:var(--hf);font-stretch:125%;letter-spacing:-.01em;font-weight:600;font-size:clamp(38px,6vw,56px);line-height:1.02;margin:10px 0 10px;color:var(--ink)}
.lead{color:var(--muted);margin:0 0 28px;max-width:560px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 20px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.gold{background:#f2efe9;color:#131312}
.btn.ghost{background:rgba(255,255,255,.06);color:var(--ink);border:1px solid var(--line)}
.btn[disabled]{opacity:.5;cursor:default}
.login{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px;max-width:460px}
.login input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px;color:var(--ink);font:inherit;font-size:16px;outline:none;margin:6px 0 12px}
.login input:focus{border-color:var(--gold2)}
.login .btn{width:100%}
.msg{margin-top:12px;font-size:14px;color:var(--muted);min-height:20px}
.msg.ok{color:#9fd3b0}.msg.err{color:#e89a8a}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.plan{border:1px solid rgba(242,239,233,.35);color:var(--gold);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.plan.off{color:var(--muted);border-color:var(--line)}
.list{display:grid;gap:16px}
.ev{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}
.ev h3{font-family:var(--hf);font-stretch:125%;letter-spacing:-.01em;font-size:28px;font-weight:600;margin:0;color:var(--ink);line-height:1.1}
.ev .meta{color:var(--muted);font-size:13px;margin:4px 0 14px}
.ev .acts{display:flex;gap:8px;flex-wrap:wrap}
.ev .acts .btn{padding:10px 14px;font-size:14px;border-radius:12px}
.ev .qr{background:#fff;border-radius:14px;padding:8px;width:112px;height:112px}
.ev .qr img,.ev .qr canvas{width:96px!important;height:96px!important;display:block}
.ev.old{opacity:.6}
.empty{color:var(--muted);background:var(--bg2);border:1px dashed var(--line);border-radius:22px;padding:28px;text-align:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#ffffff;color:#131312;border-radius:12px;padding:10px 16px;font-weight:700;font-size:14px;opacity:0;transition:all .25s;pointer-events:none;z-index:9}
.toast.on{opacity:1;transform:translateX(-50%)}
@media (max-width:640px){.wrap{padding:28px 16px 64px}.top .in{padding:0 16px}.ev{grid-template-columns:1fr}.ev .qr{display:none}}

/* Beloglazov Event */
:root{--hf:Archivo,Manrope,system-ui,sans-serif}
h1,.h2,h3{text-transform:uppercase}
h1,.h2,.hero h1{font-weight:500!important}
h1 em,.hero h1 em{font-style:normal!important;color:var(--muted)!important}
.brand{gap:10px!important;color:#fff}
.brand .pb-word{height:13px}
.brand span{border-left:1px solid rgba(255,255,255,.18);padding-left:10px;font-size:12px!important;letter-spacing:.02em}
.btn{border-radius:999px!important}
.btn.gold:hover{background:#fff}
.btn.ghost{background:transparent!important;border:1px solid rgba(255,255,255,.28)!important}
.btn.ghost:hover{background:rgba(255,255,255,.08)!important}
.k{color:var(--muted)!important}
@media (max-width:560px){.brand .pb-word{height:11px}.brand span{display:none}}
h1{font-size:clamp(28px,4.6vw,44px)!important}.ev h3{font-size:20px!important}.ev.tool{margin-bottom:16px;border-color:rgba(255,255,255,.22)}.ev .qmark{width:112px;display:grid;place-items:center;color:#fff;opacity:.9}.plan{color:#fff!important;border-color:rgba(255,255,255,.3)!important}
@media (max-width:640px){.ev .qmark{display:none}}
</style>
</head>
<body>
<div class="top"><div class="in">
  <a class="brand" href="../" aria-label="Beloglazov Event"><svg class="pb-mark" viewBox="0 0 100 100" width="30" height="30" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M0,50a50,50 0 1,0 100,0a50,50 0 1,0 -100,0Z M9.76,50a40.24,35.68 0 1,0 80.48,0a40.24,35.68 0 1,0 -80.48,0Z M14.25,50a35.75,31.27 0 1,0 71.5,0a35.75,31.27 0 1,0 -71.5,0Z M40.48,50a9.52,9.52 0 1,0 19.04,0a9.52,9.52 0 1,0 -19.04,0Z"/></svg><img class="pb-word" src="../assets/wordmark-white.png" alt="Beloglazov Event"></a><span class="sp"></span>
  <button class="out" id="out" hidden data-t="out"></button>
  <button class="lang" id="lang">EN</button>
</div></div>
<div class="wrap">
  <div class="k" data-t="k"></div>
  <h1 data-t="h"></h1>
  <div id="view"></div>
</div>
<div class="toast" id="toast"></div>
<script>
(function () {
  var API = 'https://script.google.com/macros/s/AKfycbwvLVfMge8_eCpteZrgj-MpxqO1W_TvQoMAz0jxqx42W8ySqwz2xmutpwKfVGUGZXcG3w/exec';
  var I = {
    ru: { brand: 'Белоглазов', k: 'Для ведущих', h: 'Мои игры', out: 'Выйти',
      loginLead: 'Введите почту, на которую оформляли покупку, — пришлём ссылку для входа.', email: 'Email', send: 'Прислать ссылку',
      sent: 'Если такая покупка есть, письмо уже летит. Проверьте почту и папку «Спам».', loading: 'Загружаем…',
      pro: 'Подписка', proOff: 'Подписка неактивна', event: 'Одно мероприятие', newEv: '+ Новая игра', creating: 'Создаём…',
      admin: 'Панель ведущего', quizT: 'Квиз о паре', quizD: 'Редактор вопросов, запуск по коду и итоги. Квизы сохраняются в аккаунте.', quizB: 'Открыть квиз', guests: 'Ссылка для гостей', copied: 'Ссылка скопирована', created: 'Создана', until: 'до', guestsMax: 'до {n} гостей',
      noCouple: 'Секретная миссия', empty: 'Игр пока нет.', buy: 'Тарифы', expired: 'срок закончился', err: 'Ошибка: ',
      proLead: 'Создавайте игру под каждое событие — все они будут здесь.', evLead: 'Ваша игра — ниже. Для нескольких событий удобнее подписка.', getPro: 'Оформить подписку' },
    en: { brand: 'Beloglazov', k: 'For hosts', h: 'My games', out: 'Sign out',
      loginLead: 'Enter the email you used at checkout — we’ll send you a sign-in link.', email: 'Email', send: 'Send link',
      sent: 'If there’s a purchase with this email, the message is on its way. Check your inbox and spam.', loading: 'Loading…',
      pro: 'Subscription', proOff: 'Subscription inactive', event: 'One event', newEv: '+ New game', creating: 'Creating…',
      admin: 'Host panel', quizT: 'Couple Quiz', quizD: 'Question editor, code-based launch and results. Quizzes are saved to your account.', quizB: 'Open the quiz', guests: 'Guest link', copied: 'Link copied', created: 'Created', until: 'until', guestsMax: 'up to {n} guests',
      noCouple: 'Secret Mission', empty: 'No games yet.', buy: 'Pricing', expired: 'expired', err: 'Error: ',
      proLead: 'Create a game for every event — they’ll all live here.', evLead: 'Your game is below. For several events, a subscription is the better fit.', getPro: 'Subscribe' }
  };
  var L = (function () { try { var s = localStorage.getItem('pb_lang'); if (s === 'ru' || s === 'en') return s; } catch (e) {} return /^(ru|uk|be|kk)/i.test(navigator.language || 'ru') ? 'ru' : 'en'; })();
  var TK = 'pb_host_token', token = null, data = null;
  function T(k) { return I[L][k] || k; }
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function store(op, v) { try { if (op === 'get') return localStorage.getItem(TK); if (op === 'set') localStorage.setItem(TK, v); if (op === 'del') localStorage.removeItem(TK); } catch (e) {} return null; }
  function toast(t) { var el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(function () { el.classList.remove('on'); }, 2200); }
  function api(fn, args, n) {
    n = n || 0;
    return fetch(API, { method: 'POST', credentials: 'omit', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }) })
      .then(function (r) { return r.text(); })
      .then(function (t) {
        var j; try { j = JSON.parse(t); } catch (e) { if (n < 3) return new Promise(function (r) { setTimeout(r, 1500 * (n + 1)); }).then(function () { return api(fn, args, n + 1); }); throw new Error(L === 'en' ? 'Server is busy, try again' : 'Сервер занят, попробуйте ещё раз'); }
        if (!j.ok) throw new Error(String(j.error || '').replace(/^(Exception|Error):\s*/i, ''));
        return j.data;
      }, function (e) { if (n < 2) return new Promise(function (r) { setTimeout(r, 1500); }).then(function () { return api(fn, args, n + 1); }); throw e; });
  }
  function fmt(t) { return t ? new Date(t).toLocaleDateString(L === 'en' ? 'en-US' : 'ru-RU', { day: 'numeric', month: 'long', year: 'numeric' }) : ''; }
  function paintStatic() {
    document.documentElement.lang = L;
    [].forEach.call(document.querySelectorAll('[data-t]'), function (el) { el.textContent = T(el.dataset.t); });
    $('lang').textContent = L === 'ru' ? 'EN' : 'RU';
    $('out').hidden = !token;
    document.title = T('h') + ' · ' + T('brand');
  }
  function login() {
    $('view').innerHTML = '<div class="login"><p class="lead" style="margin:0 0 14px">' + esc(T('loginLead')) + '</p>' +
      '<label style="font-size:13px;color:var(--muted)">' + esc(T('email')) + '</label><input id="em" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com">' +
      '<button class="btn gold" id="send">' + esc(T('send')) + '</button><div class="msg" id="msg"></div></div>';
    var go = function () {
      var v = $('em').value.trim(); if (!v) return $('em').focus();
      var b = $('send'); b.disabled = true; $('msg').className = 'msg'; $('msg').textContent = '';
      api('pfHostLogin', [v, L]).then(function () { $('msg').className = 'msg ok'; $('msg').textContent = T('sent'); })
        .catch(function (e) { $('msg').className = 'msg err'; $('msg').textContent = e.message; })
        .then(function () { b.disabled = false; });
    };
    $('send').onclick = go; $('em').onkeydown = function (e) { if (e.key === 'Enter') go(); };
  }
  function render() {
    if (!data) { $('view').innerHTML = '<p class="lead">' + esc(T('loading')) + '</p>'; return; }
    var pro = data.plan === 'pro';
    var h = '<div class="bar"><span class="plan' + (pro && !data.active ? ' off' : '') + '">' + esc(pro ? (data.active ? T('pro') + (data.tierName ? ' · ' + data.tierName : '') : T('proOff')) : T('event')) + '</span>' +
      '<span style="color:var(--muted);font-size:14px">' + esc(data.email) + '</span><span class="sp" style="flex:1"></span>' +
      (pro && data.active ? '<button class="btn gold" id="newEv">' + esc(T('newEv')) + '</button>' : '<a class="btn ghost" href="../#pricing">' + esc(pro ? T('buy') : T('getPro')) + '</a>') + '</div>' +
      '<p class="lead">' + esc(pro ? T('proLead') : T('evLead')) + '</p>';
    h += '<div class="ev tool"><div><h3>' + esc(T('quizT')) + '</h3><div class="meta">' + esc(T('quizD')) + '</div><div class="acts"><a class="btn gold" href="../quiz/">' + esc(T('quizB')) + '</a></div></div><div class="qmark">' + (window.PB_BRAND ? PB_BRAND.mark(64) : '') + '</div></div>';
    if (!data.events.length) h += '<div class="empty">' + esc(T('empty')) + '</div>';
    else h += '<div class="list">' + data.events.map(function (ev, i) {
      var old = ev.exp && ev.exp < Date.now();
      return '<div class="ev' + (old ? ' old' : '') + '"><div><h3>' + esc(ev.couple || T('noCouple')) + '</h3>' +
        '<div class="meta">' + esc(T('created')) + ' ' + esc(fmt(ev.created)) + ' · ' + esc(T('guestsMax').replace('{n}', ev.max)) +
        (ev.exp ? ' · ' + (old ? esc(T('expired')) : esc(T('until')) + ' ' + esc(fmt(ev.exp))) : '') + '</div>' +
        '<div class="acts"><a class="btn gold" target="_blank" rel="noopener" href="' + esc(ev.adminUrl) + '">' + esc(T('admin')) + '</a>' +
        '<button class="btn ghost" data-copy="' + esc(ev.playUrl) + '">' + esc(T('guests')) + '</button></div></div>' +
        '<div class="qr" data-qr="' + esc(ev.playUrl) + '" id="qr' + i + '"></div></div>';
    }).join('') + '</div>';
    $('view').innerHTML = h;
    [].forEach.call(document.querySelectorAll('[data-qr]'), function (el) {
      try { new QRCode(el, { text: el.dataset.qr, width: 96, height: 96, correctLevel: QRCode.CorrectLevel.M }); } catch (e) {}
    });
    [].forEach.call(document.querySelectorAll('[data-copy]'), function (b) {
      b.onclick = function () {
        var u = b.dataset.copy;
        (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(function () { toast(T('copied')); }, function () { window.prompt(T('guests'), u); });
      };
    });
    var nb = $('newEv');
    if (nb) nb.onclick = function () {
      nb.disabled = true; nb.textContent = T('creating');
      api('pfHostNewEvent', [token]).then(function (d) { data = d; render(); }).catch(function (e) { toast(T('err') + e.message); nb.disabled = false; nb.textContent = T('newEv'); });
    };
  }
  function load() {
    data = null; render();
    api('pfHostEvents', [token]).then(function (d) { data = d; render(); })
      .catch(function (e) { store('del'); token = null; paintStatic(); login(); $('msg').className = 'msg err'; $('msg').textContent = e.message; });
  }
  $('lang').onclick = function () { L = L === 'ru' ? 'en' : 'ru'; try { localStorage.setItem('pb_lang', L); } catch (e) {} paintStatic(); if (token) render(); else login(); };
  $('out').onclick = function () { store('del'); token = null; data = null; paintStatic(); login(); };
  var q = new URLSearchParams(location.search), t = q.get('t');
  if (t) { store('set', t); try { history.replaceState(null, '', location.pathname); } catch (e) {} }
  token = store('get');
  try { if (token && localStorage.getItem('pb_next') === 'quiz') { localStorage.removeItem('pb_next'); location.replace('../quiz/'); return; } } catch (e) {}
  paintStatic();
  if (token) load(); else login();
})();
</script>
</body>
</html>
